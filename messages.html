<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
  <title>AfriMarket — Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{
      --blue:#1B3FE4;--blue2:#2D55FF;--red:#E83030;--orange:#FF6B1A;
      --turq:#00C2B7;--bg:#F2F5FF;--dark:#080E2A;--gray:#8892A8;
      --border:#E4E9F8;--gold:#F5B731;--green:#00C271;--nav-h:72px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);display:flex;flex-direction:column;}

    #viewList{display:flex;flex-direction:column;height:100%;overflow:hidden;}
    #viewChat{display:none;flex-direction:column;height:100%;overflow:hidden;}

    /* HEADER */
    .header{background:linear-gradient(135deg,var(--dark) 0%,#0D1E6B 100%);height:60px;padding:0 1.2rem;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;box-shadow:0 4px 20px rgba(8,14,42,.3);}
    .h-logo{font-family:'Clash Display',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:-1px;}
    .h-logo .la{color:var(--turq);}.h-logo .lm{color:var(--orange);}
    .h-back{color:rgba(255,255,255,.6);font-size:.82rem;font-weight:600;border:1px solid rgba(255,255,255,.15);padding:.35rem .8rem;border-radius:99px;text-decoration:none;transition:all .2s;}
    .h-back:hover{color:white;border-color:rgba(255,255,255,.4);}
    .h-ico{color:rgba(255,255,255,.6);font-size:.78rem;font-weight:600;}

    .list-scroll{flex:1;overflow-y:auto;padding:.8rem 0 calc(var(--nav-h)+8px);}

    /* CONV ITEM */
    .conv-item{display:flex;align-items:center;gap:.85rem;padding:.85rem 1.2rem;cursor:pointer;transition:background .2s;position:relative;}
    .conv-item:hover{background:rgba(27,63,228,.03);}
    .conv-item.unread{background:rgba(45,85,255,.04);}
    .conv-item+.conv-item{border-top:1px solid rgba(228,233,248,.6);}
    .ci-av{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,var(--turq),var(--blue2));display:flex;align-items:center;justify-content:center;font-family:'Clash Display',sans-serif;font-size:1.1rem;font-weight:700;color:white;flex-shrink:0;position:relative;overflow:hidden;}
    .ci-av img{width:100%;height:100%;border-radius:50%;object-fit:cover;}
    .ci-body{flex:1;min-width:0;}
    .ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.2rem;}
    .ci-name{font-family:'Clash Display',sans-serif;font-size:.9rem;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ci-time{font-size:.62rem;color:var(--gray);flex-shrink:0;margin-left:.5rem;}
    .ci-preview{font-size:.74rem;color:var(--gray);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ci-preview.unread-txt{color:var(--dark);font-weight:600;}
    .ci-ad{font-size:.62rem;color:var(--blue2);font-weight:600;margin-bottom:.15rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ci-badge{position:absolute;right:1.2rem;top:50%;transform:translateY(-50%);background:var(--blue2);color:white;font-size:.58rem;font-weight:800;padding:.15rem .45rem;border-radius:99px;min-width:18px;text-align:center;}

    /* CHAT HEADER */
    .chat-header{background:linear-gradient(135deg,var(--dark) 0%,#0D1E6B 100%);height:64px;padding:0 1rem;display:flex;align-items:center;gap:.8rem;flex-shrink:0;box-shadow:0 4px 20px rgba(8,14,42,.3);}
    .ch-back{background:none;border:none;color:rgba(255,255,255,.7);font-size:1.2rem;cursor:pointer;padding:.3rem;border-radius:8px;}
    .ch-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--turq),var(--blue2));display:flex;align-items:center;justify-content:center;font-family:'Clash Display',sans-serif;font-size:.9rem;font-weight:700;color:white;flex-shrink:0;overflow:hidden;}
    .ch-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .ch-info{flex:1;min-width:0;}
    .ch-name{font-family:'Clash Display',sans-serif;font-size:.95rem;font-weight:700;color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .ch-sub{font-size:.65rem;color:rgba(255,255,255,.4);}
    .ch-wa{background:rgba(0,194,113,.15);border:1px solid rgba(0,194,113,.3);border-radius:99px;padding:.3rem .7rem;font-size:.72rem;font-weight:700;color:#4DFFB4;cursor:pointer;white-space:nowrap;}

    /* ANNONCE CONTEXT */
    .ad-context{background:rgba(27,63,228,.06);border-bottom:1px solid var(--border);padding:.6rem 1.1rem;display:flex;align-items:center;gap:.7rem;flex-shrink:0;}
    .adc-img{width:36px;height:36px;border-radius:10px;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:1.1rem;overflow:hidden;flex-shrink:0;}
    .adc-img img{width:100%;height:100%;object-fit:cover;}
    .adc-title{font-size:.75rem;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .adc-price{font-size:.65rem;color:var(--blue2);font-weight:700;}

    /* MESSAGES */
    .msgs-zone{flex:1;overflow-y:auto;padding:.8rem 1rem;display:flex;flex-direction:column;gap:.5rem;scroll-behavior:smooth;}
    .msg-wrap{display:flex;gap:.5rem;max-width:85%;animation:msgIn .22s ease;}
    @keyframes msgIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
    .msg-wrap.me{align-self:flex-end;flex-direction:row-reverse;}
    .msg-wrap.them{align-self:flex-start;}
    .msg-av{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,var(--turq),var(--blue2));display:flex;align-items:center;justify-content:center;font-size:.65rem;font-weight:700;color:white;flex-shrink:0;margin-top:auto;}
    .msg-bubble{padding:.6rem .85rem;border-radius:18px;font-size:.83rem;line-height:1.5;word-break:break-word;}
    .msg-wrap.me .msg-bubble{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;border-bottom-right-radius:4px;}
    .msg-wrap.them .msg-bubble{background:white;color:var(--dark);border:1.5px solid var(--border);border-bottom-left-radius:4px;box-shadow:0 2px 8px rgba(27,63,228,.06);}
    .msg-time{font-size:.58rem;opacity:.55;margin-top:.25rem;display:block;text-align:right;}
    .msg-wrap.them .msg-time{text-align:left;}
    .msg-status{font-size:.62rem;opacity:.7;margin-top:.15rem;text-align:right;}

    .date-sep{text-align:center;margin:.5rem 0;}
    .date-sep span{font-size:.63rem;font-weight:700;color:var(--gray);background:var(--bg);padding:.2rem .7rem;border-radius:99px;border:1px solid var(--border);}

    /* TYPING */
    .typing-wrap{display:flex;gap:.5rem;padding:.4rem .5rem;align-self:flex-start;}
    .typing-dot{width:7px;height:7px;border-radius:50%;background:var(--gray);animation:typing 1.2s infinite;}
    .typing-dot:nth-child(2){animation-delay:.2s;}
    .typing-dot:nth-child(3){animation-delay:.4s;}
    @keyframes typing{0%,80%,100%{transform:scale(.8);opacity:.4}40%{transform:scale(1);opacity:1}}

    /* INPUT */
    .input-zone{background:white;border-top:1px solid var(--border);padding:.75rem 1rem;display:flex;align-items:flex-end;gap:.65rem;flex-shrink:0;padding-bottom:max(.75rem,env(safe-area-inset-bottom));}
    .msg-input{flex:1;border:1.5px solid var(--border);border-radius:22px;padding:.65rem 1rem;font-family:'Plus Jakarta Sans',sans-serif;font-size:.85rem;color:var(--dark);outline:none;resize:none;max-height:120px;line-height:1.4;transition:border-color .2s;background:var(--bg);}
    .msg-input:focus{border-color:var(--blue2);background:white;}
    .msg-send{width:42px;height:42px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));border:none;color:white;font-size:1.1rem;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .2s;box-shadow:0 4px 12px rgba(27,63,228,.3);}
    .msg-send:hover{transform:scale(1.08);}
    .msg-send:disabled{opacity:.4;cursor:not-allowed;transform:none;}

    /* SKELETON */
    .sk{background:linear-gradient(90deg,#F0F4FF 25%,#E4E9F8 50%,#F0F4FF 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:8px;}
    @keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:white;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 .5rem;box-shadow:0 -4px 20px rgba(8,14,42,.08);z-index:99;}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:.18rem;padding:.4rem .6rem;border:none;background:none;cursor:pointer;border-radius:12px;min-width:52px;position:relative;}
    .nav-ico{font-size:1.25rem;line-height:1;}
    .nav-lbl{font-size:.58rem;font-weight:600;color:var(--gray);}
    .nav-item.active .nav-lbl{color:var(--blue2);}
    .nav-plus-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;font-size:1.4rem;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(27,63,228,.4);}

    /* TOAST */
    #toast{position:fixed;bottom:calc(var(--nav-h)+12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:white;padding:.7rem 1.2rem;border-radius:14px;font-size:.82rem;font-weight:600;opacity:0;transition:all .35s;pointer-events:none;z-index:400;border-left:3px solid var(--turq);box-shadow:0 8px 24px rgba(8,14,42,.3);max-width:88vw;text-align:center;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

    .msgs-zone::-webkit-scrollbar,.list-scroll::-webkit-scrollbar{width:3px;}
    .msgs-zone::-webkit-scrollbar-thumb,.list-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}
  </style>
</head>
<body>

<!-- VUE LISTE -->
<div id="viewList">
  <div class="header">
    <a class="h-back" href="dashboard.html">← Accueil</a>
    <div class="h-logo"><span class="la">Afri</span><span class="lm">Market</span></div>
    <div class="h-ico" id="listCount">—</div>
  </div>

  <div class="list-scroll" id="convList">
    <div style="padding:.85rem 1.2rem;display:flex;gap:.85rem;align-items:center"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:.5rem"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:10px;width:80%"></div></div></div>
    <div style="padding:.85rem 1.2rem;display:flex;gap:.85rem;align-items:center"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:.5rem"><div class="sk" style="height:12px;width:45%"></div><div class="sk" style="height:10px;width:70%"></div></div></div>
    <div style="padding:.85rem 1.2rem;display:flex;gap:.85rem;align-items:center"><div class="sk" style="width:50px;height:50px;border-radius:50%;flex-shrink:0"></div><div style="flex:1;display:flex;flex-direction:column;gap:.5rem"><div class="sk" style="height:12px;width:55%"></div><div class="sk" style="height:10px;width:65%"></div></div></div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item" onclick="location.href='dashboard.html'"><span class="nav-ico">🏠</span><span class="nav-lbl">Accueil</span></button>
    <button class="nav-item active" style="position:relative;"><span class="nav-ico" style="position:relative;">💬<span id="navMsgBadge" style="display:none;position:absolute;top:-5px;right:-7px;background:#E83030;color:white;font-size:.5rem;font-weight:800;min-width:16px;height:16px;border-radius:99px;align-items:center;justify-content:center;padding:0 3px;"></span></span><span class="nav-lbl" style="color:var(--blue2);font-weight:700">Messages</span></button>
    <div class="nav-item"><button class="nav-plus-btn" onclick="location.href='dashboard.html'">➕</button><span class="nav-lbl" style="color:var(--blue2);font-weight:700">Publier</span></div>
    <button class="nav-item" onclick="location.href='gagner.html'"><span class="nav-ico">💰</span><span class="nav-lbl">Gagner</span></button>
    <button class="nav-item" onclick="location.href='profil.html'"><span class="nav-ico">👤</span><span class="nav-lbl">Profil</span></button>
  </nav>
</div>

<!-- VUE CHAT -->
<div id="viewChat">
  <div class="chat-header">
    <button class="ch-back" onclick="backToList()">←</button>
    <div class="ch-av" id="chAv">?</div>
    <div class="ch-info">
      <div class="ch-name" id="chName">—</div>
      <div class="ch-sub" id="chSub">AfriMarket</div>
    </div>
    <button class="ch-wa" id="chWaBtn">💬 WA</button>
  </div>

  <div class="ad-context" id="adContext" style="display:none">
    <div class="adc-img" id="adcImg">📦</div>
    <div style="flex:1;min-width:0;">
      <div class="adc-title" id="adcTitle">—</div>
      <div class="adc-price" id="adcPrice">—</div>
    </div>
  </div>

  <div class="msgs-zone" id="msgsZone"></div>

  <!-- Barre outils : éphémère, photo, groupe -->
  <div id="toolBar" style="display:none;border-top:1px solid var(--border);padding:.45rem .8rem;background:white;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap;">
    <button onclick="openMediaModal()" style="display:flex;align-items:center;gap:.3rem;padding:.35rem .7rem;border-radius:99px;background:#F4F6FC;border:1.5px solid var(--border);font-size:.72rem;font-weight:700;cursor:pointer;color:var(--dark);">📷 Photo/Vidéo</button>
    <button onclick="openEphemereModal()" style="display:flex;align-items:center;gap:.3rem;padding:.35rem .7rem;border-radius:99px;background:#F4F6FC;border:1.5px solid var(--border);font-size:.72rem;font-weight:700;cursor:pointer;color:var(--dark);">⏱ Éphémère</button>
    <button onclick="openGroupModal()" style="display:flex;align-items:center;gap:.3rem;padding:.35rem .7rem;border-radius:99px;background:#F4F6FC;border:1.5px solid var(--border);font-size:.72rem;font-weight:700;cursor:pointer;color:var(--dark);">👥 Groupe</button>
    <span id="ephemereBadge" style="display:none;font-size:.68rem;font-weight:700;background:rgba(255,107,26,.12);color:#FF6B1A;padding:.2rem .6rem;border-radius:99px;"></span>
  </div>
  <div class="input-zone" style="border-top:1px solid var(--border);">
    <button onclick="toggleToolBar()" style="background:none;border:none;font-size:1.2rem;cursor:pointer;padding:.3rem;color:var(--gray);flex-shrink:0;">＋</button>
    <textarea class="msg-input" id="msgInput" placeholder="Écrire un message…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
      oninput="autoResize(this)" disabled></textarea>
    <button class="msg-send" id="sendBtn" onclick="sendMsg()" disabled>➤</button>
  </div>
</div>

<!-- MODAL MÉDIA ─────────────────────── -->
<div id="mediaModal" style="display:none;position:fixed;inset:0;background:rgba(8,14,42,.6);z-index:300;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:1.5rem 1.3rem 2.5rem;" onclick="event.stopPropagation()">
    <div style="width:38px;height:4px;background:#E4E9F8;border-radius:99px;margin:0 auto 1.2rem;"></div>
    <div style="font-weight:700;font-size:.95rem;margin-bottom:.9rem;">📷 Envoyer une photo ou vidéo</div>
    <label style="display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:1.5rem;border:2px dashed var(--border);border-radius:14px;cursor:pointer;margin-bottom:.8rem;font-size:.85rem;color:var(--gray);">
      <span style="font-size:1.8rem;">📎</span> Choisir un fichier (image ou vidéo)
      <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display:none;" onchange="sendMedia(this)"/>
    </label>
    <div style="margin-bottom:.8rem;">
      <label style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);display:block;margin-bottom:.3rem;">Légende (optionnelle)</label>
      <input id="mediaCaption" type="text" placeholder="Ajouter une légende…" style="width:100%;padding:.65rem .85rem;border-radius:12px;border:1.5px solid var(--border);font-size:.88rem;outline:none;"/>
    </div>
    <button onclick="closeMediaModal()" style="width:100%;padding:.65rem;border-radius:12px;background:transparent;color:var(--gray);border:1px solid var(--border);font-size:.82rem;cursor:pointer;">Annuler</button>
  </div>
</div>

<!-- MODAL ÉPHÉMÈRE ──────────────────── -->
<div id="ephemereModal" style="display:none;position:fixed;inset:0;background:rgba(8,14,42,.6);z-index:300;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:1.5rem 1.3rem 2.5rem;" onclick="event.stopPropagation()">
    <div style="width:38px;height:4px;background:#E4E9F8;border-radius:99px;margin:0 auto 1.2rem;"></div>
    <div style="font-weight:700;font-size:.95rem;margin-bottom:.3rem;">⏱ Messages éphémères</div>
    <div style="font-size:.78rem;color:var(--gray);margin-bottom:1rem;">Les messages se suppriment automatiquement après la durée choisie.</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.8rem;">
      <button onclick="setEphemereDuration(30,'30 secondes')" style="padding:.7rem;border-radius:12px;background:#F4F6FC;border:1.5px solid var(--border);font-size:.82rem;font-weight:700;cursor:pointer;">30 secondes</button>
      <button onclick="setEphemereDuration(300,'5 minutes')" style="padding:.7rem;border-radius:12px;background:#F4F6FC;border:1.5px solid var(--border);font-size:.82rem;font-weight:700;cursor:pointer;">5 minutes</button>
      <button onclick="setEphemereDuration(3600,'1 heure')" style="padding:.7rem;border-radius:12px;background:#F4F6FC;border:1.5px solid var(--border);font-size:.82rem;font-weight:700;cursor:pointer;">1 heure</button>
      <button onclick="setEphemereDuration(86400,'24 heures')" style="padding:.7rem;border-radius:12px;background:#F4F6FC;border:1.5px solid var(--border);font-size:.82rem;font-weight:700;cursor:pointer;">24 heures</button>
    </div>
    <button onclick="setEphemereDuration(null,'Désactivé')" style="width:100%;padding:.7rem;border-radius:12px;background:rgba(232,48,48,.08);color:#E83030;border:1.5px solid rgba(232,48,48,.2);font-size:.82rem;font-weight:700;cursor:pointer;margin-bottom:.5rem;">🚫 Désactiver les éphémères</button>
    <button onclick="closeEphemereModal()" style="width:100%;padding:.65rem;border-radius:12px;background:transparent;color:var(--gray);border:1px solid var(--border);font-size:.82rem;cursor:pointer;">Annuler</button>
  </div>
</div>

<!-- MODAL GROUPE ─────────────────────── -->
<div id="groupModal" style="display:none;position:fixed;inset:0;background:rgba(8,14,42,.6);z-index:300;align-items:flex-end;justify-content:center;">
  <div style="background:white;border-radius:24px 24px 0 0;width:100%;max-width:480px;padding:1.5rem 1.3rem 2.5rem;max-height:85vh;overflow-y:auto;" onclick="event.stopPropagation()">
    <div style="width:38px;height:4px;background:#E4E9F8;border-radius:99px;margin:0 auto 1.2rem;"></div>
    <div style="font-weight:700;font-size:.95rem;margin-bottom:.8rem;">👥 Créer un groupe</div>
    <div style="margin-bottom:.8rem;">
      <label style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);display:block;margin-bottom:.3rem;">Nom du groupe *</label>
      <input id="groupName" type="text" placeholder="Ex: Groupe AfriMarket Yaoundé" style="width:100%;padding:.65rem .85rem;border-radius:12px;border:1.5px solid var(--border);font-size:.88rem;outline:none;"/>
    </div>
    <div style="font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--gray);margin-bottom:.4rem;">Membres</div>
    <div id="groupMembersList" style="max-height:200px;overflow-y:auto;border:1.5px solid var(--border);border-radius:12px;margin-bottom:.8rem;"></div>
    <button onclick="creerGroupe()" style="width:100%;padding:.8rem;border-radius:14px;background:linear-gradient(135deg,#1B3FE4,#00C2B7);color:white;font-weight:700;font-size:.9rem;border:none;cursor:pointer;margin-bottom:.5rem;">✅ Créer le groupe</button>
    <button onclick="closeGroupModal()" style="width:100%;padding:.65rem;border-radius:12px;background:transparent;color:var(--gray);border:1px solid var(--border);font-size:.82rem;cursor:pointer;">Annuler</button>
  </div>
</div>

<div id="toast"></div>

var sb = _sb;
var U=null, myProfile={};
var currentConvId=null, currentOther={};
var allMsgs=[], allConvs=[];
var realtimeChat=null, realtimeList=null;
var EPHEMERE_DURATION=null, EPHEMERE_TIMER=null;

(async function(){
  var s = await sb.auth.getSession();
  if(!s.data.session){location.href='auth.html';return;}
  U = s.data.session.user;
  var rp = await sb.from('profiles').select('*').eq('id',U.id).single();
  if(rp.data) myProfile = rp.data;
  var params = new URLSearchParams(location.search);
  await loadConversations();
  setupListRealtime();
  updateNavBadge();
  var withId = params.get('with');
  var adId   = params.get('ad');
  if(withId) await openOrCreateConv(withId, adId);
})();

/* ── CONVERSATIONS ─────────────────────── */
async function loadConversations(){
  var r = await sb.from('conversations')
    .select('*').or('participant_1.eq.'+U.id+',participant_2.eq.'+U.id)
    .order('last_message_at',{ascending:false});
  allConvs = r.data||[];
  if(!allConvs.length){showEmptyList();return;}

  var otherIds = allConvs.map(function(c){return c.participant_1===U.id?c.participant_2:c.participant_1;});
  var rp = await sb.from('profiles').select('id,full_name,avatar_url,is_premium').in('id',otherIds);
  var pm={};
  (rp.data||[]).forEach(function(p){pm[p.id]=p;});

  var ru = await sb.from('messages').select('conversation_id')
    .in('conversation_id',allConvs.map(function(c){return c.id;}))
    .eq('read',false).neq('sender_id',U.id);
  var uMap={};
  (ru.data||[]).forEach(function(r){uMap[r.conversation_id]=(uMap[r.conversation_id]||0)+1;});

  var el=document.getElementById('convList');
  var cntEl=document.getElementById('listCount');
  if(cntEl)cntEl.textContent=allConvs.length+' conversation'+(allConvs.length>1?'s':'');

  el.innerHTML=allConvs.map(function(conv){
    var othId=conv.participant_1===U.id?conv.participant_2:conv.participant_1;
    var oth=pm[othId]||{};
    var name=oth.full_name||'Utilisateur';
    var init=name[0].toUpperCase();
    var unread=uMap[conv.id]||0;
    var t=conv.last_message_at?timeAgo(conv.last_message_at):'';
    var isGroup=conv.is_group;
    var displayName=isGroup?(conv.group_name||'Groupe'):name;
    return '<div class="conv-item" id="conv-'+conv.id+'" onclick="openConv(\''+conv.id+'\',\''+othId+'\')">' +
      '<div class="conv-av">'+(oth.avatar_url?'<img src="'+esc(oth.avatar_url)+'"/>':init)+(isGroup?'<span style="position:absolute;bottom:0;right:0;background:#1B3FE4;color:white;font-size:.5rem;border-radius:99px;padding:.1rem .3rem;">GRP</span>':'')+'</div>'+
      '<div class="conv-body">'+
        '<div class="conv-name">'+esc(displayName)+(oth.is_premium?'<span style="margin-left:.3rem;font-size:.65rem;">👑</span>':'')+'</div>'+
        '<div class="conv-last">'+esc((conv.last_message||'').slice(0,40))+'</div>'+
      '</div>'+
      '<div class="conv-meta">'+
        '<div class="conv-time">'+t+'</div>'+
        (unread?'<div class="conv-badge">'+unread+'</div>':'')+
      '</div>'+
    '</div>';
  }).join('');
}

function showEmptyList(){
  document.getElementById('convList').innerHTML=
    '<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;color:var(--gray)">'+
    '<div style="font-size:2.5rem;margin-bottom:.6rem">💬</div>'+
    '<div style="font-family:\'Clash Display\',sans-serif;font-size:.9rem;font-weight:700;color:var(--dark);margin-bottom:.3rem">Aucune conversation</div>'+
    '<div style="font-size:.74rem;line-height:1.6">Contacte un vendeur depuis une annonce.</div></div>';
}

async function openOrCreateConv(otherId, adId){
  var existing=allConvs.find(function(c){return (c.participant_1===U.id&&c.participant_2===otherId)||(c.participant_1===otherId&&c.participant_2===U.id);});
  if(existing){await openConv(existing.id,otherId);return;}
  var r=await sb.from('conversations').insert({participant_1:U.id,participant_2:otherId,last_message:'',last_message_at:new Date().toISOString()}).select().single();
  if(r.error){showToast('Erreur: '+r.error.message,'error');return;}
  allConvs.unshift(r.data);
  await loadConversations();
  await openConv(r.data.id,otherId,adId);
}

async function openConv(convId, otherId, adId){
  currentConvId=convId;
  if(realtimeChat)realtimeChat.unsubscribe();
  var roth=await sb.from('profiles').select('*').eq('id',otherId).single();
  var oth=roth.data||{};
  currentOther={id:otherId,name:oth.full_name||'Utilisateur',avatar:oth.avatar_url||'',wa:oth.whatsapp||''};
  document.getElementById('chName').textContent=currentOther.name;
  document.getElementById('chSub').textContent='En ligne';
  var av=document.getElementById('chAv');
  av.innerHTML=oth.avatar_url?'<img src="'+esc(oth.avatar_url)+'" style="width:100%;height:100%;border-radius:50%;object-fit:cover;"/>':currentOther.name[0].toUpperCase();
  var waBtn=document.getElementById('chWaBtn');
  if(waBtn){waBtn.style.display=currentOther.wa?'':'none';}
  document.getElementById('viewList').style.display='none';
  document.getElementById('viewChat').style.display='flex';
  document.getElementById('msgInput').disabled=false;
  document.getElementById('sendBtn').disabled=false;
  await loadMessages();
  startChatRealtime();
  sb.from('messages').update({read:true}).eq('conversation_id',convId).neq('sender_id',U.id).then(function(){});
}

async function loadMessages(){
  var r=await sb.from('messages').select('*').eq('conversation_id',currentConvId).order('created_at',{ascending:true});
  var now=new Date();
  allMsgs=(r.data||[]).filter(function(msg){
    if(msg.is_deleted)return false;
    if(msg.expires_at&&new Date(msg.expires_at)<now)return false;
    return true;
  });
  renderMessages();
}

/* ── RENDU ─────────────────────────────── */
function renderMessages(){
  var zone=document.getElementById('msgsZone');
  if(!allMsgs.length){
    zone.innerHTML='<div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;text-align:center;color:var(--gray)">'+
      '<div style="font-size:2.5rem;margin-bottom:.6rem">👋</div>'+
      '<div style="font-size:.9rem;font-weight:700;color:var(--dark);margin-bottom:.3rem">Démarrez la conversation</div>'+
      '<div style="font-size:.74rem">Dites bonjour à '+esc(currentOther.name||'…')+' !</div></div>';
    return;
  }
  var html='<div style="flex:1"></div>';
  var lastDate='';
  allMsgs.forEach(function(msg){
    if(msg.is_deleted)return;
    if(msg.expires_at&&new Date(msg.expires_at)<new Date())return;
    var d=new Date(msg.created_at);
    var dateStr=d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'});
    if(dateStr!==lastDate){html+='<div class="date-sep"><span>'+dateStr+'</span></div>';lastDate=dateStr;}
    var isMe=msg.sender_id===U.id;
    var time=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    var init=isMe?(myProfile.full_name||'M')[0].toUpperCase():(currentOther.name||'?')[0].toUpperCase();

    // Badge éphémère
    var epBadge='';
    if(msg.expires_at){
      var remaining=Math.max(0,Math.floor((new Date(msg.expires_at)-new Date())/1000));
      epBadge='<span style="font-size:.58rem;opacity:.7;margin-left:.3rem;">⏱ '+remaining+'s</span>';
    }

    // Contenu
    var content='';
    if(msg.media_url){
      var isVid=msg.media_type==='video';
      if(isVid){
        content='<video src="'+esc(msg.media_url)+'" style="max-width:200px;border-radius:10px;display:block;margin-bottom:.3rem;" controls></video>';
      }else{
        content='<img src="'+esc(msg.media_url)+'" style="max-width:200px;border-radius:10px;display:block;margin-bottom:.3rem;cursor:pointer;" onclick="window.open(this.src,\'_blank\')"/>';
      }
      if(msg.content)content+='<span>'+esc(msg.content)+'</span>';
    }else{
      content=esc(msg.content||'');
    }

    // Bouton supprimer (uniquement mes messages)
    var delBtn=isMe?'<button onclick="deleteMessage(\''+msg.id+'\')" style="position:absolute;top:-6px;right:-22px;background:rgba(8,14,42,.08);border:none;border-radius:50%;width:20px;height:20px;font-size:.65rem;cursor:pointer;color:#8892A4;display:flex;align-items:center;justify-content:center;">✕</button>':'';

    html+='<div class="msg-wrap '+(isMe?'me':'them')+'" id="msg-'+msg.id+'" style="position:relative;">'+
      (!isMe?'<div class="msg-av">'+init+'</div>':'')+
      '<div style="position:relative;">'+
        '<div class="msg-bubble">'+content+'<span class="msg-time">'+time+epBadge+'</span></div>'+
        delBtn+
        (isMe?'<div class="msg-status" style="color:'+(msg.read?'#4DFFB4':'rgba(100,120,200,.6)')+';">'+(msg.read?'✓✓ Lu':'✓ Envoyé')+'</div>':'')+
      '</div>'+
      (isMe?'<div class="msg-av" style="background:linear-gradient(135deg,var(--orange),var(--gold))">'+init+'</div>':'')+
    '</div>';
  });
  zone.innerHTML=html;
  scrollBottom();
}

/* ── ENVOYER ───────────────────────────── */
async function sendMsg(){
  var inp=document.getElementById('msgInput');
  var content=inp.value.trim();
  if(!content||!currentConvId)return;
  var btn=document.getElementById('sendBtn');
  btn.disabled=true;inp.value='';inp.style.height='auto';
  var expiresAt=EPHEMERE_DURATION?new Date(Date.now()+EPHEMERE_DURATION*1000).toISOString():null;
  var temp={id:'tmp_'+Date.now(),conversation_id:currentConvId,sender_id:U.id,content:content,read:false,created_at:new Date().toISOString(),expires_at:expiresAt,media_url:null};
  allMsgs.push(temp);renderMessages();
  try{
    var payload={conversation_id:currentConvId,sender_id:U.id,content:content,read:false};
    if(expiresAt)payload.expires_at=expiresAt;
    var r=await sb.from('messages').insert(payload).select().single();
    if(r.error)throw r.error;
    var idx=allMsgs.findIndex(function(m){return m.id===temp.id;});
    if(idx!==-1)allMsgs[idx]=r.data;
    renderMessages();
    await sb.from('conversations').update({last_message:content.length>60?content.slice(0,60)+'…':content,last_message_at:new Date().toISOString()}).eq('id',currentConvId);
    await sb.from('notifications').insert({user_id:currentOther.id,title:'💬 Message de '+(myProfile.full_name||'Quelqu\'un'),message:content.length>80?content.slice(0,80)+'…':content,icon:'💬',type:'info',read:false,created_at:new Date().toISOString()});
  }catch(e){
    allMsgs=allMsgs.filter(function(m){return m.id!==temp.id;});
    renderMessages();inp.value=content;
    showToast('Erreur: '+e.message,'error');
  }finally{btn.disabled=false;inp.focus();}
}

/* ── SUPPRIMER MESSAGE ─────────────────── */
async function deleteMessage(msgId){
  if(!confirm('Supprimer ce message ?'))return;
  try{
    var r=await sb.from('messages').update({is_deleted:true,content:''}).eq('id',msgId).eq('sender_id',U.id);
    if(r.error)throw r.error;
    allMsgs=allMsgs.filter(function(m){return m.id!==msgId;});
    renderMessages();
    showToast('Message supprimé','success');
  }catch(e){showToast('Erreur: '+e.message,'error');}
}

/* ── ENVOYER MÉDIA ─────────────────────── */
async function sendMedia(input){
  var file=input.files[0];if(!file)return;
  if(file.size>20*1024*1024){showToast('Fichier trop grand (max 20 Mo)','warning');return;}
  var isVideo=file.type.startsWith('video/');
  showToast('Envoi en cours…','info');
  try{
    var ext=file.name.split('.').pop();
    var path=U.id+'/msg-'+Date.now()+'.'+ext;
    var buckets=['boutique-media','avatars'];
    var url=null;
    for(var bi=0;bi<buckets.length;bi++){
      var up=await sb.storage.from(buckets[bi]).upload(path,file,{upsert:true,contentType:file.type});
      if(!up.error){url=sb.storage.from(buckets[bi]).getPublicUrl(path).data.publicUrl;break;}
    }
    var captionEl=document.getElementById('mediaCaption');
    var captionText=captionEl?captionEl.value.trim():'';
    closeMediaModal();
    var expiresAt=EPHEMERE_DURATION?new Date(Date.now()+EPHEMERE_DURATION*1000).toISOString():null;
    var payload={conversation_id:currentConvId,sender_id:U.id,content:captionText,read:false,media_url:url||'',media_type:isVideo?'video':'image'};
    if(expiresAt)payload.expires_at=expiresAt;
    var r=await sb.from('messages').insert(payload).select().single();
    if(r.error)throw r.error;
    allMsgs.push(r.data);renderMessages();
    await sb.from('conversations').update({last_message:isVideo?'🎥 Vidéo':'📷 Photo',last_message_at:new Date().toISOString()}).eq('id',currentConvId);
    showToast('Envoyé !','success');
  }catch(e){showToast('Erreur: '+e.message,'error');}
  finally{input.value='';}
}

/* ── MODALS ────────────────────────────── */
function openMediaModal(){var m=document.getElementById('mediaModal');if(m)m.style.display='flex';}
function closeMediaModal(){var m=document.getElementById('mediaModal');if(m)m.style.display='none';}
function openEphemereModal(){var m=document.getElementById('ephemereModal');if(m)m.style.display='flex';}
function closeEphemereModal(){var m=document.getElementById('ephemereModal');if(m)m.style.display='none';}
function openGroupModal(){var m=document.getElementById('groupModal');if(m){m.style.display='flex';loadGroupMembers();}}
function closeGroupModal(){var m=document.getElementById('groupModal');if(m)m.style.display='none';}

function setEphemereDuration(secs,label){
  EPHEMERE_DURATION=secs;
  closeEphemereModal();
  var badge=document.getElementById('ephemereBadge');
  if(badge){badge.textContent=secs?'⏱ '+label:'';badge.style.display=secs?'inline-block':'none';}
  showToast(secs?'Messages éphémères: '+label:'Éphémères désactivés','success');
  clearInterval(EPHEMERE_TIMER);
  if(secs){
    EPHEMERE_TIMER=setInterval(function(){
      allMsgs=allMsgs.filter(function(m){return !m.expires_at||new Date(m.expires_at)>new Date();});
      renderMessages();
    },5000);
  }
}

/* ── GROUPES ────────────────────────────── */
async function loadGroupMembers(){
  var el=document.getElementById('groupMembersList');if(!el)return;
  el.innerHTML='<div style="font-size:.78rem;color:#8892A4;padding:.5rem;">Chargement…</div>';
  try{
    var r=await sb.from('profiles').select('id,full_name').neq('id',U.id).limit(30).order('full_name');
    if(!r.data||!r.data.length){el.innerHTML='<div style="font-size:.78rem;color:#8892A4;padding:.5rem;">Aucun utilisateur</div>';return;}
    el.innerHTML=r.data.map(function(p){
      return '<label style="display:flex;align-items:center;gap:.6rem;padding:.5rem;cursor:pointer;font-size:.82rem;border-bottom:1px solid var(--border);">'+
        '<input type="checkbox" value="'+p.id+'" style="width:16px;height:16px;cursor:pointer;"/>'+
        '<div style="width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#1B3FE4);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.8rem;flex-shrink:0;">'+p.full_name[0].toUpperCase()+'</div>'+
        esc(p.full_name)+'</label>';
    }).join('');
  }catch(e){el.innerHTML='<div style="font-size:.78rem;color:#E83030;padding:.5rem;">Erreur chargement</div>';}
}

async function creerGroupe(){
  var nom=(document.getElementById('groupName')||{}).value;
  nom=nom?nom.trim():'';
  if(!nom){showToast('Nom du groupe obligatoire','warning');return;}
  var checked=[].slice.call(document.querySelectorAll('#groupMembersList input:checked')).map(function(i){return i.value;});
  if(!checked.length){showToast('Sélectionne au moins un membre','warning');return;}
  try{
    var members=[U.id].concat(checked);
    var r=await sb.from('conversations').insert({
      participant_1:U.id,participant_2:checked[0],
      last_message:'[Groupe] '+nom,last_message_at:new Date().toISOString()
    }).select().single();
    if(r.error)throw r.error;
    await sb.from('messages').insert({conversation_id:r.data.id,sender_id:U.id,content:'Groupe "'+nom+'" créé ! '+members.length+' membres.',read:false});
    closeGroupModal();
    allConvs.unshift(r.data);
    await loadConversations();
    await openConv(r.data.id,checked[0]);
    showToast('Groupe "'+nom+'" créé !','success');
  }catch(e){showToast('Erreur: '+e.message,'error');}
}

/* ── BADGE NAV ─────────────────────────── */
async function updateNavBadge(){
  try{
    var convIds=allConvs.map(function(c){return c.id;});
    if(!convIds.length)return;
    var r=await sb.from('messages').select('id',{count:'exact',head:true}).in('conversation_id',convIds).eq('read',false).neq('sender_id',U.id);
    var badge=document.getElementById('navMsgBadge');
    if(badge){
      if(r.count>0){badge.textContent=r.count>99?'99+':r.count;badge.style.display='flex';}
      else badge.style.display='none';
    }
  }catch(e){}
}

/* ── REALTIME ──────────────────────────── */
function startChatRealtime(){
  realtimeChat=sb.channel('chat-'+currentConvId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+currentConvId},function(payload){
      if(payload.new.sender_id===U.id)return;
      if(payload.new.is_deleted)return;
      allMsgs.push(payload.new);renderMessages();
      sb.from('messages').update({read:true}).eq('id',payload.new.id).then(function(){});
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+currentConvId},function(payload){
      if(payload.new.is_deleted){allMsgs=allMsgs.filter(function(m){return m.id!==payload.new.id;});}
      else{var idx=allMsgs.findIndex(function(m){return m.id===payload.new.id;});if(idx!==-1)allMsgs[idx]=payload.new;}
      renderMessages();
    })
    .subscribe();
}
function setupListRealtime(){
  realtimeList=sb.channel('convlist-'+U.id)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations'},function(){loadConversations();updateNavBadge();})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(){updateNavBadge();})
    .subscribe();
}

/* ── UTILS ─────────────────────────────── */
function backToList(){
  if(realtimeChat){realtimeChat.unsubscribe();realtimeChat=null;}
  currentConvId=null;
  document.getElementById('viewChat').style.display='none';
  document.getElementById('viewList').style.display='flex';
  loadConversations();
}
function contactWA(){var n=(currentOther.wa||'').replace(/\D/g,'');if(n)window.open('https://wa.me/'+n,'_blank');}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function scrollBottom(){var z=document.getElementById('msgsZone');if(z)z.scrollTop=z.scrollHeight;}
function timeAgo(ts){var s=Math.floor((Date.now()-new Date(ts))/1000);if(s<60)return 'A l\'instant';if(s<3600)return Math.floor(s/60)+'min';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'j';}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function showToast(msg,type){var el=document.getElementById('toast');if(!el)return;el.textContent=msg;el.className='show';if(type==='success')el.style.background='#00C271';else if(type==='error')el.style.background='#E83030';else if(type==='warning')el.style.background='#FF6B1A';else el.style.background='#080E2A';setTimeout(function(){el.className='';el.style.background='';},4000);}
function loadPremiumBadge(){}

function toggleToolBar(){
  var tb=document.getElementById('toolBar');
  if(!tb)return;
  tb.style.display=tb.style.display==='none'||tb.style.display===''?'flex':'none';
}

</script>
