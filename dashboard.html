<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AfriMarket • Tableau de bord</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --blue: #1B3FE4;
      --blue2: #2D55FF;
      --red: #E83030;
      --orange: #FF6B1A;
      --turq: #00C2B7;
      --white: #FFFFFF;
      --bg: #F0F4FF;
      --dark: #080E2A;
      --gray: #8892A8;
      --border: #DDE3F5;
      --success: #00C2B7;
      --error: #E83030;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      color: var(--dark);
    }

    /* navigation */
    .nav {
      background: white;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid var(--border);
      box-shadow: 0 4px 20px rgba(0,0,0,0.02);
    }

    .logo {
      font-family: 'Clash Display', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .logo span:first-child { color: var(--turq); }
    .logo span:last-child { color: var(--orange); }

    .nav-links {
      display: flex;
      gap: 1.2rem;
    }
    .nav-links a {
      color: var(--gray);
      text-decoration: none;
      font-weight: 500;
      font-size: 0.95rem;
      transition: color 0.2s;
      padding: 0.5rem 0.8rem;
      border-radius: 8px;
      cursor: pointer;
    }
    .nav-links a:hover, .nav-links a.active {
      color: var(--blue2);
      background: var(--bg);
    }

    .user-badge {
      display: flex;
      align-items: center;
      gap: 1rem;
      background: var(--bg);
      padding: 0.4rem 0.8rem 0.4rem 1.2rem;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .user-badge:hover {
      background: #e0e8ff;
    }
    .user-avatar {
      background: linear-gradient(135deg, var(--turq), var(--blue2));
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      font-size: 1.1rem;
    }
    .user-info {
      text-align: right;
    }
    .user-name {
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--dark);
    }
    .user-email {
      font-size: 0.7rem;
      color: var(--gray);
    }

    /* layout */
    .dashboard {
      max-width: 1300px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    /* welcome */
    .welcome-card {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      margin-bottom: 2rem;
      border: 1px solid var(--border);
      box-shadow: 0 10px 30px rgba(27,63,228,0.05);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .welcome h1 {
      font-family: 'Clash Display', sans-serif;
      font-size: 1.8rem;
      margin-bottom: 0.2rem;
    }
    .welcome p {
      color: var(--gray);
    }
    .stats-mini {
      display: flex;
      gap: 2rem;
    }
    .stat-mini {
      text-align: center;
    }
    .stat-mini .number {
      font-family: 'Clash Display', sans-serif;
      font-size: 1.6rem;
      font-weight: 600;
      color: var(--blue2);
    }
    .stat-mini .label {
      font-size: 0.8rem;
      color: var(--gray);
    }

    /* quick actions */
    .section-title {
      font-family: 'Clash Display', sans-serif;
      font-size: 1.4rem;
      margin: 2rem 0 1rem;
    }
    .actions-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 1rem;
      margin-bottom: 2rem;
    }
    .action-card {
      background: white;
      border-radius: 18px;
      padding: 1.5rem;
      border: 1px solid var(--border);
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: pointer;
      text-align: center;
    }
    .action-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 15px 35px rgba(27,63,228,0.1);
      border-color: var(--blue2);
    }
    .action-icon {
      font-size: 2.2rem;
      margin-bottom: 0.8rem;
    }
    .action-card h3 {
      font-size: 1rem;
      font-weight: 600;
      color: var(--dark);
    }
    .action-card p {
      font-size: 0.8rem;
      color: var(--gray);
      margin-top: 0.2rem;
    }

    /* mes annonces */
    .ads-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin: 2rem 0 1rem;
    }
    .btn-primary {
      background: linear-gradient(135deg, var(--blue) 0%, var(--blue2) 100%);
      color: white;
      border: none;
      padding: 0.7rem 1.5rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(27,63,228,0.3);
    }

    .ads-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(270px, 1fr));
      gap: 1.5rem;
    }
    .ad-card {
      background: white;
      border-radius: 20px;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.2s;
    }
    .ad-card:hover {
      transform: scale(1.02);
      box-shadow: 0 10px 25px rgba(0,0,0,0.05);
    }
    .ad-img {
      height: 140px;
      background: linear-gradient(145deg, #f8f9ff, #eef2fe);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: var(--blue2);
    }
    .ad-body {
      padding: 1.2rem;
    }
    .ad-title {
      font-weight: 700;
      margin-bottom: 0.3rem;
    }
    .ad-price {
      color: var(--blue2);
      font-weight: 700;
      font-size: 1.2rem;
      margin: 0.5rem 0;
    }
    .ad-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.75rem;
      color: var(--gray);
      border-top: 1px solid var(--border);
      margin-top: 0.8rem;
      padding-top: 0.8rem;
    }
    .ad-status {
      background: #e9f6f4;
      color: var(--turq);
      font-weight: 600;
      padding: 0.2rem 0.8rem;
      border-radius: 40px;
    }

    /* profil */
    .profile-section {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid var(--border);
      margin-top: 2rem;
    }
    .profile-header {
      display: flex;
      gap: 2rem;
      align-items: center;
      flex-wrap: wrap;
    }
    .profile-avatar {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--turq), var(--blue2));
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      color: white;
      font-weight: 600;
    }
    .profile-info h2 {
      font-size: 1.8rem;
    }
    .profile-info p {
      color: var(--gray);
      margin: 0.3rem 0;
    }

    /* messages */
    .messages-list {
      background: white;
      border-radius: 24px;
      border: 1px solid var(--border);
      margin-top: 2rem;
    }
    .message-item {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1.2rem 1.5rem;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: background 0.2s;
    }
    .message-item:last-child {
      border-bottom: none;
    }
    .message-item:hover {
      background: var(--bg);
    }
    .message-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: linear-gradient(135deg, #f0f4ff, #d9e2ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 600;
      color: var(--blue2);
    }
    .message-content {
      flex: 1;
    }
    .message-name {
      font-weight: 600;
      margin-bottom: 0.2rem;
    }
    .message-preview {
      font-size: 0.85rem;
      color: var(--gray);
    }
    .message-date {
      font-size: 0.7rem;
      color: var(--gray);
    }

    /* favoris */
    .favorites-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 1rem;
      margin-top: 1.5rem;
    }

    /* paramètres */
    .settings-card {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      border: 1px solid var(--border);
      margin-top: 2rem;
    }
    .settings-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
    }
    .settings-item:last-child {
      border-bottom: none;
    }

    /* loader */
    .loader {
      text-align: center;
      padding: 3rem;
      color: var(--gray);
    }

    /* modal déconnexion */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.5);
      z-index: 1000;
      align-items: center;
      justify-content: center;
    }
    .modal.active {
      display: flex;
    }
    .modal-content {
      background: white;
      border-radius: 24px;
      padding: 2rem;
      max-width: 400px;
      width: 90%;
    }
    .modal-buttons {
      display: flex;
      gap: 1rem;
      margin-top: 1.5rem;
    }
    .modal-buttons button {
      flex: 1;
      padding: 0.8rem;
      border: none;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-confirm {
      background: var(--red);
      color: white;
    }
    .btn-cancel {
      background: var(--bg);
      color: var(--dark);
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <!-- navigation -->
  <div class="nav">
    <div class="logo">
      <span>Afri</span><span>Market</span>
    </div>
    <div class="nav-links">
      <a class="active" data-page="dashboard">Dashboard</a>
      <a data-page="annonces">Mes annonces</a>
      <a data-page="messages">Messages</a>
      <a data-page="favoris">Favoris</a>
      <a data-page="profil">Profil</a>
      <a data-page="parametres">Paramètres</a>
    </div>
    <div class="user-badge" id="userBadge">
      <div class="user-info">
        <div class="user-name" id="userName">Chargement...</div>
        <div class="user-email" id="userEmail"></div>
      </div>
      <div class="user-avatar" id="userAvatar">A</div>
    </div>
  </div>

  <!-- dashboard content -->
  <div class="dashboard" id="dashboardContent">
    <div class="loader">Chargement du tableau de bord...</div>
  </div>

  <!-- modal déconnexion -->
  <div class="modal" id="logoutModal">
    <div class="modal-content">
      <h3>Déconnexion</h3>
      <p>Êtes-vous sûr de vouloir vous déconnecter ?</p>
      <div class="modal-buttons">
        <button class="btn-cancel" onclick="closeLogoutModal()">Annuler</button>
        <button class="btn-confirm" onclick="logout()">Se déconnecter</button>
      </div>
    </div>
  </div>

  <script>
    // ===== SUPABASE =====
    const { createClient } = supabase;
    const sb = createClient(
      'https://elgbvitijyjriozvzqpf.supabase.co',
      'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
    );

    // ===== ÉTAT GLOBAL =====
    let currentUser = null;
    let userProfile = null;
    let currentPage = 'dashboard';

    // ===== VÉRIFICATION SESSION =====
    async function checkSession() {
      try {
        const { data: { session }, error } = await sb.auth.getSession();
        if (error || !session) {
          window.location.href = 'index.html';
          return;
        }
        
        currentUser = session.user;
        
        // Charger le profil depuis la table utilisateurs
        const { data: profile, error: profileError } = await sb
          .from('utilisateurs')
          .select('*')
          .eq('id', currentUser.id)
          .single();
        
        if (profileError) {
          console.warn('Erreur chargement profil:', profileError);
          userProfile = {
            nom_complet: currentUser.user_metadata?.full_name || 'Utilisateur',
            email: currentUser.email,
            pays: currentUser.user_metadata?.pays || 'Non renseigné',
            ville: currentUser.user_metadata?.ville || 'Non renseigné',
            whatsapp: currentUser.user_metadata?.whatsapp || 'Non renseigné'
          };
        } else {
          userProfile = profile;
        }
        
        updateUserInfo();
        loadPage('dashboard');
      } catch (err) {
        console.error('Erreur session:', err);
        window.location.href = 'index.html';
      }
    }

    // ===== MISE À JOUR INFOS UTILISATEUR =====
    function updateUserInfo() {
      if (!userProfile) return;
      
      document.getElementById('userName').textContent = userProfile.nom_complet || 'Utilisateur';
      document.getElementById('userEmail').textContent = userProfile.email || '';
      
      const initial = (userProfile.nom_complet || 'A').charAt(0).toUpperCase();
      document.getElementById('userAvatar').textContent = initial;
    }

    // ===== CHARGEMENT DES PAGES =====
    async function loadPage(page) {
      currentPage = page;
      
      // Mettre à jour la classe active des liens
      document.querySelectorAll('.nav-links a').forEach(link => {
        link.classList.remove('active');
        if (link.dataset.page === page) {
          link.classList.add('active');
        }
      });
      
      const content = document.getElementById('dashboardContent');
      
      switch(page) {
        case 'dashboard':
          content.innerHTML = await getDashboardHTML();
          break;
        case 'annonces':
          content.innerHTML = await getAnnoncesHTML();
          break;
        case 'messages':
          content.innerHTML = await getMessagesHTML();
          break;
        case 'favoris':
          content.innerHTML = await getFavorisHTML();
          break;
        case 'profil':
          content.innerHTML = await getProfilHTML();
          break;
        case 'parametres':
          content.innerHTML = getParametresHTML();
          break;
      }
    }

    // ===== PAGE DASHBOARD =====
    async function getDashboardHTML() {
      // Compter les annonces
      const { count: annoncesCount } = await sb
        .from('annonces')
        .select('*', { count: 'exact', head: true })
        .eq('user_id', currentUser.id);
      
      return `
        <div class="welcome-card">
          <div class="welcome">
            <h1>Bonjour, ${userProfile?.nom_complet?.split(' ')[0] || 'Utilisateur'} 👋</h1>
            <p>Bienvenue sur votre tableau de bord AfriMarket</p>
          </div>
          <div class="stats-mini">
            <div class="stat-mini">
              <div class="number">${annoncesCount || 0}</div>
              <div class="label">Annonces</div>
            </div>
            <div class="stat-mini">
              <div class="number">${userProfile?.ville || '-'}</div>
              <div class="label">${userProfile?.pays || ''}</div>
            </div>
          </div>
        </div>

        <h2 class="section-title">Actions rapides</h2>
        <div class="actions-grid">
          <div class="action-card" onclick="window.location.href='nouvelle-annonce.html'">
            <div class="action-icon">📸</div>
            <h3>Publier une annonce</h3>
            <p>Vendez vos articles rapidement</p>
          </div>
          <div class="action-card" onclick="loadPage('messages')">
            <div class="action-icon">💬</div>
            <h3>Messages</h3>
            <p>Consultez vos messages</p>
          </div>
          <div class="action-card" onclick="loadPage('profil')">
            <div class="action-icon">👤</div>
            <h3>Mon profil</h3>
            <p>Gérez vos informations</p>
          </div>
          <div class="action-card" onclick="window.open('https://wa.me/?text=Je%20viens%20de%20rejoindre%20AfriMarket%20!', '_blank')">
            <div class="action-icon">📱</div>
            <h3>Inviter des amis</h3>
            <p>Partagez sur WhatsApp</p>
          </div>
        </div>

        <div class="ads-header">
          <h2 class="section-title">Mes dernières annonces</h2>
          <button class="btn-primary" onclick="loadPage('annonces')">
            <span>+</span> Voir toutes
          </button>
        </div>
        <div class="ads-grid" id="recentAds">
          ${await getRecentAnnoncesHTML()}
        </div>
      `;
    }

    // ===== ANNONCES RÉCENTES =====
    async function getRecentAnnoncesHTML() {
      const { data: annonces } = await sb
        .from('annonces')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false })
        .limit(3);
      
      if (!annonces || annonces.length === 0) {
        return `
          <div style="grid-column: 1/-1; text-align: center; padding: 3rem; background: white; border-radius: 20px;">
            <p style="color: var(--gray);">Vous n'avez pas encore d'annonces</p>
            <button class="btn-primary" style="margin-top: 1rem;" onclick="window.location.href='nouvelle-annonce.html'">
              Publier ma première annonce
            </button>
          </div>
        `;
      }
      
      return annonces.map(ad => `
        <div class="ad-card">
          <div class="ad-img">${ad.image_emoji || '📦'}</div>
          <div class="ad-body">
            <div class="ad-title">${ad.titre}</div>
            <div class="ad-price">${ad.prix?.toLocaleString() || '0'} FCFA</div>
            <div class="ad-meta">
              <span class="ad-status">${ad.statut || 'Actif'}</span>
            </div>
          </div>
        </div>
      `).join('');
    }

    // ===== PAGE ANNONCES =====
    async function getAnnoncesHTML() {
      const { data: annonces } = await sb
        .from('annonces')
        .select('*')
        .eq('user_id', currentUser.id)
        .order('created_at', { ascending: false });
      
      return `
        <div class="ads-header">
          <h1 class="section-title">Mes annonces</h1>
          <button class="btn-primary" onclick="window.location.href='nouvelle-annonce.html'">
            <span>+</span> Nouvelle annonce
          </button>
        </div>
        
        <div class="ads-grid">
          ${annonces?.length ? annonces.map(ad => `
            <div class="ad-card">
              <div class="ad-img">${ad.image_emoji || '📦'}</div>
              <div class="ad-body">
                <div class="ad-title">${ad.titre}</div>
                <div class="ad-price">${ad.prix?.toLocaleString() || '0'} FCFA</div>
                <div class="ad-meta">
                  <span class="ad-status">${ad.statut || 'Actif'}</span>
                </div>
              </div>
            </div>
          `).join('') : `
            <div style="grid-column: 1/-1; text-align: center; padding: 4rem; background: white; border-radius: 24px;">
              <div style="font-size: 4rem; margin-bottom: 1rem;">📸</div>
              <h3>Pas encore d'annonces</h3>
              <p style="color: var(--gray); margin: 1rem 0;">Publiez votre première annonce gratuitement</p>
              <button class="btn-primary" onclick="window.location.href='nouvelle-annonce.html'">Créer une annonce</button>
            </div>
          `}
        </div>
      `;
    }

    // ===== PAGE MESSAGES =====
    async function getMessagesHTML() {
      return `
        <h1 class="section-title">Messages</h1>
        
        <div class="messages-list">
          <div style="text-align: center; padding: 3rem;">
            <p style="color: var(--gray);">Interface de messagerie à venir</p>
          </div>
        </div>
      `;
    }

    // ===== PAGE FAVORIS =====
    async function getFavorisHTML() {
      return `
        <h1 class="section-title">Mes favoris</h1>
        
        <div class="favorites-grid">
          <div style="grid-column: 1/-1; text-align: center; padding: 4rem; background: white; border-radius: 24px;">
            <div style="font-size: 4rem; margin-bottom: 1rem;">❤️</div>
            <h3>Aucun favori</h3>
            <p style="color: var(--gray); margin: 1rem 0;">Les annonces que vous aimerez apparaîtront ici</p>
            <button class="btn-primary" onclick="window.location.href='/'">Explorer les annonces</button>
          </div>
        </div>
      `;
    }

    // ===== PAGE PROFIL =====
    async function getProfilHTML() {
      return `
        <h1 class="section-title">Mon profil</h1>
        
        <div class="profile-section">
          <div class="profile-header">
            <div class="profile-avatar">${(userProfile?.nom_complet || 'U').charAt(0)}</div>
            <div class="profile-info">
              <h2>${userProfile?.nom_complet || 'Utilisateur'}</h2>
              <p>${userProfile?.email || ''}</p>
              <p>📍 ${userProfile?.ville || 'Non renseignée'}, ${userProfile?.pays || 'Non renseigné'}</p>
              <p>📱 ${userProfile?.whatsapp || 'Non renseigné'}</p>
            </div>
          </div>
        </div>

        <div class="settings-card">
          <h3 style="margin-bottom: 1rem;">Informations personnelles</h3>
          <div class="settings-item">
            <span>Nom complet</span>
            <span><strong>${userProfile?.nom_complet || '-'}</strong></span>
          </div>
          <div class="settings-item">
            <span>Email</span>
            <span><strong>${userProfile?.email || '-'}</strong></span>
          </div>
          <div class="settings-item">
            <span>WhatsApp</span>
            <span><strong>${userProfile?.whatsapp || '-'}</strong></span>
          </div>
          <div class="settings-item">
            <span>Pays</span>
            <span><strong>${userProfile?.pays || '-'}</strong></span>
          </div>
          <div class="settings-item">
            <span>Ville</span>
            <span><strong>${userProfile?.ville || '-'}</strong></span>
          </div>
        </div>
      `;
    }

    // ===== PAGE PARAMÈTRES =====
    function getParametresHTML() {
      return `
        <h1 class="section-title">Paramètres</h1>
        
        <div class="settings-card">
          <h3 style="margin-bottom: 1rem;">Compte</h3>
          <div class="settings-item">
            <span>Changer le mot de passe</span>
            <button class="btn-primary" style="padding: 0.5rem 1rem;" onclick="changerMotDePasse()">Modifier</button>
          </div>
          <div class="settings-item">
            <span>Déconnexion</span>
            <button class="btn-primary" style="background: var(--red); padding: 0.5rem 1rem;" onclick="showLogoutModal()">Se déconnecter</button>
          </div>
        </div>
      `;
    }

    // ===== FONCTIONS DES BOUTONS =====
    function showLogoutModal() {
      document.getElementById('logoutModal').classList.add('active');
    }

    function closeLogoutModal() {
      document.getElementById('logoutModal').classList.remove('active');
    }

    async function logout() {
      await sb.auth.signOut();
      window.location.href = 'index.html';
    }

    function changerMotDePasse() {
      window.location.href = 'changer-mot-de-passe.html';
    }

    // ===== NAVIGATION =====
    document.querySelectorAll('.nav-links a').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        loadPage(link.dataset.page);
      });
    });

    // ===== CLIC SUR LE BADGE UTILISATEUR =====
    document.getElementById('userBadge').addEventListener('click', () => {
      loadPage('profil');
    });

    // ===== INITIALISATION =====
    checkSession();
  </script>
</body>
</html>
