<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AfriMarket — Dashboard</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root {
      --blue:   #1B3FE4;
      --blue2:  #2D55FF;
      --red:    #E83030;
      --orange: #FF6B1A;
      --turq:   #00C2B7;
      --white:  #FFFFFF;
      --bg:     #F2F5FF;
      --card:   #FFFFFF;
      --dark:   #080E2A;
      --gray:   #8892A8;
      --border: #E4E9F8;
      --nav-h:  72px;
    }
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      padding-bottom: calc(var(--nav-h) + 16px);
      overflow-x: hidden;
    }

    /* ===== TOP HEADER ===== */
    .header {
      position: sticky; top:0; z-index: 100;
      background: linear-gradient(135deg, var(--dark) 0%, #0D1E6B 100%);
      padding: 0 1.2rem;
      display: flex; align-items: center; justify-content: space-between;
      height: 60px;
      box-shadow: 0 4px 24px rgba(8,14,42,.35);
    }
    .header-logo {
      font-family: 'Clash Display', sans-serif;
      font-size: 1.45rem; font-weight: 700; letter-spacing: -1px;
    }
    .header-logo .la { color: var(--turq); }
    .header-logo .lm { color: var(--orange); }

    .header-right { display:flex; align-items:center; gap:.6rem; }
    .btn-notif {
      width:38px; height:38px; border-radius:50%;
      background: rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.12);
      display:flex; align-items:center; justify-content:center;
      cursor:pointer; font-size:1.1rem; position:relative;
      transition: background .2s;
    }
    .btn-notif:hover { background:rgba(255,255,255,.15); }
    .notif-dot {
      position:absolute; top:6px; right:6px;
      width:8px; height:8px; border-radius:50%;
      background: var(--orange); border:2px solid var(--dark);
      animation: blink 2s infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:.4} }
    .avatar-btn {
      width:38px; height:38px; border-radius:50%;
      background: linear-gradient(135deg, var(--turq), var(--blue2));
      display:flex; align-items:center; justify-content:center;
      font-size:.9rem; font-weight:700; color:white; cursor:pointer;
      border: 2px solid rgba(255,255,255,.2);
      font-family:'Clash Display',sans-serif;
    }

    /* ===== SEARCH ===== */
    .search-wrap {
      padding: 1rem 1.2rem .5rem;
    }
    .search-box {
      display:flex; align-items:center; gap:.6rem;
      background:white; border-radius:16px; padding:.65rem 1rem;
      box-shadow: 0 4px 20px rgba(27,63,228,.08);
      border: 1.5px solid var(--border);
      transition: border-color .2s, box-shadow .2s;
    }
    .search-box:focus-within {
      border-color: var(--blue2);
      box-shadow: 0 4px 24px rgba(27,63,228,.15);
    }
    .search-box input {
      flex:1; border:none; outline:none; background:none;
      font-family:'Plus Jakarta Sans',sans-serif; font-size:.9rem; color:var(--dark);
    }
    .search-box input::placeholder { color:#B8C1D8; }
    .search-icon { font-size:1.1rem; color:var(--gray); flex-shrink:0; }
    .search-filter {
      width:34px; height:34px; border-radius:10px;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      display:flex; align-items:center; justify-content:center;
      font-size:.85rem; cursor:pointer; flex-shrink:0;
      transition: transform .2s;
    }
    .search-filter:hover { transform:scale(1.08); }

    /* ===== WELCOME BANNER ===== */
    .welcome-section { padding: .8rem 1.2rem .4rem; }
    .welcome-card {
      background: linear-gradient(135deg, var(--blue) 0%, #1A2FA8 40%, var(--turq) 100%);
      border-radius: 22px;
      padding: 1.3rem 1.4rem;
      position:relative; overflow:hidden;
      box-shadow: 0 8px 32px rgba(27,63,228,.3);
    }
    .welcome-card::before {
      content:''; position:absolute;
      width:200px; height:200px; border-radius:50%;
      background:rgba(255,255,255,.06);
      right:-50px; top:-60px;
    }
    .welcome-card::after {
      content:''; position:absolute;
      width:120px; height:120px; border-radius:50%;
      background:rgba(0,194,183,.15);
      right:30px; bottom:-40px;
    }
    .welcome-top { display:flex; align-items:flex-start; justify-content:space-between; margin-bottom:1rem; }
    .welcome-texts { position:relative; z-index:1; }
    .welcome-greeting {
      color:rgba(255,255,255,.7); font-size:.78rem; font-weight:500; letter-spacing:.5px;
    }
    .welcome-name {
      font-family:'Clash Display',sans-serif;
      font-size:1.3rem; font-weight:700; color:white; letter-spacing:-.5px;
      margin-top:2px;
    }
    .welcome-sub { color:rgba(255,255,255,.6); font-size:.75rem; margin-top:2px; }
    .welcome-emoji {
      font-size:2.2rem; position:relative; z-index:1;
      animation: wave 2s ease-in-out infinite;
    }
    @keyframes wave {
      0%,100%{transform:rotate(0deg)} 25%{transform:rotate(15deg)} 75%{transform:rotate(-5deg)}
    }

    /* QUICK ACTION BUTTONS */
    .quick-btns { display:flex; gap:.6rem; flex-wrap:wrap; position:relative; z-index:1; }
    .qbtn {
      display:flex; align-items:center; gap:.4rem;
      padding:.45rem .85rem; border-radius:99px; border:none; cursor:pointer;
      font-family:'Plus Jakarta Sans',sans-serif; font-size:.78rem; font-weight:600;
      transition: transform .2s, box-shadow .2s;
      white-space:nowrap;
    }
    .qbtn:hover { transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.25); }
    .qbtn:active { transform:translateY(0); }
    .qbtn-white { background:white; color:var(--blue); }
    .qbtn-turq  { background:var(--turq); color:white; }
    .qbtn-orange{ background:var(--orange); color:white; }
    .qbtn-red   { background:rgba(255,255,255,.15); color:white; border:1px solid rgba(255,255,255,.25); }

    /* ===== CATEGORIES ===== */
    .section-head {
      display:flex; align-items:center; justify-content:space-between;
      padding: 1.2rem 1.2rem .7rem;
    }
    .section-title {
      font-family:'Clash Display',sans-serif;
      font-size:1rem; font-weight:700; color:var(--dark); letter-spacing:-.3px;
    }
    .see-all {
      font-size:.75rem; color:var(--blue2); font-weight:600; cursor:pointer;
      text-decoration:none;
    }

    .cats-scroll {
      display:flex; gap:.7rem; overflow-x:auto;
      padding: 0 1.2rem 1rem; scrollbar-width:none;
    }
    .cats-scroll::-webkit-scrollbar { display:none; }
    .cat-chip {
      display:flex; flex-direction:column; align-items:center; gap:.3rem;
      flex-shrink:0; cursor:pointer;
    }
    .cat-ico {
      width:52px; height:52px; border-radius:18px;
      display:flex; align-items:center; justify-content:center; font-size:1.4rem;
      transition: transform .2s, box-shadow .2s;
      border: 2px solid transparent;
    }
    .cat-chip:hover .cat-ico { transform:scale(1.1); }
    .cat-chip.active .cat-ico {
      border-color: var(--blue2);
      box-shadow: 0 4px 16px rgba(27,63,228,.25);
    }
    .cat-chip.active .cat-lbl { color:var(--blue2); font-weight:700; }
    .cat-lbl { font-size:.65rem; color:var(--gray); font-weight:500; text-align:center; }

    .ci-1{background:linear-gradient(135deg,#FFF3E0,#FFE0B2)} /* immobilier */
    .ci-2{background:linear-gradient(135deg,#E3F2FD,#BBDEFB)} /* véhicules */
    .ci-3{background:linear-gradient(135deg,#E8F5E9,#C8E6C9)} /* électro */
    .ci-4{background:linear-gradient(135deg,#FCE4EC,#F8BBD0)} /* mode */
    .ci-5{background:linear-gradient(135deg,#F3E5F5,#E1BEE7)} /* services */
    .ci-6{background:linear-gradient(135deg,#E0F7FA,#B2EBF2)} /* emploi */
    .ci-7{background:linear-gradient(135deg,#FFF9C4,#FFF176)} /* alimentation */
    .ci-8{background:linear-gradient(135deg,#E8EAF6,#C5CAE9)} /* autres */

    /* ===== ADS GRID ===== */
    .ads-section { padding: 0 1.2rem; }

    .ads-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
    }

    .ad-card {
      background: white; border-radius:20px;
      overflow:hidden;
      box-shadow: 0 2px 16px rgba(27,63,228,.07);
      cursor:pointer;
      transition: transform .25s, box-shadow .25s;
      animation: cardIn .4s ease both;
      border: 1px solid var(--border);
    }
    .ad-card:hover { transform:translateY(-4px); box-shadow:0 12px 32px rgba(27,63,228,.15); }
    @keyframes cardIn {
      from{opacity:0;transform:translateY(20px)} to{opacity:1;transform:translateY(0)}
    }

    .ad-img {
      width:100%; aspect-ratio:4/3; object-fit:cover;
      background: linear-gradient(135deg,#E8EEFF,#F0F4FF);
      display:flex; align-items:center; justify-content:center; font-size:2.5rem;
      position:relative;
    }
    .ad-badge {
      position:absolute; top:8px; left:8px;
      background:var(--orange); color:white;
      font-size:.6rem; font-weight:700; padding:2px 8px; border-radius:99px;
      letter-spacing:.5px; text-transform:uppercase;
    }
    .ad-fav {
      position:absolute; top:7px; right:7px;
      width:28px; height:28px; border-radius:50%;
      background:rgba(255,255,255,.9); backdrop-filter:blur(8px);
      display:flex; align-items:center; justify-content:center;
      font-size:.85rem; cursor:pointer; border:none;
      transition: transform .2s;
    }
    .ad-fav:hover { transform:scale(1.2); }
    .ad-fav.liked::after { content:'❤️'; }
    .ad-fav:not(.liked)::after { content:'🤍'; }

    .ad-body { padding:.75rem; }
    .ad-title {
      font-size:.82rem; font-weight:700; color:var(--dark);
      white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
      margin-bottom:.25rem;
    }
    .ad-price {
      font-family:'Clash Display',sans-serif;
      font-size:1rem; font-weight:700;
      background:linear-gradient(90deg,var(--blue),var(--turq));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    }
    .ad-location {
      display:flex; align-items:center; gap:.3rem;
      font-size:.68rem; color:var(--gray); margin-top:.3rem;
    }
    .ad-footer {
      display:flex; align-items:center; justify-content:space-between;
      margin-top:.6rem; padding-top:.5rem; border-top:1px solid var(--border);
    }
    .ad-time { font-size:.62rem; color:#B8C1D8; }
    .btn-wa {
      width:26px; height:26px; border-radius:99px;
      background:linear-gradient(135deg,#25D366,#128C7E);
      display:flex; align-items:center; justify-content:center;
      font-size:.75rem; border:none; cursor:pointer;
      transition:transform .2s;
    }
    .btn-wa:hover { transform:scale(1.15); }

    /* FEATURED / LARGE CARD */
    .ad-card.featured { grid-column:1/-1; display:flex; }
    .ad-card.featured .ad-img { width:130px; aspect-ratio:auto; height:auto; flex-shrink:0; border-radius:0; }
    .ad-card.featured .ad-body { flex:1; }

    /* ===== LOADING SKELETON ===== */
    .skeleton {
      background:linear-gradient(90deg,#F0F4FF 25%,#E4E9F8 50%,#F0F4FF 75%);
      background-size:200% 100%;
      animation:shimmer 1.4s infinite;
      border-radius:10px;
    }
    @keyframes shimmer { from{background-position:200% 0} to{background-position:-200% 0} }

    .skel-card { background:white; border-radius:20px; overflow:hidden; border:1px solid var(--border); }
    .skel-img  { height:110px; }
    .skel-body { padding:.75rem; display:flex; flex-direction:column; gap:.5rem; }
    .skel-line { height:10px; }
    .skel-line.short { width:60%; }

    /* EMPTY STATE */
    .empty-state {
      grid-column:1/-1;
      display:flex; flex-direction:column; align-items:center; justify-content:center;
      padding:3rem 1rem; text-align:center; gap:.7rem;
    }
    .empty-ico { font-size:3.5rem; }
    .empty-state h3 {
      font-family:'Clash Display',sans-serif; font-size:1.1rem; color:var(--dark);
    }
    .empty-state p { color:var(--gray); font-size:.82rem; }

    /* ===== BOTTOM NAV ===== */
    .bottom-nav {
      position:fixed; bottom:0; left:0; right:0; z-index:200;
      height:var(--nav-h);
      background:white;
      border-top:1px solid var(--border);
      display:flex; align-items:stretch;
      box-shadow: 0 -8px 32px rgba(27,63,228,.1);
      border-radius:24px 24px 0 0;
    }
    .nav-item {
      flex:1; display:flex; flex-direction:column;
      align-items:center; justify-content:center;
      gap:4px; cursor:pointer; border:none; background:none;
      transition: all .25s; position:relative;
      padding-bottom:4px;
    }
    .nav-item:hover { background:rgba(27,63,228,.03); }
    .nav-ico { font-size:1.35rem; transition:transform .25s; line-height:1; }
    .nav-lbl { font-size:.62rem; font-weight:600; color:var(--gray); letter-spacing:.3px; transition:color .25s; }
    .nav-item.active .nav-lbl { color:var(--blue2); }
    .nav-item.active .nav-ico { transform:scale(1.1); }
    .nav-item.active::before {
      content:''; position:absolute; top:0; left:50%; transform:translateX(-50%);
      width:32px; height:3px; border-radius:0 0 6px 6px;
      background:linear-gradient(90deg,var(--blue),var(--turq));
    }

    /* PLUS BUTTON (centre) */
    .nav-item.nav-plus {
      margin-top:-18px;
    }
    .nav-plus-btn {
      width:54px; height:54px; border-radius:18px;
      background:linear-gradient(135deg,var(--blue),var(--blue2),#4F7AFF);
      display:flex; align-items:center; justify-content:center;
      font-size:1.5rem; box-shadow:0 8px 24px rgba(27,63,228,.45);
      border:none; cursor:pointer;
      transition:transform .2s, box-shadow .2s;
    }
    .nav-plus-btn:hover { transform:scale(1.1) rotate(5deg); box-shadow:0 12px 32px rgba(27,63,228,.5); }
    .nav-item.nav-plus .nav-lbl { margin-top:2px; }

    /* TOAST */
    #toast {
      position:fixed; bottom:calc(var(--nav-h) + 12px); right:1rem;
      max-width:300px; background:var(--dark); color:white;
      padding:.8rem 1.2rem; border-radius:14px; font-size:.83rem; font-weight:500;
      box-shadow:0 8px 32px rgba(0,0,0,.2); z-index:9999;
      display:flex; align-items:center; gap:.6rem;
      transform:translateY(20px); opacity:0;
      transition:all .4s cubic-bezier(.34,1.56,.64,1);
      border-left:3px solid var(--turq);
    }
    #toast.show { transform:translateY(0); opacity:1; }

    /* MODAL DETAIL ANNONCE */
    .modal-overlay {
      position:fixed; inset:0; z-index:500;
      background:rgba(8,14,42,.6); backdrop-filter:blur(6px);
      display:flex; align-items:flex-end;
      opacity:0; pointer-events:none;
      transition:opacity .3s;
    }
    .modal-overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:white; border-radius:28px 28px 0 0;
      width:100%; max-height:90vh; overflow-y:auto;
      padding:1.5rem 1.4rem 2rem;
      transform:translateY(100%);
      transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .modal-overlay.open .modal { transform:translateY(0); }
    .modal-handle {
      width:40px; height:4px; border-radius:99px;
      background:var(--border); margin:0 auto 1.2rem;
    }
    .modal-title {
      font-family:'Clash Display',sans-serif;
      font-size:1.3rem; font-weight:700; color:var(--dark); margin-bottom:.4rem;
    }
    .modal-price {
      font-family:'Clash Display',sans-serif; font-size:1.6rem; font-weight:700;
      background:linear-gradient(90deg,var(--blue),var(--turq));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      margin-bottom:.8rem;
    }
    .modal-desc { color:var(--gray); font-size:.84rem; line-height:1.6; margin-bottom:1.2rem; }
    .modal-info { display:flex; flex-wrap:wrap; gap:.5rem; margin-bottom:1.2rem; }
    .modal-tag {
      background:var(--bg); padding:.3rem .8rem; border-radius:99px;
      font-size:.74rem; color:var(--dark); font-weight:500;
    }
    .modal-seller {
      display:flex; align-items:center; gap:.8rem;
      background:var(--bg); border-radius:16px; padding:1rem;
      margin-bottom:1.2rem;
    }
    .seller-ava {
      width:44px; height:44px; border-radius:50%;
      background:linear-gradient(135deg,var(--turq),var(--blue2));
      display:flex; align-items:center; justify-content:center;
      font-size:1rem; font-weight:700; color:white; font-family:'Clash Display',sans-serif;
      flex-shrink:0;
    }
    .seller-info h4 { font-size:.88rem; font-weight:700; color:var(--dark); }
    .seller-info p  { font-size:.74rem; color:var(--gray); }
    .modal-actions { display:flex; gap:.8rem; }
    .btn-modal {
      flex:1; padding:.8rem; border-radius:14px; border:none; cursor:pointer;
      font-family:'Plus Jakarta Sans',sans-serif; font-size:.88rem; font-weight:700;
      transition:transform .2s, box-shadow .2s;
    }
    .btn-modal:hover { transform:translateY(-2px); }
    .btn-modal.primary {
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white; box-shadow:0 6px 20px rgba(27,63,228,.35);
    }
    .btn-modal.wa {
      background:linear-gradient(135deg,#25D366,#128C7E);
      color:white; box-shadow:0 6px 20px rgba(37,211,102,.35);
    }

    /* PUBLISH MODAL */
    .pub-overlay {
      position:fixed; inset:0; z-index:600;
      background:rgba(8,14,42,.65); backdrop-filter:blur(8px);
      display:flex; align-items:flex-end;
      opacity:0; pointer-events:none;
      transition:opacity .3s;
    }
    .pub-overlay.open { opacity:1; pointer-events:all; }
    .pub-modal {
      background:white; border-radius:28px 28px 0 0;
      width:100%; max-height:92vh; overflow-y:auto;
      padding:1.5rem 1.4rem 2.5rem;
      transform:translateY(100%);
      transition:transform .4s cubic-bezier(.34,1.56,.64,1);
    }
    .pub-overlay.open .pub-modal { transform:translateY(0); }
    .pub-title {
      font-family:'Clash Display',sans-serif;
      font-size:1.3rem; font-weight:700; color:var(--dark); margin-bottom:1.2rem;
    }
    .pub-field { display:flex; flex-direction:column; gap:.35rem; margin-bottom:.9rem; }
    .pub-field label {
      font-size:.7rem; font-weight:700; color:var(--dark);
      letter-spacing:.7px; text-transform:uppercase;
    }
    .pub-field input, .pub-field textarea, .pub-field select {
      width:100%; padding:.7rem 1rem;
      border:1.5px solid var(--border); border-radius:12px;
      font-family:'Plus Jakarta Sans',sans-serif; font-size:.87rem; color:var(--dark);
      background:#FAFBFF; outline:none; transition:border-color .2s, box-shadow .2s;
      resize:none;
    }
    .pub-field input:focus, .pub-field textarea:focus, .pub-field select:focus {
      border-color:var(--blue2); box-shadow:0 0 0 3px rgba(45,85,255,.1); background:white;
    }
    .pub-row { display:grid; grid-template-columns:1fr 1fr; gap:.9rem; }
    .btn-pub {
      width:100%; padding:.85rem; border:none; border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white; font-family:'Clash Display',sans-serif;
      font-size:1rem; font-weight:700; cursor:pointer; margin-top:.5rem;
      transition:transform .2s, box-shadow .2s;
      display:flex; align-items:center; justify-content:center; gap:.5rem;
    }
    .btn-pub:hover { transform:translateY(-2px); box-shadow:0 10px 30px rgba(27,63,228,.4); }
    .btn-pub:disabled { opacity:.6; cursor:not-allowed; transform:none; }
    .spin-sm {
      width:16px; height:16px; border:2px solid rgba(255,255,255,.3);
      border-top-color:white; border-radius:50%;
      animation:spin .6s linear infinite; display:none;
    }
    @keyframes spin { to{transform:rotate(360deg)} }
    .btn-pub.loading .spin-sm { display:block; }
    .btn-pub.loading .pub-lbl { display:none; }

    /* IMAGE UPLOAD */
    .img-upload-zone {
      border:2px dashed var(--border); border-radius:14px;
      padding:1.2rem; text-align:center; cursor:pointer;
      transition:border-color .2s, background .2s; position:relative;
    }
    .img-upload-zone:hover { border-color:var(--blue2); background:#FAFBFF; }
    .img-upload-zone.has-img { border-style:solid; border-color:var(--turq); padding:.4rem; }
    .img-upload-zone input[type=file] {
      position:absolute; inset:0; opacity:0; cursor:pointer; width:100%; height:100%;
    }
    .upload-ico { font-size:1.6rem; }
    .upload-txt { font-size:.75rem; color:var(--gray); font-weight:500; margin-top:.3rem; }
    .img-preview { width:100%; height:150px; object-fit:cover; border-radius:10px; display:none; }
    .img-preview.show { display:block; }

    /* SECTION TABS */
    .ad-tabs {
      display:flex; gap:.5rem; padding:0 1.2rem .8rem;
    }
    .ad-tab {
      padding:.38rem .9rem; border-radius:99px; border:none; cursor:pointer;
      font-family:'Plus Jakarta Sans',sans-serif; font-size:.76rem; font-weight:600;
      transition:all .2s;
    }
    .ad-tab.active {

<script>
// ===== SUPABASE =====
const { createClient } = supabase;
const sb = createClient(
  'https://elgbvitijyjriozvzqpf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
);

// ===== STATE =====
let allAds = [];
let currentCat = 'all';
let currentTab = 'recent';
let currentUser = null;
const EMOJI_MAP = {
  immobilier:'🏠', vehicules:'🚗', electronique:'📱',
  mode:'👗', services:'🛠️', emploi:'💼', alimentation:'🥘', autres:'📦'
};
const liked = new Set();

// ===== TOAST =====
let tt;
function showToast(msg, type='success') {
  const icons={success:'✅',error:'❌',warning:'⚠️',info:'ℹ️'};
  document.getElementById('tIco').textContent = icons[type]||'💬';
  document.getElementById('tMsg').textContent = msg;
  const el=document.getElementById('toast');
  el.className='show';
  el.style.borderLeftColor=type==='success'?'var(--turq)':type==='error'?'var(--red)':type==='warning'?'var(--orange)':'var(--blue2)';
  clearTimeout(tt);
  tt=setTimeout(()=>el.className='',3800);
}

// ===== FORMAT PRICE =====
function fmtPrice(n) {
  if (!n && n!==0) return 'Prix à débattre';
  return Number(n).toLocaleString('fr-FR') + ' FCFA';
}

// ===== TIME AGO =====
function timeAgo(d) {
  if (!d) return '';
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s<60) return 'À l\'instant';
  if (s<3600) return `Il y a ${Math.floor(s/60)} min`;
  if (s<86400) return `Il y a ${Math.floor(s/3600)} h`;
  return `Il y a ${Math.floor(s/86400)} j`;
}

// ===== INIT =====
async function init() {
  // check session
  const { data:{ session } } = await sb.auth.getSession();
  if (!session) {
    window.location.href = 'index.html';
    return;
  }
  currentUser = session.user;

  // afficher nom
  const meta = currentUser.user_metadata;
  const name = meta?.full_name || currentUser.email?.split('@')[0] || 'Utilisateur';
  const prenom = name.split(' ')[0];
  document.getElementById('welcomeName').textContent = prenom + ' 👋';
  document.getElementById('avatarBtn').textContent = prenom[0].toUpperCase();

  // pré-remplir WhatsApp dans le formulaire
  if (meta?.whatsapp) document.getElementById('p_wa').value = meta.whatsapp;
  if (meta?.ville) document.getElementById('p_ville').value = meta.ville;

  loadAds();
}

// ===== LOAD ADS =====
async function loadAds() {
  try {
    const { data, error } = await sb
      .from('annonces')
      .select('*, profiles(full_name, whatsapp)')
      .order('created_at', { ascending: false })
      .limit(50);

    if (error) throw error;
    allAds = data || [];
    renderAds();
  } catch(err) {
    console.error('Erreur chargement annonces:', err);
    allAds = [];
    renderAds();
    showToast('Erreur de chargement des annonces', 'error');
  }
}

// ===== RENDER ADS =====
function renderAds() {
  let ads = [...allAds];

  // filtre catégorie
  if (currentCat !== 'all') ads = ads.filter(a => a.categorie === currentCat);

  // filtre tab
  if (currentTab === 'urgent') ads = ads.filter(a => a.urgent);
  if (currentTab === 'promo')  ads = ads.filter(a => a.promo);

  // filtre recherche
  const q = document.getElementById('searchInput').value.toLowerCase();
  if (q) ads = ads.filter(a =>
    (a.titre||'').toLowerCase().includes(q) ||
    (a.description||'').toLowerCase().includes(q) ||
    (a.ville||'').toLowerCase().includes(q)
  );

  document.getElementById('adsCount').textContent = ads.length + ' annonce' + (ads.length>1?'s':'');

  const grid = document.getElementById('adsGrid');
  if (!ads.length) {
    grid.innerHTML = `<div class="empty-state">
      <div class="empty-ico">🔍</div>
      <h3>Aucune annonce trouvée</h3>
      <p>Soyez le premier à publier dans cette catégorie !</p>
    </div>`;
    return;
  }

  grid.innerHTML = ads.map((ad, i) => {
    const emoji = EMOJI_MAP[ad.categorie] || '📦';
    const badge = ad.urgent ? '<div class="ad-badge">Urgent</div>' : ad.promo ? '<div class="ad-badge" style="background:var(--turq)">Promo</div>' : '';
    const isLiked = liked.has(ad.id);
    const imgContent = ad.image_url
      ? `<img src="${ad.image_url}" alt="${ad.titre||''}" style="width:100%;aspect-ratio:4/3;object-fit:cover;" onerror="this.parentElement.innerHTML='<div style=\'width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:2.5rem;\'>${emoji}</div>'">`
      : `<div style="width:100%;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;font-size:2.5rem;">${emoji}</div>`;
    return `
      <div class="ad-card" style="animation-delay:${i*0.05}s" onclick="openDetail('${ad.id}')">
        <div class="ad-img" style="padding:0;background:none;">
          ${imgContent}
          ${badge}
          <button class="ad-fav ${isLiked?'liked':''}" id="fav_${ad.id}"
            onclick="event.stopPropagation();toggleFav('${ad.id}')" aria-label="Favori"></button>
        </div>
        <div class="ad-body">
          <div class="ad-title">${ad.titre||'Sans titre'}</div>
          <div class="ad-price">${fmtPrice(ad.prix)}</div>
          <div class="ad-location">📍 ${ad.ville||'—'}</div>
          <div class="ad-footer">
            <span class="ad-time">${timeAgo(ad.created_at)}</span>
            <button class="btn-wa" onclick="event.stopPropagation();contactWA('${(ad.profiles?.whatsapp||ad.whatsapp||'').replace(/[^0-9+]/g,'')}')" title="WhatsApp">💬</button>
          </div>
        </div>
      </div>
    `;
  }).join('');
}

// ===== FILTER =====
function filterCat(cat, el) {
  currentCat = cat;
  document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderAds();
}
function filterAds() { renderAds(); }
function setAdTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.ad-tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  renderAds();
}

// ===== TOGGLE FAV =====
function toggleFav(id) {
  if (liked.has(id)) { liked.delete(id); showToast('Retiré des favoris','info'); }
  else { liked.add(id); showToast('Ajouté aux favoris ❤️','success'); }
  const btn = document.getElementById('fav_'+id);
  if (btn) btn.classList.toggle('liked', liked.has(id));
}

// ===== WHATSAPP =====
function contactWA(num) {
  if (!num) { showToast('Numéro non disponible','warning'); return; }
  window.open(`https://wa.me/${num.replace(/\+/,'')}?text=Bonjour, je suis intéressé par votre annonce sur AfriMarket 🛒`, '_blank');
}

// ===== DETAIL MODAL =====
function openDetail(id) {
  const ad = allAds.find(a=>a.id===id);
  if (!ad) return;
  const emoji = EMOJI_MAP[ad.categorie] || '📦';
  const mImg = document.getElementById('mImg');
  if (ad.image_url) {
    mImg.innerHTML = `<img src="${ad.image_url}" alt="${ad.titre||''}" style="width:100%;height:200px;object-fit:cover;border-radius:16px;" onerror="this.parentElement.innerHTML='${emoji}';this.parentElement.style.fontSize='4rem';">`;
    mImg.style.background = 'none';
    mImg.style.fontSize = 'unset';
  } else {
    mImg.textContent = emoji;
    mImg.style.background = 'linear-gradient(135deg,#E8EEFF,#F0F4FF)';
    mImg.style.fontSize = '4rem';
  }
  document.getElementById('mTitle').textContent = ad.titre||'Sans titre';
  document.getElementById('mPrice').textContent = fmtPrice(ad.prix);
  document.getElementById('mDesc').textContent = ad.description||'Aucune description.';
  document.getElementById('mInfo').innerHTML = `
    <span class="modal-tag">📍 ${ad.ville||'—'}</span>
    <span class="modal-tag">🏷️ ${ad.categorie||'—'}</span>
    <span class="modal-tag">🕐 ${timeAgo(ad.created_at)}</span>
    ${ad.urgent?'<span class="modal-tag" style="background:#FFF3E0;color:var(--orange)">🔥 Urgent</span>':''}
  `;
  const seller = ad.profiles || {};
  const sNom = seller.full_name || 'Vendeur inconnu';
  document.getElementById('mSeller').innerHTML = `
    <div class="seller-ava">${sNom[0]?.toUpperCase()||'?'}</div>
    <div class="seller-info"><h4>${sNom}</h4><p>Vendeur vérifié ✅</p></div>
  `;
  const wa = (seller.whatsapp||'').replace(/[^0-9+]/g,'');
  document.getElementById('mWaBtn').onclick = () => contactWA(wa);
  document.getElementById('detailOverlay').classList.add('open');
}
function closeDetail(e) {
  if (e.target === document.getElementById('detailOverlay'))
    document.getElementById('detailOverlay').classList.remove('open');
}

// ===== PUBLISH MODAL =====
function openPublish() {
  if (!currentUser) { showToast('Connectez-vous pour publier','warning'); return; }
  document.getElementById('pubOverlay').classList.add('open');
}
function closePub(e) {
  if (e.target === document.getElementById('pubOverlay'))
    document.getElementById('pubOverlay').classList.remove('open');
}

// ===== IMAGE PREVIEW =====
function previewImage(e) {
  const file = e.target.files[0];
  if (!file) return;
  const preview = document.getElementById('imgPreview');
  const placeholder = document.getElementById('uploadPlaceholder');
  const zone = document.getElementById('uploadZone');
  const reader = new FileReader();
  reader.onload = ev => {
    preview.src = ev.target.result;
    preview.classList.add('show');
    placeholder.style.display = 'none';
    zone.classList.add('has-img');
  };
  reader.readAsDataURL(file);
}

document.getElementById('pubForm').addEventListener('submit', async e => {
  e.preventDefault();
  const title = document.getElementById('p_title').value.trim();
  const desc  = document.getElementById('p_desc').value.trim();
  const price = document.getElementById('p_price').value;
  const cat   = document.getElementById('p_cat').value;
  const ville = document.getElementById('p_ville').value.trim();
  const wa    = document.getElementById('p_wa').value.trim();

  if (!title||!desc||!cat||!ville||!wa) {
    showToast('Remplissez tous les champs obligatoires','warning');
    return;
  }

  const btn = document.getElementById('btnPub');
  btn.disabled=true; btn.classList.add('loading');

  try {
    // 1. Upload image si présente
    let image_url = null;
    const imgFile = document.getElementById('p_img').files[0];
    if (imgFile) {
      const ext = imgFile.name.split('.').pop();
      const fileName = `${currentUser.id}/${Date.now()}.${ext}`;
      const { data: storageData, error: storageErr } = await sb.storage
        .from('annonces')
        .upload(fileName, imgFile, { upsert: true });
      if (storageErr) throw storageErr;
      const { data: urlData } = sb.storage.from('annonces').getPublicUrl(fileName);
      image_url = urlData.publicUrl;
    }

    // 2. Insérer l'annonce
    const payload = {
      titre: title,
      description: desc,
      prix: price ? parseInt(price) : null,
      categorie: cat,
      ville,
      whatsapp: wa,
      image_url,
      user_id: currentUser.id,
      created_at: new Date().toISOString()
    };

    const { data, error } = await sb.from('annonces').insert([payload]).select().single();
    if (error) throw error;

    // Ajouter en local
    const newAd = { ...data, profiles: { full_name: currentUser.user_metadata?.full_name||'Moi', whatsapp: wa } };
    allAds.unshift(newAd);
    renderAds();

    document.getElementById('pubOverlay').classList.remove('open');
    document.getElementById('pubForm').reset();
    // reset image preview
    document.getElementById('imgPreview').classList.remove('show');
    document.getElementById('imgPreview').src = '';
    document.getElementById('uploadPlaceholder').style.display = '';
    document.getElementById('uploadZone').classList.remove('has-img');
    showToast('Annonce publiée avec succès ! 🎉','success');

  } catch(err) {
    console.error(err);
    if (err.message?.includes('does not exist')||err.code==='42P01') {
      showToast('Créez la table "annonces" dans Supabase (voir instructions)','error');
    } else {
      showToast('Erreur : ' + err.message,'error');
    }
  } finally {
    btn.disabled=false; btn.classList.remove('loading');
  }
});

// ===== BOTTOM NAV =====
function navGo(page, el) {
  document.querySelectorAll('.nav-item').forEach(n=>n.classList.remove('active'));
  el.classList.add('active');
  if (page==='home') {
    window.scrollTo({top:0,behavior:'smooth'});
    return;
  }
  const pages = {
    gagner:     'gagner.html',
    historique: 'historique.html',
    profil:     'profil.html'
  };
  if (pages[page]) window.location.href = pages[page];
}

function scrollToAds() {
  document.getElementById('adsAnchor').scrollIntoView({behavior:'smooth'});
}

// ===== SHARE =====
function shareApp() {
  if (navigator.share) {
    navigator.share({
      title: 'AfriMarket',
      text: 'Découvrez AfriMarket — La marketplace africaine de petites annonces !',
      url: window.location.origin
    }).catch(()=>{});
  } else {
    navigator.clipboard?.writeText(window.location.origin)
      .then(()=>showToast('Lien copié ! 📋','success'))
      .catch(()=>showToast('Partagez : '+window.location.origin,'info'));
  }
}

// ===== START =====
init();
</script>
