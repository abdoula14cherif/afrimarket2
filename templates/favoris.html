<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>AfriMarket — Mes Favoris</title>
  <!-- PWA -->
  <link rel="manifest" href="/manifest.json"/>
  <meta name="theme-color" content="#080E2A"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="AfriMarket"/>
  <link rel="apple-touch-icon" href="/icons/icon-192.png"/>
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152.png"/>
  <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144.png"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png"/>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{
      --blue:#1B3FE4;--blue2:#2D55FF;--red:#E83030;--orange:#FF6B1A;
      --turq:#00C2B7;--bg:#F2F5FF;--dark:#080E2A;--gray:#8892A8;
      --border:#E4E9F8;--gold:#F5B731;--green:#00C271;--nav-h:72px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);min-height:100vh;padding-bottom:calc(var(--nav-h)+20px);}

    /* HEADER */
    .header{position:sticky;top:0;z-index:100;background:linear-gradient(135deg,var(--dark) 0%,#0D1E6B 100%);height:60px;padding:0 1.2rem;display:flex;align-items:center;justify-content:space-between;box-shadow:0 4px 24px rgba(8,14,42,.35);}
    .h-back{color:rgba(255,255,255,.6);font-size:.82rem;font-weight:600;border:1px solid rgba(255,255,255,.15);padding:.35rem .8rem;border-radius:99px;text-decoration:none;transition:all .2s;}
    .h-back:hover{color:white;border-color:rgba(255,255,255,.4);}
    .h-logo{font-family:'Clash Display',sans-serif;font-size:1.4rem;font-weight:700;letter-spacing:-1px;}
    .h-logo .la{color:var(--turq);}.h-logo .lm{color:var(--orange);}
    .h-count{font-size:.75rem;font-weight:700;color:rgba(255,255,255,.5);}

    /* HERO */
    .hero{background:linear-gradient(135deg,var(--dark) 0%,#1B1045 60%,#2D1B69 100%);padding:1.6rem 1.2rem 3.5rem;position:relative;overflow:hidden;text-align:center;}
    .hero::before{content:'';position:absolute;width:220px;height:220px;border-radius:50%;background:rgba(232,48,48,.07);right:-50px;top:-60px;}
    .hero::after{content:'';position:absolute;width:160px;height:160px;border-radius:50%;background:rgba(255,107,26,.05);left:-40px;bottom:-50px;}
    .hero-inner{position:relative;z-index:1;}
    .hero-ico{font-size:2.4rem;margin-bottom:.5rem;animation:pulse 2s ease-in-out infinite;}
    @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}
    .hero-title{font-family:'Clash Display',sans-serif;font-size:1.5rem;font-weight:700;color:white;letter-spacing:-.5px;margin-bottom:.3rem;}
    .hero-sub{font-size:.76rem;color:rgba(255,255,255,.45);}

    /* STATS FLOAT */
    .stats-float{position:relative;z-index:10;margin:-1.8rem 1.2rem .9rem;background:white;border-radius:18px;border:1.5px solid var(--border);box-shadow:0 8px 24px rgba(27,63,228,.1);padding:.9rem 1.2rem;display:flex;gap:.5rem;}
    .sf{flex:1;text-align:center;}
    .sf+.sf{border-left:1px solid var(--border);}
    .sf-n{font-family:'Clash Display',sans-serif;font-size:1.3rem;font-weight:700;color:var(--dark);}
    .sf-l{font-size:.6rem;color:var(--gray);font-weight:600;margin-top:.1rem;}

    /* FILTER */
    .filter-row{display:flex;gap:.5rem;padding:.5rem 1.2rem 1rem;overflow-x:auto;scrollbar-width:none;}
    .filter-row::-webkit-scrollbar{display:none;}
    .chip{padding:.36rem .9rem;border-radius:99px;border:none;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;font-size:.74rem;font-weight:600;white-space:nowrap;transition:all .2s;flex-shrink:0;}
    .chip.active{background:var(--red);color:white;box-shadow:0 4px 12px rgba(232,48,48,.3);}
    .chip:not(.active){background:white;color:var(--gray);border:1px solid var(--border);}

    /* GRID */
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:.8rem;padding:0 1.2rem;}

    /* CARD */
    .fav-card{background:white;border-radius:18px;border:1.5px solid var(--border);overflow:hidden;box-shadow:0 2px 12px rgba(27,63,228,.06);animation:cardIn .35s ease both;cursor:pointer;position:relative;transition:box-shadow .2s,transform .2s;}
    .fav-card:hover{box-shadow:0 6px 20px rgba(27,63,228,.12);transform:translateY(-2px);}
    @keyframes cardIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    .fc-img{width:100%;aspect-ratio:1;overflow:hidden;background:linear-gradient(135deg,#E8EEFF,#F0F4FF);display:flex;align-items:center;justify-content:center;font-size:2.2rem;position:relative;}
    .fc-img img{width:100%;height:100%;object-fit:cover;}
    .fc-remove{position:absolute;top:.45rem;right:.45rem;width:28px;height:28px;border-radius:50%;background:rgba(232,48,48,.9);border:none;display:flex;align-items:center;justify-content:center;font-size:.75rem;cursor:pointer;z-index:2;transition:all .2s;}
    .fc-remove:hover{background:var(--red);transform:scale(1.1);}
    .fc-heart{position:absolute;top:.45rem;left:.45rem;font-size:.85rem;background:rgba(255,255,255,.9);padding:.2rem .4rem;border-radius:99px;border:1px solid rgba(232,48,48,.2);}
    .fc-body{padding:.7rem .8rem;}
    .fc-title{font-family:'Clash Display',sans-serif;font-size:.82rem;font-weight:700;color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:.2rem;}
    .fc-price{font-size:.78rem;font-weight:700;background:linear-gradient(90deg,var(--blue),var(--turq));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.3rem;}
    .fc-meta{font-size:.62rem;color:var(--gray);}
    .fc-actions{display:flex;gap:.4rem;padding:.5rem .8rem .7rem;border-top:1px solid var(--border);}
    .fc-btn{flex:1;padding:.38rem;border-radius:9px;border:none;font-size:.65rem;font-weight:700;cursor:pointer;transition:all .2s;}
    .fc-btn-wa{background:rgba(0,194,113,.08);color:var(--green);border:1px solid rgba(0,194,113,.2);}
    .fc-btn-wa:hover{background:var(--green);color:white;}
    .fc-btn-view{background:rgba(27,63,228,.06);color:var(--blue2);border:1px solid rgba(27,63,228,.12);}
    .fc-btn-view:hover{background:var(--blue2);color:white;}

    /* SKELETON */
    .skel-card{background:white;border-radius:18px;border:1.5px solid var(--border);overflow:hidden;}
    .sk{background:linear-gradient(90deg,#F0F4FF 25%,#E4E9F8 50%,#F0F4FF 75%);background-size:200% 100%;animation:shim 1.4s infinite;border-radius:6px;}
    @keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

    /* EMPTY */
    .empty{text-align:center;padding:3.5rem 1.5rem;grid-column:1/-1;}
    .empty-ico{font-size:3.5rem;display:block;margin-bottom:.8rem;}
    .empty-title{font-family:'Clash Display',sans-serif;font-size:1.1rem;font-weight:700;color:var(--dark);margin-bottom:.4rem;}
    .empty-sub{font-size:.78rem;color:var(--gray);line-height:1.6;margin-bottom:1.2rem;}
    .empty-btn{display:inline-block;padding:.7rem 1.6rem;border-radius:99px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;font-family:'Clash Display',sans-serif;font-size:.85rem;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(27,63,228,.3);}

    /* MODAL DETAIL */
    .ov{position:fixed;inset:0;background:rgba(8,14,42,.6);backdrop-filter:blur(5px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .3s;}
    .ov.open{opacity:1;pointer-events:all;}
    .modal{background:white;border-radius:24px 24px 0 0;width:100%;max-width:480px;max-height:90vh;overflow-y:auto;padding:0 0 2rem;transform:translateY(100%);transition:transform .4s cubic-bezier(.34,1.56,.64,1);}
    .ov.open .modal{transform:translateY(0);}
    .modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:1rem auto .5rem;}
    .m-img{width:100%;height:200px;background:linear-gradient(135deg,#E8EEFF,#F0F4FF);display:flex;align-items:center;justify-content:center;font-size:4rem;overflow:hidden;}
    .m-img img{width:100%;height:100%;object-fit:cover;}
    .m-body{padding:1rem 1.3rem;}
    .m-title{font-family:'Clash Display',sans-serif;font-size:1.2rem;font-weight:700;color:var(--dark);margin-bottom:.3rem;}
    .m-price{font-size:1.1rem;font-weight:700;background:linear-gradient(90deg,var(--blue),var(--turq));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:.7rem;}
    .m-tags{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem;}
    .m-tag{font-size:.68rem;background:var(--bg);color:var(--gray);padding:.22rem .6rem;border-radius:99px;border:1px solid var(--border);}
    .m-desc{font-size:.82rem;color:var(--dark);line-height:1.6;margin-bottom:1rem;}
    .m-seller{display:flex;align-items:center;gap:.7rem;background:var(--bg);border-radius:14px;padding:.8rem 1rem;margin-bottom:1rem;}
    .m-av{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--turq),var(--blue2));display:flex;align-items:center;justify-content:center;font-family:'Clash Display',sans-serif;font-size:.9rem;font-weight:700;color:white;flex-shrink:0;}
    .m-sinfo h4{font-size:.85rem;font-weight:700;color:var(--dark);}
    .m-sinfo p{font-size:.68rem;color:var(--gray);}
    .m-btns{display:flex;gap:.7rem;padding:0 1.3rem;}
    .m-btn{flex:1;padding:.78rem;border-radius:14px;border:none;font-family:'Clash Display',sans-serif;font-size:.88rem;font-weight:700;cursor:pointer;transition:all .2s;}
    .m-btn-wa{background:linear-gradient(135deg,var(--green),#00A878);color:white;box-shadow:0 4px 14px rgba(0,194,113,.25);}
    .m-btn-rm{background:rgba(232,48,48,.08);color:var(--red);border:1px solid rgba(232,48,48,.18);}
    .m-btn-rm:hover{background:var(--red);color:white;}

    /* BOTTOM NAV */
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:var(--nav-h);background:white;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 .5rem;box-shadow:0 -4px 20px rgba(8,14,42,.08);z-index:99;}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:.18rem;padding:.4rem .6rem;border:none;background:none;cursor:pointer;border-radius:12px;transition:background .2s;min-width:52px;position:relative;}
    .nav-item:hover{background:var(--bg);}
    .nav-ico{font-size:1.25rem;line-height:1;}
    .nav-lbl{font-size:.58rem;font-weight:600;color:var(--gray);}
    .nav-item.active .nav-lbl{color:var(--red);font-weight:700;}
    .nav-plus-btn{width:44px;height:44px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;font-size:1.4rem;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;box-shadow:0 4px 14px rgba(27,63,228,.4);}

    /* TOAST */
    #toast{position:fixed;bottom:calc(var(--nav-h)+12px);left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:white;padding:.7rem 1.2rem;border-radius:14px;font-size:.82rem;font-weight:600;opacity:0;transition:all .35s;pointer-events:none;z-index:300;border-left:3px solid var(--turq);box-shadow:0 8px 24px rgba(8,14,42,.3);max-width:88vw;text-align:center;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <a class="h-back" href="dashboard.html">← Accueil</a>
  <div class="h-logo"><span class="la">Afri</span><span class="lm">Market</span></div>
  <div class="h-count" id="hCount">0 favoris</div>
</div>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-ico">❤️</div>
    <div class="hero-title">Mes Favoris</div>
    <div class="hero-sub">Tes annonces sauvegardées en un seul endroit</div>
  </div>
</div>

<!-- STATS -->
<div class="stats-float">
  <div class="sf"><div class="sf-n" id="sfTotal">—</div><div class="sf-l">SAUVEGARDÉS</div></div>
  <div class="sf"><div class="sf-n" id="sfCats">—</div><div class="sf-l">CATÉGORIES</div></div>
  <div class="sf"><div class="sf-n" id="sfVilles">—</div><div class="sf-l">VILLES</div></div>
</div>

<!-- FILTRES PAR CATÉGORIE -->
<div class="filter-row" id="filterRow">
  <button class="chip active" onclick="setFilter('all',this)">❤️ Tous</button>
</div>

<!-- GRID -->
<div class="grid" id="grid">
  <!-- skeletons -->
  <div class="skel-card"><div class="sk" style="aspect-ratio:1"></div><div style="padding:.7rem .8rem;display:flex;flex-direction:column;gap:.4rem"><div class="sk" style="height:12px;width:80%"></div><div class="sk" style="height:10px;width:55%"></div></div></div>
  <div class="skel-card"><div class="sk" style="aspect-ratio:1"></div><div style="padding:.7rem .8rem;display:flex;flex-direction:column;gap:.4rem"><div class="sk" style="height:12px;width:70%"></div><div class="sk" style="height:10px;width:45%"></div></div></div>
  <div class="skel-card"><div class="sk" style="aspect-ratio:1"></div><div style="padding:.7rem .8rem;display:flex;flex-direction:column;gap:.4rem"><div class="sk" style="height:12px;width:75%"></div><div class="sk" style="height:10px;width:50%"></div></div></div>
  <div class="skel-card"><div class="sk" style="aspect-ratio:1"></div><div style="padding:.7rem .8rem;display:flex;flex-direction:column;gap:.4rem"><div class="sk" style="height:12px;width:65%"></div><div class="sk" style="height:10px;width:60%"></div></div></div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item " onclick="location.href='dashboard.html'">
    <span class="nav-ico">🏠</span><span class="nav-lbl">Accueil</span>
  </button>
  <button class="nav-item " onclick="location.href='messages.html'">
    <span class="nav-ico">💬</span><span class="nav-lbl">Messages</span>
  </button>
  <div class="nav-item nav-plus">
    <div class="nav-plus-btn" onclick="location.href='dashboard.html'">➕</div>
    <span class="nav-lbl" style="color:var(--blue2);font-weight:700">Publier</span>
  </div>
  <button class="nav-item active" onclick="location.href='favoris.html'">
    <span class="nav-ico">❤️</span><span class="nav-lbl">Favoris</span>
  </button>
  <button class="nav-item " onclick="location.href='profil.html'">
    <span class="nav-ico">👤</span><span class="nav-lbl">Profil</span>
  </button>
</nav>

<!-- MODAL DETAIL -->
<div class="ov" id="detailOv" onclick="if(event.target===this)closeDetail()">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="m-img" id="mImg">📦</div>
    <div class="m-body">
      <div class="m-title" id="mTitle">—</div>
      <div class="m-price" id="mPrice">—</div>
      <div class="m-tags" id="mTags"></div>
      <div class="m-desc" id="mDesc">—</div>
      <div class="m-seller">
        <div class="m-av" id="mAv">?</div>
        <div class="m-sinfo"><h4 id="mSeller">—</h4><p id="mSellerSub">Vendeur</p></div>
      </div>
    </div>
    <div class="m-btns">
      <button class="m-btn m-btn-wa" id="mWaBtn">💬 Contacter WhatsApp</button>
      <button class="m-btn m-btn-rm" id="mRmBtn">🗑️ Retirer</button>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
const{createClient}=supabase;
const sb=createClient(
  'https://elgbvitijyjriozvzqpf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
);

const EMOJI={immobilier:'🏠',vehicules:'🚗',electronique:'📱',mode:'👗',services:'🛠️',emploi:'💼',alimentation:'🥘',autres:'📦'};
let U=null, allFavs=[], currentFilter='all';

(async()=>{
  const{data:{session}}=await sb.auth.getSession();
  if(!session){location.href='index.html';return;}
  U=session.user;
  await loadFavs();
})();

async function loadFavs(){
  try{
    // 1. IDs favoris
    const{data:favRows,error:fErr}=await sb.from('favoris')
      .select('annonce_id,created_at')
      .eq('user_id',U.id)
      .order('created_at',{ascending:false});
    if(fErr) throw fErr;
    if(!favRows||!favRows.length){allFavs=[];render();return;}

    // 2. Annonces correspondantes
    const ids=favRows.map(f=>f.annonce_id);
    const{data:ads,error:aErr}=await sb.from('annonces')
      .select('*')
      .in('id',ids);
    if(aErr) throw aErr;

    // 3. Profils vendeurs
    const uids=[...new Set((ads||[]).map(a=>a.user_id).filter(Boolean))];
    let profMap={};
    if(uids.length){
      const{data:profs}=await sb.from('profiles').select('id,full_name,whatsapp,is_premium').in('id',uids);
      (profs||[]).forEach(p=>profMap[p.id]=p);
    }

    // 4. Fusionner et préserver l'ordre des favoris
    const adsMap={};
    (ads||[]).forEach(a=>adsMap[a.id]={...a,profiles:profMap[a.user_id]||{}});
    allFavs=favRows.map(f=>adsMap[f.annonce_id]).filter(Boolean);

    updateStats();
    buildFilters();
    render();
  }catch(e){
    showToast('Erreur de chargement','error');
    document.getElementById('grid').innerHTML=emptyHtml();
  }
}

function updateStats(){
  const n=allFavs.length;
  document.getElementById('sfTotal').textContent=n;
  document.getElementById('hCount').textContent=n+' favori'+(n>1?'s':'');
  const cats=new Set(allFavs.map(a=>a.categorie).filter(Boolean));
  const villes=new Set(allFavs.map(a=>a.ville).filter(Boolean));
  document.getElementById('sfCats').textContent=cats.size;
  document.getElementById('sfVilles').textContent=villes.size;
}

function buildFilters(){
  const cats=[...new Set(allFavs.map(a=>a.categorie).filter(Boolean))];
  const row=document.getElementById('filterRow');
  row.innerHTML=`<button class="chip active" onclick="setFilter('all',this)">❤️ Tous (${allFavs.length})</button>`;
  cats.forEach(cat=>{
    const n=allFavs.filter(a=>a.categorie===cat).length;
    row.innerHTML+=`<button class="chip" onclick="setFilter('${cat}',this)">${EMOJI[cat]||'📦'} ${cat} (${n})</button>`;
  });
}

function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.chip').forEach(c=>c.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function render(){
  const list=currentFilter==='all'?allFavs:allFavs.filter(a=>a.categorie===currentFilter);
  const grid=document.getElementById('grid');
  if(!list.length){
    grid.innerHTML=allFavs.length
      ?`<div class="empty"><span class="empty-ico">🔍</span><div class="empty-title">Aucun favori ici</div><div class="empty-sub">Tu n'as pas d'annonce dans cette catégorie.</div></div>`
      :emptyHtml();
    return;
  }
  grid.innerHTML=list.map((ad,i)=>{
    const emoji=EMOJI[ad.categorie]||'📦';
    const imgHtml=ad.image_url
      ?`<img src="${ad.image_url}" alt="${ad.titre||''}" onerror="this.parentElement.innerHTML='${emoji}'">`
      :emoji;
    const price=ad.prix?Number(ad.prix).toLocaleString('fr-FR')+' FCFA':'Prix à débattre';
    return `<div class="fav-card" style="animation-delay:${i*.05}s" onclick="openDetail('${ad.id}')">
      <div class="fc-img">
        ${imgHtml}
        <span class="fc-heart">❤️</span>
        <button class="fc-remove" onclick="event.stopPropagation();removeFav('${ad.id}')" title="Retirer">✕</button>
      </div>
      <div class="fc-body">
        <div class="fc-title">${ad.titre||'Sans titre'}</div>
        <div class="fc-price">${price}</div>
        <div class="fc-meta">📍 ${ad.ville||'—'} · ${EMOJI[ad.categorie]||'📦'} ${ad.categorie||'—'}</div>
      </div>
      <div class="fc-actions">
        <button class="fc-btn fc-btn-wa" onclick="event.stopPropagation();contactWA('${(ad.profiles?.whatsapp||ad.whatsapp||'')}')">💬 WA</button>
        <button class="fc-btn fc-btn-view" onclick="event.stopPropagation();openDetail('${ad.id}')">👁️ Voir</button>
      </div>
    </div>`;
  }).join('');
}

function emptyHtml(){
  return `<div class="empty">
    <span class="empty-ico">🤍</span>
    <div class="empty-title">Aucun favori encore</div>
    <div class="empty-sub">Appuie sur le ❤️ d'une annonce dans le dashboard pour la sauvegarder ici.</div>
    <a class="empty-btn" href="dashboard.html">🔍 Explorer les annonces</a>
  </div>`;
}

async function removeFav(id){
  await sb.from('favoris').delete().eq('user_id',U.id).eq('annonce_id',id);
  allFavs=allFavs.filter(a=>a.id!==id);
  updateStats();
  buildFilters();
  render();
  showToast('Retiré des favoris','info');
}

// ─── DETAIL MODAL ───
function openDetail(id){
  const ad=allFavs.find(a=>a.id===id);if(!ad)return;
  const emoji=EMOJI[ad.categorie]||'📦';
  const mImg=document.getElementById('mImg');
  if(ad.image_url){mImg.innerHTML=`<img src="${ad.image_url}" alt="${ad.titre||''}" style="width:100%;height:100%;object-fit:cover">`;mImg.style.fontSize='unset';}
  else{mImg.textContent=emoji;mImg.style.fontSize='4rem';}
  document.getElementById('mTitle').textContent=ad.titre||'Sans titre';
  document.getElementById('mPrice').textContent=ad.prix?Number(ad.prix).toLocaleString('fr-FR')+' FCFA':'Prix à débattre';
  document.getElementById('mDesc').textContent=ad.description||'Aucune description.';
  document.getElementById('mTags').innerHTML=
    `<span class="m-tag">📍 ${ad.ville||'—'}</span>`+
    `<span class="m-tag">${emoji} ${ad.categorie||'—'}</span>`+
    `<span class="m-tag">🕐 ${timeAgo(ad.created_at)}</span>`;
  const seller=ad.profiles||{};
  const sName=seller.full_name||'Vendeur';
  document.getElementById('mAv').textContent=sName[0]?.toUpperCase()||'?';
  document.getElementById('mSeller').textContent=sName;
  document.getElementById('mSellerSub').textContent=seller.is_premium?'👑 Premium · Vendeur vérifié ✅':'Vendeur AfriMarket';
  document.getElementById('mWaBtn').onclick=()=>contactWA(seller.whatsapp||ad.whatsapp||'');
  document.getElementById('mRmBtn').onclick=()=>{closeDetail();removeFav(id);};
  document.getElementById('detailOv').classList.add('open');
}
function closeDetail(){document.getElementById('detailOv').classList.remove('open');}

// ─── WA ───
function contactWA(num){
  if(!num){showToast('Numéro non disponible','warning');return;}
  let n=num.replace(/[\s\-\.\(\)]/g,'');
  if(n.startsWith('00')) n=n.slice(2); else n=n.replace(/^\+/,'');
  const prefixes=['237','225','221','223','226','228','229','241','242','235','224','33','1'];
  if(!prefixes.some(p=>n.startsWith(p))) n='237'+n;
  window.open('https://wa.me/'+n+'?text=Bonjour%2C%20je%20suis%20int%C3%A9ress%C3%A9%20par%20votre%20annonce%20sur%20AfriMarket%20%F0%9F%9B%92','_blank');
}

function timeAgo(d){
  if(!d)return '';
  const s=Math.floor((Date.now()-new Date(d))/1000);
  if(s<60)return 'À l\'instant';if(s<3600)return `Il y a ${Math.floor(s/60)} min`;
  if(s<86400)return `Il y a ${Math.floor(s/3600)} h`;return `Il y a ${Math.floor(s/86400)} j`;
}

let tt;
function showToast(msg,type='success'){
  const el=document.getElementById('toast');
  el.textContent=msg;el.className='show';
  el.style.borderLeftColor=type==='success'?'var(--turq)':type==='error'?'var(--red)':type==='warning'?'var(--orange)':'var(--blue2)';
  clearTimeout(tt);tt=setTimeout(()=>el.className='',3800);
}
