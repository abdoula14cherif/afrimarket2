<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Ambassadeurs — AfriMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--dark:#080E2A;--blue:#1B3FE4;--blue2:#2D55FF;--turq:#00C2B7;--gold:#F5B731;--red:#E83030;--gray:#8892A4;--border:#E8EDF5;--bg:#F4F6FC;--nav-h:72px;--orange:#FF6B1A;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--dark);padding-bottom:calc(var(--nav-h)+1rem);}

/* HEADER */
.hdr{background:linear-gradient(145deg,#080E2A 0%,#0d2a40 50%,#00C2B7 100%);padding:1.4rem 1.2rem 3rem;position:relative;overflow:hidden;}
.hdr::before{content:'';position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px;}
.hdr-back{display:inline-flex;align-items:center;gap:.4rem;color:rgba(255,255,255,.7);font-size:.8rem;font-weight:600;background:rgba(255,255,255,.1);border:none;padding:.35rem .8rem;border-radius:99px;cursor:pointer;margin-bottom:1rem;position:relative;}
.hdr-badge{display:inline-flex;align-items:center;gap:.35rem;background:rgba(245,183,49,.2);border:1px solid rgba(245,183,49,.4);color:var(--gold);font-size:.68rem;font-weight:800;padding:.3rem .8rem;border-radius:99px;margin-bottom:.7rem;position:relative;}
.hdr-title{font-family:'Clash Display',sans-serif;font-size:1.7rem;font-weight:700;color:white;position:relative;margin-bottom:.4rem;}
.hdr-sub{font-size:.8rem;color:rgba(255,255,255,.65);position:relative;margin-bottom:1.2rem;}
.hdr-commissions{display:flex;gap:.7rem;position:relative;}
.comm-pill{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.15);border-radius:12px;padding:.5rem .9rem;backdrop-filter:blur(6px);}
.comm-pill-n{font-family:'Clash Display',sans-serif;font-size:1rem;font-weight:700;color:white;}
.comm-pill-l{font-size:.6rem;color:rgba(255,255,255,.6);margin-top:.1rem;}

/* STATUS CARD */
.status-card{background:white;border-radius:22px;margin:-1.5rem 1.2rem 0;padding:1.4rem;box-shadow:0 8px 32px rgba(0,194,183,.15);position:relative;overflow:hidden;}

/* CANDIDATURE */
.cand-card{background:white;border-radius:18px;padding:1.3rem;box-shadow:0 2px 14px rgba(8,14,42,.06);}
.cand-title{font-family:'Clash Display',sans-serif;font-size:1rem;font-weight:700;margin-bottom:.3rem;}
.cand-desc{font-size:.78rem;color:var(--gray);line-height:1.6;margin-bottom:1.1rem;}

.f-group{margin-bottom:.9rem;}
.f-label{display:block;font-size:.7rem;font-weight:700;letter-spacing:.8px;text-transform:uppercase;color:var(--gray);margin-bottom:.35rem;}
.f-input,.f-select,.f-textarea{width:100%;padding:.65rem .85rem;border-radius:12px;border:1.5px solid var(--border);font-family:'Plus Jakarta Sans',sans-serif;font-size:.88rem;background:var(--bg);color:var(--dark);outline:none;transition:border-color .2s;}
.f-input:focus,.f-select:focus,.f-textarea:focus{border-color:var(--turq);}
.f-textarea{min-height:90px;resize:vertical;}
.f-grid2{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}

/* CRITÈRES */
.criteria{background:var(--bg);border-radius:14px;padding:.9rem;margin-bottom:1rem;}
.crit-title{font-size:.75rem;font-weight:700;margin-bottom:.55rem;}
.crit-row{display:flex;align-items:center;gap:.5rem;font-size:.75rem;color:var(--gray);margin-bottom:.3rem;}
.crit-row:last-child{margin:0;}
.crit-ico{font-size:.85rem;}

.btn-postuler{width:100%;padding:.85rem;border-radius:14px;background:linear-gradient(135deg,var(--dark),var(--turq));color:white;font-weight:700;font-size:.9rem;border:none;cursor:pointer;margin-top:.3rem;}
.btn-postuler:disabled{opacity:.5;cursor:not-allowed;}

/* DASHBOARD AMBASSADEUR */
.amb-hero{background:linear-gradient(135deg,var(--dark),#1B3FE4);border-radius:20px;padding:1.4rem;color:white;margin-bottom:1rem;position:relative;overflow:hidden;}
.amb-hero::after{content:'🤳';position:absolute;right:1rem;top:50%;transform:translateY(-50%);font-size:4rem;opacity:.12;}
.amb-code{font-family:monospace;font-size:1.2rem;font-weight:800;letter-spacing:2px;color:var(--turq);background:rgba(0,194,183,.15);padding:.4rem .9rem;border-radius:10px;display:inline-block;margin-bottom:.6rem;}
.amb-grade{font-size:.62rem;letter-spacing:2px;text-transform:uppercase;opacity:.65;margin-bottom:.3rem;}
.amb-name{font-family:'Clash Display',sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:.3rem;}

.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:.7rem;margin-bottom:1rem;}
.stat-box{background:white;border-radius:16px;padding:1rem;box-shadow:0 2px 10px rgba(8,14,42,.05);text-align:center;}
.stat-box-n{font-family:'Clash Display',sans-serif;font-size:1.4rem;font-weight:700;}
.stat-box-l{font-size:.68rem;color:var(--gray);margin-top:.15rem;}

/* PALIERS */
.palier-card{background:white;border-radius:16px;margin-bottom:.7rem;overflow:hidden;box-shadow:0 2px 10px rgba(8,14,42,.05);}
.palier-bar-outer{height:8px;background:var(--bg);}
.palier-bar-inner{height:100%;border-radius:99px;transition:width .5s ease;}
.palier-body{padding:.9rem;}
.palier-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:.3rem;}
.palier-name{font-weight:700;font-size:.88rem;}
.palier-reward{font-size:.75rem;color:var(--turq);font-weight:700;}
.palier-progress{font-size:.7rem;color:var(--gray);}

/* RECRUES */
.recrue-card{background:white;border-radius:14px;padding:.9rem;margin-bottom:.6rem;display:flex;align-items:center;gap:.8rem;box-shadow:0 2px 8px rgba(8,14,42,.04);}
.recrue-ico{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,var(--dark),var(--turq));display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0;color:white;font-weight:700;}
.recrue-info{flex:1;}
.recrue-name{font-weight:700;font-size:.82rem;}
.recrue-meta{font-size:.68rem;color:var(--gray);}
.recrue-comm{font-family:'Clash Display',sans-serif;font-size:.95rem;font-weight:700;color:var(--turq);}

/* PARTAGE LIEN */
.share-card{background:linear-gradient(135deg,var(--turq),var(--blue));border-radius:16px;padding:1.1rem;color:white;margin-bottom:1rem;}
.share-title{font-weight:800;font-size:.88rem;margin-bottom:.4rem;}
.share-link{background:rgba(255,255,255,.15);border-radius:10px;padding:.6rem .9rem;font-family:monospace;font-size:.8rem;margin-bottom:.7rem;word-break:break-all;}
.share-btns{display:flex;gap:.5rem;}
.share-btn{flex:1;padding:.55rem;border-radius:10px;background:rgba(255,255,255,.2);color:white;border:1px solid rgba(255,255,255,.3);font-size:.75rem;font-weight:700;cursor:pointer;}

/* TABS */
.tabs{display:flex;background:white;padding:.5rem 1.2rem;gap:.4rem;border-bottom:1px solid var(--border);}
.tab-btn{flex:1;padding:.45rem .3rem;border:none;background:transparent;font-family:'Plus Jakarta Sans',sans-serif;font-size:.7rem;font-weight:700;color:var(--gray);border-radius:9px;cursor:pointer;transition:all .2s;}
.tab-btn.active{background:linear-gradient(135deg,var(--dark),var(--turq));color:white;}

.content{padding:1.2rem;margin-top:-1.5rem;}
.sect-title{font-family:'Clash Display',sans-serif;font-size:.95rem;font-weight:700;margin:.7rem 0 .7rem;}
.spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--turq);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.empty-box{text-align:center;padding:2rem 1rem;}
.empty-ico{font-size:2.5rem;margin-bottom:.5rem;}
.empty-title{font-weight:700;margin-bottom:.25rem;}
.empty-sub{font-size:.78rem;color:var(--gray);}
#toast{position:fixed;bottom:calc(var(--nav-h)+1rem);left:50%;transform:translateX(-50%) translateY(10px);background:var(--dark);color:white;padding:.65rem 1.2rem;border-radius:12px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:999;white-space:nowrap;max-width:90vw;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* BOTTOM NAV */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;padding:0 .5rem;padding-bottom:env(safe-area-inset-bottom,0px);height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));box-shadow:0 -4px 20px rgba(8,14,42,.08);z-index:99;}
.nav-item{display:flex;flex-direction:column;align-items:center;gap:.18rem;background:none;border:none;cursor:pointer;padding:.4rem .6rem;border-radius:12px;flex:1;}
.nav-ico{font-size:1.25rem;line-height:1;}
.nav-lbl{font-size:.58rem;font-weight:600;color:var(--gray);}
.nav-plus-btn{width:46px;height:46px;border-radius:50%;background:linear-gradient(135deg,var(--blue),var(--turq));border:none;font-size:1.4rem;color:white;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(27,63,228,.35);}
</style>
</head>
<body>

<!-- HEADER -->
<div class="hdr">
  <button class="hdr-back" onclick="location.href='gagner.html'">← Retour</button>
  <div class="hdr-badge">🏆 Programme Elite</div>
  <h1 class="hdr-title">🤳 Devenir Ambassadeur</h1>
  <p class="hdr-sub">Recrute vendeurs et acheteurs dans ta ville. Gagne une commission sur chacun.</p>
  <div class="hdr-commissions">
    <div class="comm-pill"><div class="comm-pill-n">1 000 F</div><div class="comm-pill-l">/ vendeur recruté</div></div>
    <div class="comm-pill"><div class="comm-pill-n">250 F</div><div class="comm-pill-l">/ acheteur actif</div></div>
    <div class="comm-pill"><div class="comm-pill-n">Illimité</div><div class="comm-pill-l">recrues possibles</div></div>
  </div>
</div>

<!-- SECTION DYNAMIQUE -->
<div id="mainSection"><div style="padding:3rem;text-align:center;"><div class="spin"></div></div></div>

<div id="toast"></div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='dashboard.html'"><span class="nav-ico">🏠</span><span class="nav-lbl">Accueil</span></button>
  <button class="nav-item" onclick="location.href='messages.html'"><span class="nav-ico">💬</span><span class="nav-lbl">Messages</span></button>
  <div class="nav-item"><button class="nav-plus-btn" onclick="location.href='dashboard.html'">➕</button><span class="nav-lbl" style="color:var(--blue2);font-weight:700">Publier</span></div>
  <button class="nav-item active"><span class="nav-ico">💰</span><span class="nav-lbl" style="color:var(--blue)">Gagner</span></button>
  <button class="nav-item" onclick="location.href='profil.html'"><span class="nav-ico">👤</span><span class="nav-lbl">Profil</span></button>
</nav>

<script>
'use strict';
var sb = supabase.createClient(
  'https://elgbvitijyjriozvzqpf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
);
var U = null;
var AMB = null;
var RECRUES = [];

(async function(){
  var s = await sb.auth.getSession();
  if(!s.data.session){ location.href='index.html'; return; }
  U = s.data.session.user;
  await loadAmbassadeur();
})();

function fmt(n){ return Number(n||0).toLocaleString('fr-FR'); }
var _tt;
function toast(msg,type){
  var el=document.getElementById('toast');
  el.textContent=msg; el.className='show';
  el.style.background=type==='error'?'var(--red)':type==='success'?'#00a86b':'var(--dark)';
  clearTimeout(_tt); _tt=setTimeout(function(){el.className='';},3500);
}

// ── CHARGER STATUT AMBASSADEUR ────────────────────────────────
async function loadAmbassadeur(){
  try{
    var r = await sb.from('ambassadeurs').select('*').eq('user_id',U.id).single();
    if(r.error&&r.error.code==='PGRST116'){ renderCandidature(); return; }
    if(r.error&&r.error.code==='42P01'){ renderTableManquante(); return; }
    if(r.error) throw r.error;
    AMB = r.data;
    if(AMB.statut==='candidat') renderEnAttente();
    else if(AMB.statut==='approuve') renderDashboard();
    else if(AMB.statut==='refuse') renderRefuse();
    else renderCandidature();
  }catch(e){ renderCandidature(); }
}

// ── TABLE MANQUANTE ───────────────────────────────────────────
function renderTableManquante(){
  document.getElementById('mainSection').innerHTML=
    '<div class="content" style="margin-top:0"><div class="cand-card" style="margin-top:1rem">'+
    '<div class="empty-box"><div class="empty-ico">⚠️</div><div class="empty-title">Table manquante</div>'+
    '<div class="empty-sub">Execute earn_v3.sql dans Supabase SQL Editor pour activer cette fonctionnalité.</div></div>'+
    '</div></div>';
}

// ── FORMULAIRE CANDIDATURE ────────────────────────────────────
function renderCandidature(){
  document.getElementById('mainSection').innerHTML=
    '<div class="tabs">'+
      '<button class="tab-btn active" id="tabInfo" onclick="showCandTab(\'info\')">ℹ️ Comment ça marche</button>'+
      '<button class="tab-btn" id="tabPostuler" onclick="showCandTab(\'postuler\')">📝 Postuler</button>'+
    '</div>'+
    '<div class="content">'+

      '<div id="candInfo">'+
        // Comment ça marche
        '<div class="cand-card" style="margin-bottom:1rem">'+
          '<div class="cand-title">🤳 Le programme Ambassadeur</div>'+
          '<div class="cand-desc">Tu deviens le représentant officiel AfriMarket dans ta ville. Tu recrutes des vendeurs et acheteurs et tu gagnes une commission sur chacun d\'eux.</div>'+
          '<div style="display:grid;grid-template-columns:1fr 1fr;gap:.7rem">'+
            commBox('🏪','Vendeur recruté','1 000 FCFA','par vendeur actif','linear-gradient(135deg,#1B3FE4,#00C2B7)')+
            commBox('🛒','Acheteur recruté','250 FCFA','par achat réalisé','linear-gradient(135deg,#F5B731,#FF6B1A)')+
          '</div>'+
        '</div>'+

        // Étapes
        '<div class="sect-title">📋 Les étapes</div>'+
        step('1','Postule en remplissant le formulaire','On examine ta candidature sous 48h.')+
        step('2','Reçois ton code ambassadeur','Ex: AMB-DOUALA-K7X2 — unique et personnel.')+
        step('3','Partage ton lien de parrainage','Chaque inscription via ton lien = une recrue.')+
        step('4','Suivi en temps réel','Tableau de bord dédié avec tes stats et gains.')+
        step('5','Paiement mensuel','Tes commissions sont versées chaque 1er du mois.')+

        // Paliers
        '<div class="sect-title">🏆 Paliers & Bonus</div>'+
        '<div style="margin-bottom:1rem">'+
          palier('🥉 Débutant','0 → 10 recrues','Commissions standards','var(--gray)',100)+
          palier('🥈 Confirmé','11 → 50 recrues','+10% bonus sur commissions','#C0C0C0',0)+
          palier('🥇 Expert','51 → 200 recrues','+25% bonus + badge doré','var(--gold)',0)+
          palier('💎 Elite','200+ recrues','+50% bonus + contrat officiel','var(--turq)',0)+
        '</div>'+

        '<button onclick="showCandTab(\'postuler\')" style="width:100%;padding:.8rem;border-radius:14px;background:linear-gradient(135deg,var(--dark),var(--turq));color:white;font-weight:700;font-size:.9rem;border:none;cursor:pointer;margin-top:.3rem;">📝 Je veux postuler →</button>'+
      '</div>'+

      '<div id="candPostuler" style="display:none">'+
        '<div class="cand-card">'+
          '<div class="cand-title">📝 Ta candidature</div>'+
          '<div class="cand-desc">Remplis ce formulaire. Notre équipe examine chaque candidature personnellement.</div>'+

          '<div class="criteria">'+
            '<div class="crit-title">✅ Critères de sélection</div>'+
            '<div class="crit-row"><span class="crit-ico">📱</span>Compte AfriMarket actif depuis + de 7 jours</div>'+
            '<div class="crit-row"><span class="crit-ico">🌍</span>Résider en Afrique</div>'+
            '<div class="crit-row"><span class="crit-ico">💬</span>Avoir WhatsApp actif</div>'+
            '<div class="crit-row"><span class="crit-ico">🤝</span>Motivation sincère à représenter AfriMarket</div>'+
          '</div>'+

          '<div class="f-grid2">'+
            '<div class="f-group"><label class="f-label">Ville *</label><input class="f-input" id="ambVille" placeholder="Ex: Douala"/></div>'+
            '<div class="f-group"><label class="f-label">Quartier</label><input class="f-input" id="ambQuartier" placeholder="Ex: Akwa"/></div>'+
          '</div>'+
          '<div class="f-group"><label class="f-label">Pourquoi tu veux devenir ambassadeur ? *</label><textarea class="f-textarea" id="ambMotivation" placeholder="Explique ta motivation, ton réseau, pourquoi tu serais un bon ambassadeur AfriMarket..."></textarea></div>'+
          '<button class="btn-postuler" id="btnPostuler" onclick="soumettreCandidat()">🚀 Envoyer ma candidature</button>'+
          '<div style="font-size:.68rem;color:var(--gray);text-align:center;margin-top:.6rem;">Réponse sous 24-48h sur ton WhatsApp.</div>'+
        '</div>'+
      '</div>'+

    '</div>';
}

function commBox(ico,title,amount,sub,bg){
  return'<div style="background:white;border-radius:14px;padding:.9rem;box-shadow:0 2px 10px rgba(8,14,42,.05)">'+
    '<div style="width:36px;height:36px;border-radius:10px;background:'+bg+';display:flex;align-items:center;justify-content:center;font-size:1.1rem;margin-bottom:.5rem;">'+ico+'</div>'+
    '<div style="font-size:.7rem;color:var(--gray);margin-bottom:.2rem;">'+title+'</div>'+
    '<div style="font-family:Clash Display,sans-serif;font-size:1rem;font-weight:700;color:var(--dark);">'+amount+'</div>'+
    '<div style="font-size:.65rem;color:var(--gray);">'+sub+'</div>'+
  '</div>';
}

function step(n,title,desc){
  return'<div style="display:flex;gap:.8rem;margin-bottom:.8rem;background:white;border-radius:14px;padding:.85rem;box-shadow:0 2px 8px rgba(8,14,42,.04)">'+
    '<div style="width:32px;height:32px;border-radius:10px;background:linear-gradient(135deg,var(--dark),var(--turq));color:white;font-family:Clash Display,sans-serif;font-size:.9rem;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;">'+n+'</div>'+
    '<div><div style="font-weight:700;font-size:.85rem;margin-bottom:.15rem;">'+title+'</div><div style="font-size:.72rem;color:var(--gray);">'+desc+'</div></div>'+
  '</div>';
}

function palier(name,range,reward,color,pct){
  return'<div class="palier-card"><div class="palier-bar-outer"><div class="palier-bar-inner" style="width:'+pct+'%;background:'+color+'"></div></div>'+
    '<div class="palier-body"><div class="palier-row"><span class="palier-name">'+name+'</span><span class="palier-reward">'+reward+'</span></div>'+
    '<div class="palier-progress">'+range+'</div></div></div>';
}

function showCandTab(t){
  document.getElementById('candInfo').style.display    = t==='info'?'block':'none';
  document.getElementById('candPostuler').style.display= t==='postuler'?'block':'none';
  document.getElementById('tabInfo').classList.toggle('active',t==='info');
  document.getElementById('tabPostuler').classList.toggle('active',t==='postuler');
}

// ── SOUMETTRE CANDIDATURE ─────────────────────────────────────
async function soumettreCandidat(){
  var ville      = (document.getElementById('ambVille').value||'').trim();
  var quartier   = (document.getElementById('ambQuartier').value||'').trim();
  var motivation = (document.getElementById('ambMotivation').value||'').trim();
  if(!ville){ toast('Ville obligatoire','error'); return; }
  if(motivation.length<30){ toast('Explique ta motivation (minimum 30 caractères)','error'); return; }
  var btn = document.getElementById('btnPostuler');
  btn.disabled=true; btn.textContent='Envoi...';
  try{
    var r = await sb.from('ambassadeurs').insert({user_id:U.id,ville,quartier,motivation,statut:'candidat'});
    if(r.error) throw r.error;
    toast('Candidature envoyée ! Réponse sous 48h.','success');
    setTimeout(function(){ loadAmbassadeur(); },1500);
  }catch(e){
    if(e.message.includes('duplicate')) toast('Tu as déjà soumis une candidature.','error');
    else toast('Erreur: '+e.message,'error');
  }finally{ btn.disabled=false; btn.textContent='🚀 Envoyer ma candidature'; }
}

// ── EN ATTENTE ───────────────────────────────────────────────
function renderEnAttente(){
  document.getElementById('mainSection').innerHTML=
    '<div class="content" style="margin-top:0">'+
    '<div style="text-align:center;padding:2.5rem 1rem;background:white;border-radius:20px;margin-top:1rem;box-shadow:0 4px 20px rgba(8,14,42,.06)">'+
      '<div style="font-size:3rem;margin-bottom:.8rem;">⏳</div>'+
      '<div style="font-family:Clash Display,sans-serif;font-size:1.2rem;font-weight:700;margin-bottom:.5rem;">Candidature en cours d\'examen</div>'+
      '<div style="font-size:.82rem;color:var(--gray);line-height:1.7;max-width:280px;margin:0 auto 1.2rem;">Notre équipe examine ta candidature. Tu recevras une réponse sur ton WhatsApp dans les 24-48h.</div>'+
      '<div style="background:var(--bg);border-radius:12px;padding:.9rem;font-size:.78rem;color:var(--gray);">📅 Soumise le '+new Date(AMB.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'long',year:'numeric'})+'</div>'+
    '</div></div>';
}

// ── REFUSÉ ────────────────────────────────────────────────────
function renderRefuse(){
  document.getElementById('mainSection').innerHTML=
    '<div class="content" style="margin-top:0">'+
    '<div style="text-align:center;padding:2.5rem 1rem;background:white;border-radius:20px;margin-top:1rem;">'+
      '<div style="font-size:3rem;margin-bottom:.8rem;">❌</div>'+
      '<div style="font-family:Clash Display,sans-serif;font-size:1.1rem;font-weight:700;margin-bottom:.5rem;">Candidature non retenue</div>'+
      '<div style="font-size:.8rem;color:var(--gray);line-height:1.6;margin-bottom:1rem;">Tu peux retenter dans 30 jours avec une nouvelle candidature plus détaillée.</div>'+
      '<button onclick="location.href=\'gagner.html\'" style="padding:.7rem 1.5rem;border-radius:12px;background:var(--bg);color:var(--dark);font-weight:700;font-size:.85rem;border:1.5px solid var(--border);cursor:pointer;">← Retour</button>'+
    '</div></div>';
}

// ── DASHBOARD AMBASSADEUR ─────────────────────────────────────
async function renderDashboard(){
  var r = await sb.from('ambassadeur_recrues').select('*').eq('ambassadeur_id',AMB.id).order('created_at',{ascending:false});
  RECRUES = (r.data&&!r.error)?r.data:[];
  var totalGains = RECRUES.filter(function(x){return x.valide;}).reduce(function(s,x){return s+(x.commission||0);},0);
  var totalRecrues = RECRUES.length;
  var recruitLink = 'https://afrimarket2.vercel.app/index.html?ref=AMB-'+AMB.id.slice(0,8).toUpperCase();

  document.getElementById('mainSection').innerHTML=
    '<div class="tabs">'+
      '<button class="tab-btn active" id="tabDbStats" onclick="switchDashTab(\'stats\')">📊 Stats</button>'+
      '<button class="tab-btn" id="tabDbRecrues" onclick="switchDashTab(\'recrues\')">👥 Recrues</button>'+
      '<button class="tab-btn" id="tabDbPartage" onclick="switchDashTab(\'partage\')">🔗 Partager</button>'+
    '</div>'+
    '<div class="content">'+

      '<div id="dbStats">'+
        '<div class="amb-hero">'+
          '<div class="amb-grade">AMBASSADEUR OFFICIEL</div>'+
          '<div class="amb-name">'+esc(U.user_metadata.full_name||'Ambassadeur')+'</div>'+
          '<div style="font-size:.78rem;opacity:.7;margin-bottom:.7rem">'+AMB.ville+(AMB.quartier?' · '+AMB.quartier:'')+'</div>'+
          '<div class="amb-code">'+AMB.code_amb+'</div>'+
        '</div>'+

        '<div class="stats-grid">'+
          '<div class="stat-box"><div class="stat-box-n" style="color:var(--turq)">'+totalRecrues+'</div><div class="stat-box-l">Recrues totales</div></div>'+
          '<div class="stat-box"><div class="stat-box-n" style="color:var(--gold)">'+fmt(totalGains)+' F</div><div class="stat-box-l">Gains validés</div></div>'+
          '<div class="stat-box"><div class="stat-box-n" style="color:var(--blue)">'+RECRUES.filter(function(x){return x.valide;}).length+'</div><div class="stat-box-l">Recrues actives</div></div>'+
          '<div class="stat-box"><div class="stat-box-n" style="color:var(--orange)">'+RECRUES.filter(function(x){return !x.valide;}).length+'</div><div class="stat-box-l">En attente</div></div>'+
        '</div>'+

        '<div class="sect-title">🏆 Mon palier</div>'+
        renderPalierActuel(totalRecrues)+

      '</div>'+

      '<div id="dbRecrues" style="display:none">'+
        (RECRUES.length===0
          ?'<div class="empty-box"><div class="empty-ico">👥</div><div class="empty-title">Aucune recrue pour l\'instant</div><div class="empty-sub">Partage ton lien pour commencer à recruter !</div></div>'
          :RECRUES.map(function(r2){
            var d=new Date(r2.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});
            var typeIco=r2.type_recrue==='vendeur'?'🏪':'🛒';
            return'<div class="recrue-card">'+
              '<div class="recrue-ico">'+typeIco+'</div>'+
              '<div class="recrue-info">'+
                '<div class="recrue-name">'+(r2.type_recrue==='vendeur'?'Vendeur':'Acheteur')+' #'+r2.id.slice(0,6).toUpperCase()+'</div>'+
                '<div class="recrue-meta">'+d+' · '+(r2.valide?'Actif ✅':'En attente ⏳')+'</div>'+
              '</div>'+
              '<div class="recrue-comm" style="'+(r2.valide?'':'opacity:.4')+'">'+fmt(r2.commission)+' F</div>'+
            '</div>';
          }).join('')
        )+
      '</div>'+

      '<div id="dbPartage" style="display:none">'+
        '<div class="share-card">'+
          '<div class="share-title">🔗 Ton lien de recrutement</div>'+
          '<div class="share-link" id="recruitLinkEl">'+recruitLink+'</div>'+
          '<div class="share-btns">'+
            '<button class="share-btn" onclick="copyLink()">📋 Copier</button>'+
            '<button class="share-btn" onclick="shareWA()">💬 WhatsApp</button>'+
          '</div>'+
        '</div>'+
        '<div style="background:white;border-radius:14px;padding:1rem;box-shadow:0 2px 10px rgba(8,14,42,.05)">'+
          '<div style="font-weight:700;font-size:.85rem;margin-bottom:.5rem;">💡 Message WhatsApp suggéré</div>'+
          '<div style="font-size:.75rem;color:var(--gray);line-height:1.7;">'+
            'Salut ! Je t\'invite à rejoindre AfriMarket, la plateforme africaine pour vendre et acheter facilement.<br>'+
            'Inscris-toi gratuitement via mon lien : '+recruitLink+
          '</div>'+
        '</div>'+
      '</div>'+

    '</div>';
}

function renderPalierActuel(n){
  var paliers=[
    {name:'🥉 Débutant',min:0,max:10,bonus:0,color:'var(--gray)'},
    {name:'🥈 Confirmé',min:11,max:50,bonus:10,color:'#C0C0C0'},
    {name:'🥇 Expert',min:51,max:200,bonus:25,color:'var(--gold)'},
    {name:'💎 Elite',min:201,max:9999,bonus:50,color:'var(--turq)'}
  ];
  var current = paliers[0];
  for(var i=0;i<paliers.length;i++){ if(n>=paliers[i].min) current=paliers[i]; }
  var next = paliers[paliers.indexOf(current)+1];
  var pct = next ? Math.min(100,Math.round((n-current.min)/(next.min-current.min)*100)) : 100;
  return'<div style="background:white;border-radius:16px;padding:1.1rem;box-shadow:0 2px 10px rgba(8,14,42,.05)">'+
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:.7rem">'+
      '<div><div style="font-weight:800;font-size:.95rem;">'+current.name+'</div><div style="font-size:.72rem;color:var(--gray);">+'+current.bonus+'% bonus</div></div>'+
      (next?'<div style="text-align:right"><div style="font-size:.7rem;color:var(--gray)">Prochain</div><div style="font-weight:700;font-size:.8rem;">'+next.name+'</div></div>':
       '<div style="font-size:.75rem;color:var(--turq);font-weight:700;">Niveau max 🏆</div>')+
    '</div>'+
    '<div style="height:8px;background:var(--bg);border-radius:99px;overflow:hidden">'+
      '<div style="height:100%;width:'+pct+'%;background:'+current.color+';border-radius:99px;transition:width .5s"></div>'+
    '</div>'+
    (next?'<div style="font-size:.7rem;color:var(--gray);margin-top:.4rem;">'+n+' / '+next.min+' recrues pour atteindre '+next.name+'</div>':'')+
  '</div>';
}

function switchDashTab(t){
  ['stats','recrues','partage'].forEach(function(x){
    var el=document.getElementById('db'+x.charAt(0).toUpperCase()+x.slice(1));
    if(el) el.style.display=x===t?'block':'none';
    var btn=document.getElementById('tabDb'+x.charAt(0).toUpperCase()+x.slice(1));
    if(btn) btn.classList.toggle('active',x===t);
  });
}

function copyLink(){
  var el=document.getElementById('recruitLinkEl');
  var txt=el?el.textContent:'';
  if(navigator.clipboard){ navigator.clipboard.writeText(txt).then(function(){ toast('Lien copié !','success'); }); }
  else{ var ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();document.execCommand('copy');document.body.removeChild(ta);toast('Lien copié !','success'); }
}

function shareWA(){
  var el=document.getElementById('recruitLinkEl');
  var link=el?el.textContent:'';
  var msg=encodeURIComponent('Rejoins AfriMarket gratuitement via mon lien : '+link);
  window.open('https://wa.me/?text='+msg,'_blank');
}

function esc(s){ var d=document.createElement('div');d.textContent=s||'';return d.innerHTML; }
</script>
