<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content"/>
  <title>AfriMarket — Messages</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{
      --blue:#1B3FE4;--blue2:#2D55FF;--red:#E83030;--orange:#FF6B1A;
      --turq:#00C2B7;--bg:#F2F5FF;--dark:#080E2A;--gray:#8892A8;
      --border:#E4E9F8;--gold:#F5B731;--green:#00C271;--nav-h:68px;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html,body{height:100%;overflow:hidden;background:var(--bg);}
    body{font-family:'Plus Jakarta Sans',sans-serif;display:flex;flex-direction:column;}

    /* ── VUES ── */
    #viewList{display:flex;flex-direction:column;height:100%;overflow:hidden;background:var(--bg);}
    #viewChat{display:none;flex-direction:column;height:100%;overflow:hidden;background:var(--bg);}

    /* ── HEADER ── */
    .header{
      background:linear-gradient(135deg,var(--dark) 0%,#0D1E6B 100%);
      height:60px;padding:0 1.2rem;
      display:flex;align-items:center;justify-content:space-between;
      flex-shrink:0;box-shadow:0 4px 20px rgba(8,14,42,.3);
      gap:.8rem;
    }
    .h-back{
      color:rgba(255,255,255,.7);font-size:.8rem;font-weight:600;
      border:1px solid rgba(255,255,255,.2);padding:.35rem .85rem;
      border-radius:99px;text-decoration:none;white-space:nowrap;flex-shrink:0;
    }
    .h-logo{
      font-family:'Clash Display',sans-serif;font-size:1.3rem;font-weight:700;
      letter-spacing:-1px;white-space:nowrap;
    }
    .h-logo .la{color:var(--turq);}.h-logo .lm{color:var(--orange);}
    .h-count{
      font-size:.72rem;font-weight:700;color:rgba(255,255,255,.55);
      background:rgba(255,255,255,.08);padding:.28rem .65rem;
      border-radius:99px;border:1px solid rgba(255,255,255,.12);
      white-space:nowrap;flex-shrink:0;
    }

    /* ── LISTE SCROLL ── */
    .list-scroll{
      flex:1;overflow-y:auto;overflow-x:hidden;
      padding-bottom:calc(var(--nav-h) + 16px);
      background:white;
    }
    .list-scroll::-webkit-scrollbar{width:3px;}
    .list-scroll::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

    /* ── ITEM CONVERSATION ── */
    .conv-item{
      display:flex;align-items:center;gap:.85rem;
      padding:.9rem 1.1rem;cursor:pointer;
      transition:background .15s;position:relative;
      border-bottom:1px solid rgba(228,233,248,.7);
      background:white;
    }
    .conv-item:hover{background:#F7F9FF;}
    .conv-item:active{background:#EEF2FF;}
    .conv-item.unread{background:#FAFBFF;}

    /* AVATAR */
    .ci-av{
      width:48px;height:48px;border-radius:50%;
      background:linear-gradient(135deg,var(--turq),var(--blue2));
      display:flex;align-items:center;justify-content:center;
      font-family:'Clash Display',sans-serif;font-size:1.1rem;font-weight:700;
      color:white;flex-shrink:0;overflow:hidden;position:relative;
    }
    .ci-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .ci-unread-dot{
      position:absolute;bottom:1px;right:1px;
      width:12px;height:12px;background:var(--blue2);
      border-radius:50%;border:2px solid white;
    }

    /* CORPS */
    .ci-body{flex:1;min-width:0;}
    .ci-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:.22rem;gap:.4rem;}
    .ci-name{
      font-family:'Clash Display',sans-serif;font-size:.88rem;font-weight:700;
      color:var(--dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .ci-time{font-size:.62rem;color:var(--gray);flex-shrink:0;}
    .ci-preview{
      font-size:.74rem;color:var(--gray);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
      line-height:1.4;
    }
    .ci-preview.bold{color:var(--dark);font-weight:700;}

    /* BADGE NB MESSAGES */
    .ci-badge{
      background:var(--blue2);color:white;
      font-size:.58rem;font-weight:800;
      padding:.15rem .45rem;border-radius:99px;
      min-width:18px;text-align:center;
      flex-shrink:0;
    }

    /* ── CHAT HEADER ── */
    .chat-header{
      background:linear-gradient(135deg,var(--dark) 0%,#0D1E6B 100%);
      height:64px;padding:0 1rem;
      display:flex;align-items:center;gap:.75rem;
      flex-shrink:0;box-shadow:0 4px 20px rgba(8,14,42,.3);
    }
    .ch-back{
      background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.15);
      border-radius:50%;width:36px;height:36px;
      color:white;font-size:1rem;cursor:pointer;
      display:flex;align-items:center;justify-content:center;flex-shrink:0;
    }
    .ch-av{
      width:38px;height:38px;border-radius:50%;
      background:linear-gradient(135deg,var(--turq),var(--blue2));
      display:flex;align-items:center;justify-content:center;
      font-family:'Clash Display',sans-serif;font-size:.9rem;font-weight:700;
      color:white;flex-shrink:0;overflow:hidden;
    }
    .ch-av img{width:100%;height:100%;object-fit:cover;border-radius:50%;}
    .ch-info{flex:1;min-width:0;}
    .ch-name{
      font-family:'Clash Display',sans-serif;font-size:.93rem;font-weight:700;
      color:white;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .ch-sub{font-size:.62rem;color:rgba(255,255,255,.45);margin-top:.1rem;}
    .ch-wa{
      background:rgba(0,194,113,.15);border:1px solid rgba(0,194,113,.3);
      border-radius:99px;padding:.3rem .75rem;
      font-size:.72rem;font-weight:700;color:#4DFFB4;
      cursor:pointer;white-space:nowrap;flex-shrink:0;
    }

    /* ── CONTEXTE ANNONCE ── */
    .ad-context{
      background:rgba(27,63,228,.05);border-bottom:1px solid var(--border);
      padding:.6rem 1rem;display:flex;align-items:center;gap:.7rem;flex-shrink:0;
    }
    .adc-img{
      width:36px;height:36px;border-radius:10px;background:var(--bg);
      display:flex;align-items:center;justify-content:center;
      font-size:1.1rem;overflow:hidden;flex-shrink:0;
    }
    .adc-img img{width:100%;height:100%;object-fit:cover;}
    .adc-title{font-size:.75rem;font-weight:700;color:var(--dark);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .adc-price{font-size:.65rem;color:var(--blue2);font-weight:700;}

    /* ── ZONE MESSAGES ── */
    .msgs-zone{
      flex:1;overflow-y:auto;overflow-x:hidden;
      padding:.8rem 1rem 1rem;
      display:flex;flex-direction:column;gap:.5rem;
      scroll-behavior:smooth;background:#F7F9FF;
    }
    .msgs-zone::-webkit-scrollbar{width:3px;}
    .msgs-zone::-webkit-scrollbar-thumb{background:var(--border);border-radius:99px;}

    /* ── BULLES ── */
    .msg-wrap{display:flex;gap:.5rem;max-width:85%;animation:msgIn .2s ease;}
    @keyframes msgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
    .msg-wrap.me{align-self:flex-end;flex-direction:row-reverse;}
    .msg-wrap.them{align-self:flex-start;}
    .msg-av{
      width:28px;height:28px;border-radius:50%;
      background:linear-gradient(135deg,var(--turq),var(--blue2));
      display:flex;align-items:center;justify-content:center;
      font-size:.65rem;font-weight:700;color:white;
      flex-shrink:0;margin-top:auto;
    }
    .msg-bubble{
      padding:.62rem .9rem;border-radius:18px;
      font-size:.83rem;line-height:1.55;word-break:break-word;
      max-width:100%;
    }
    .msg-wrap.me .msg-bubble{
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white;border-bottom-right-radius:4px;
    }
    .msg-wrap.them .msg-bubble{
      background:white;color:var(--dark);
      border:1.5px solid var(--border);
      border-bottom-left-radius:4px;
      box-shadow:0 2px 8px rgba(27,63,228,.05);
    }
    .msg-time{font-size:.58rem;opacity:.6;margin-top:.2rem;display:block;text-align:right;}
    .msg-wrap.them .msg-time{text-align:left;}
    .msg-status{font-size:.6rem;opacity:.65;margin-top:.1rem;text-align:right;}
    .msg-del-btn{
      background:rgba(8,14,42,.08);border:none;border-radius:50%;
      width:20px;height:20px;font-size:.6rem;cursor:pointer;
      color:#8892A4;align-items:center;justify-content:center;
      position:absolute;top:-6px;right:-22px;display:flex;
    }

    /* ── SÉPARATEUR DATE ── */
    .date-sep{text-align:center;margin:.5rem 0;}
    .date-sep span{
      font-size:.63rem;font-weight:700;color:var(--gray);
      background:#EEF2FF;padding:.22rem .75rem;
      border-radius:99px;border:1px solid var(--border);
    }

    /* ── BARRE OUTILS ── */
    .tool-bar{
      background:white;border-top:1px solid var(--border);
      padding:.4rem .8rem;display:none;
      align-items:center;gap:.4rem;flex-wrap:wrap;flex-shrink:0;
    }
    .tool-bar.open{display:flex;}
    .tb-btn{
      display:flex;align-items:center;gap:.3rem;
      padding:.32rem .65rem;border-radius:99px;
      background:#F4F6FC;border:1.5px solid var(--border);
      font-size:.72rem;font-weight:700;cursor:pointer;color:var(--dark);
      white-space:nowrap;
    }

    /* ── INPUT ZONE ── */
    .input-zone{
      background:white;border-top:1px solid var(--border);
      padding:.7rem .9rem;
      display:flex;align-items:flex-end;gap:.6rem;
      flex-shrink:0;
      padding-bottom:max(.7rem, env(safe-area-inset-bottom));
    }
    .plus-btn{
      background:none;border:none;font-size:1.3rem;cursor:pointer;
      padding:.3rem;color:var(--gray);flex-shrink:0;line-height:1;
    }
    .msg-input{
      flex:1;border:1.5px solid var(--border);border-radius:22px;
      padding:.65rem 1rem;font-family:'Plus Jakarta Sans',sans-serif;
      font-size:.85rem;color:var(--dark);outline:none;
      resize:none;max-height:120px;line-height:1.45;
      transition:border-color .2s;background:var(--bg);
    }
    .msg-input:focus{border-color:var(--blue2);background:white;}
    .msg-send{
      width:42px;height:42px;border-radius:50%;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      border:none;color:white;font-size:1rem;cursor:pointer;
      display:flex;align-items:center;justify-content:center;
      flex-shrink:0;transition:all .2s;
      box-shadow:0 4px 12px rgba(27,63,228,.3);
    }
    .msg-send:hover{transform:scale(1.06);}
    .msg-send:disabled{opacity:.4;cursor:not-allowed;transform:none;}

    /* ── BOTTOM NAV ── */
    .bottom-nav{
      position:fixed;bottom:0;left:0;right:0;
      height:var(--nav-h);background:white;
      border-top:1px solid var(--border);
      display:flex;align-items:center;justify-content:space-around;
      padding:0 .3rem;z-index:100;
      box-shadow:0 -4px 20px rgba(8,14,42,.07);
    }
    .nav-item{
      display:flex;flex-direction:column;align-items:center;gap:.15rem;
      padding:.4rem .5rem;border:none;background:none;
      cursor:pointer;border-radius:12px;min-width:48px;
    }
    .nav-ico{font-size:1.2rem;line-height:1;}
    .nav-lbl{font-size:.57rem;font-weight:600;color:var(--gray);}
    .nav-item.active .nav-lbl{color:var(--blue2);}
    .nav-plus-btn{
      width:44px;height:44px;border-radius:50%;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white;font-size:1.3rem;display:flex;
      align-items:center;justify-content:center;
      border:none;cursor:pointer;
      box-shadow:0 4px 14px rgba(27,63,228,.35);
    }

    /* ── ÉTAT VIDE ── */
    .empty-state{
      flex:1;display:flex;flex-direction:column;
      align-items:center;justify-content:center;
      padding:2rem 1.5rem;text-align:center;color:var(--gray);
    }
    .empty-ico{font-size:2.8rem;margin-bottom:.6rem;opacity:.35;}
    .empty-title{font-family:'Clash Display',sans-serif;font-size:.92rem;font-weight:700;color:var(--dark);margin-bottom:.3rem;}
    .empty-sub{font-size:.74rem;line-height:1.6;}

    /* ── SKELETON ── */
    .sk{
      background:linear-gradient(90deg,#EEF2FF 25%,#E4E9F8 50%,#EEF2FF 75%);
      background-size:200% 100%;animation:shim 1.5s infinite;border-radius:8px;
    }
    @keyframes shim{from{background-position:200% 0}to{background-position:-200% 0}}

    /* ── MODALS ── */
    .modal-bg{
      display:none;position:fixed;inset:0;
      background:rgba(8,14,42,.55);z-index:300;
      align-items:flex-end;justify-content:center;
    }
    .modal-bg.open{display:flex;}
    .modal-sheet{
      background:white;border-radius:24px 24px 0 0;
      width:100%;max-width:480px;
      padding:1.4rem 1.2rem 2rem;
      max-height:85vh;overflow-y:auto;
    }
    .modal-handle{width:38px;height:4px;background:#E4E9F8;border-radius:99px;margin:0 auto 1.1rem;}
    .modal-title{font-weight:800;font-size:.95rem;margin-bottom:.8rem;}
    .modal-cancel{
      width:100%;padding:.65rem;margin-top:.5rem;
      border-radius:12px;background:transparent;
      color:var(--gray);border:1px solid var(--border);
      font-size:.82rem;cursor:pointer;
    }
    .opt-grid{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;margin-bottom:.7rem;}
    .opt-btn{
      padding:.75rem;border-radius:12px;
      background:#F4F6FC;border:1.5px solid var(--border);
      font-size:.82rem;font-weight:700;cursor:pointer;
      transition:all .15s;
    }
    .opt-btn:hover{background:#EEF2FF;border-color:var(--blue2);}
    .field-label{font-size:.68rem;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gray);margin-bottom:.3rem;display:block;}
    .field-inp{
      width:100%;padding:.65rem .85rem;border-radius:12px;
      border:1.5px solid var(--border);font-size:.85rem;
      outline:none;font-family:inherit;margin-bottom:.8rem;
    }
    .field-inp:focus{border-color:var(--blue2);}
    .btn-main{
      width:100%;padding:.8rem;border-radius:14px;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white;font-weight:700;font-size:.9rem;
      border:none;cursor:pointer;margin-bottom:.5rem;
    }
    .btn-danger{
      width:100%;padding:.75rem;border-radius:12px;
      background:rgba(232,48,48,.08);color:var(--red);
      border:1.5px solid rgba(232,48,48,.2);
      font-size:.82rem;font-weight:700;cursor:pointer;margin-bottom:.5rem;
    }

    /* ── TOAST ── */
    #toast{
      position:fixed;bottom:calc(var(--nav-h)+10px);left:50%;
      transform:translateX(-50%) translateY(16px);
      background:var(--dark);color:white;
      padding:.65rem 1.1rem;border-radius:14px;
      font-size:.8rem;font-weight:600;opacity:0;
      transition:all .32s;pointer-events:none;z-index:400;
      border-left:3px solid var(--turq);
      box-shadow:0 8px 24px rgba(8,14,42,.25);
      max-width:88vw;text-align:center;white-space:nowrap;
    }
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    #toast.success{border-color:var(--green);}
    #toast.error{border-color:var(--red);}
    #toast.warning{border-color:var(--gold);}

    /* ── BADGE MSG NON LUS ── */
    .badge-dot{
      position:absolute;top:-3px;right:-5px;
      background:var(--red);color:white;
      font-size:.5rem;font-weight:800;
      min-width:15px;height:15px;border-radius:99px;
      display:flex;align-items:center;justify-content:center;
      padding:0 3px;border:1.5px solid white;
    }
  </style>
</head>
<body>

<!-- ════ VUE LISTE ════ -->
<div id="viewList">
  <div class="header">
    <a class="h-back" href="dashboard.html">← Accueil</a>
    <div class="h-logo"><span class="la">Afri</span><span class="lm">Market</span></div>
    <div class="h-count" id="listCount">…</div>
  </div>

  <div class="list-scroll" id="convList">
    <!-- Skeletons -->
    <div style="padding:.9rem 1.1rem;display:flex;gap:.85rem;align-items:center;border-bottom:1px solid var(--border)">
      <div class="sk" style="width:48px;height:48px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:.45rem">
        <div class="sk" style="height:11px;width:55%"></div>
        <div class="sk" style="height:9px;width:75%"></div>
      </div>
    </div>
    <div style="padding:.9rem 1.1rem;display:flex;gap:.85rem;align-items:center;border-bottom:1px solid var(--border)">
      <div class="sk" style="width:48px;height:48px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:.45rem">
        <div class="sk" style="height:11px;width:40%"></div>
        <div class="sk" style="height:9px;width:68%"></div>
      </div>
    </div>
    <div style="padding:.9rem 1.1rem;display:flex;gap:.85rem;align-items:center">
      <div class="sk" style="width:48px;height:48px;border-radius:50%;flex-shrink:0"></div>
      <div style="flex:1;display:flex;flex-direction:column;gap:.45rem">
        <div class="sk" style="height:11px;width:48%"></div>
        <div class="sk" style="height:9px;width:60%"></div>
      </div>
    </div>
  </div>

  <nav class="bottom-nav">
    <button class="nav-item" onclick="location.href='dashboard.html'">
      <span class="nav-ico">🏠</span><span class="nav-lbl">Accueil</span>
    </button>
    <button class="nav-item active" style="position:relative;">
      <span class="nav-ico" style="position:relative;">💬
        <span id="navMsgBadge" class="badge-dot" style="display:none">0</span>
      </span>
      <span class="nav-lbl" style="color:var(--blue2);font-weight:700">Messages</span>
    </button>
    <div class="nav-item">
      <button class="nav-plus-btn" onclick="location.href='dashboard.html'">+</button>
      <span class="nav-lbl" style="color:var(--blue2);font-weight:700">Publier</span>
    </div>
    <button class="nav-item" onclick="location.href='gagner.html'">
      <span class="nav-ico">💰</span><span class="nav-lbl">Gagner</span>
    </button>
    <button class="nav-item" onclick="location.href='profil.html'">
      <span class="nav-ico">👤</span><span class="nav-lbl">Profil</span>
    </button>
  </nav>
</div>

<!-- ════ VUE CHAT ════ -->
<div id="viewChat">
  <div class="chat-header">
    <button class="ch-back" onclick="backToList()">←</button>
    <div class="ch-av" id="chAv">?</div>
    <div class="ch-info">
      <div class="ch-name" id="chName">—</div>
      <div class="ch-sub" id="chSub">AfriMarket</div>
    </div>
    <button class="ch-wa" id="chWaBtn" style="display:none" onclick="contactWA()">💬 WA</button>
  </div>

  <div class="ad-context" id="adContext" style="display:none">
    <div class="adc-img" id="adcImg">📦</div>
    <div style="flex:1;min-width:0">
      <div class="adc-title" id="adcTitle">—</div>
      <div class="adc-price" id="adcPrice">—</div>
    </div>
  </div>

  <div class="msgs-zone" id="msgsZone"></div>

  <div class="tool-bar" id="toolBar">
    <button class="tb-btn" onclick="openMediaModal()">📷 Photo/Vidéo</button>
    <button class="tb-btn" onclick="openEphemereModal()">⏱ Éphémère</button>
    <button class="tb-btn" onclick="openGroupModal()">👥 Groupe</button>
    <span id="ephemereBadge" style="display:none;font-size:.68rem;font-weight:700;background:rgba(255,107,26,.12);color:var(--orange);padding:.2rem .6rem;border-radius:99px;"></span>
  </div>

  <div class="input-zone">
    <button class="plus-btn" onclick="toggleToolBar()">＋</button>
    <textarea class="msg-input" id="msgInput" placeholder="Écrire un message…" rows="1"
      onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg();}"
      oninput="autoResize(this)" disabled></textarea>
    <button class="msg-send" id="sendBtn" onclick="sendMsg()" disabled>➤</button>
  </div>
</div>

<!-- MODAL MÉDIA -->
<div class="modal-bg" id="mediaModal" onclick="if(event.target===this)closeMediaModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title">📷 Envoyer un fichier</div>
    <label style="display:flex;align-items:center;justify-content:center;gap:.5rem;width:100%;padding:1.4rem;border:2px dashed var(--border);border-radius:14px;cursor:pointer;margin-bottom:.8rem;font-size:.85rem;color:var(--gray);">
      <span style="font-size:1.8rem">📎</span> Choisir une photo ou vidéo
      <input type="file" id="mediaFileInput" accept="image/*,video/*" style="display:none" onchange="sendMedia(this)"/>
    </label>
    <span class="field-label">Légende (optionnelle)</span>
    <input class="field-inp" id="mediaCaption" type="text" placeholder="Ajouter une légende…"/>

<!-- MODAL ÉPHÉMÈRE -->
<div class="modal-bg" id="ephemereModal" onclick="if(event.target===this)closeEphemereModal()">
  <div class="modal-sheet" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>

<div id="toast"></div>

<script>
'use strict';
var sb=supabase.createClient(
  'https://elgbvitijyjriozvzqpf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
);
var U=null,myProfile={},currentConvId=null,currentOther={};
var allMsgs=[],allConvs=[],realtimeChat=null,realtimeList=null;
var EPHEMERE_DURATION=null,EPHEMERE_TIMER=null;

// ── INIT ──
(async function(){
  var s=await sb.auth.getSession();
  if(!s.data.session){location.href='auth.html';return;}
  U=s.data.session.user;
  var rp=await sb.from('profiles').select('*').eq('id',U.id).single();
  if(rp.data)myProfile=rp.data;
  var params=new URLSearchParams(location.search);
  await loadConversations();
  setupListRealtime();
  updateNavBadge();
  var withId=params.get('with'),adId=params.get('ad');
  if(withId)await openOrCreateConv(withId,adId);
})();

// ── CONVERSATIONS ──
async function loadConversations(){
  var r=await sb.from('conversations')
    .select('*').or('participant_1.eq.'+U.id+',participant_2.eq.'+U.id)
    .order('last_message_at',{ascending:false});
  allConvs=r.data||[];

  var el=document.getElementById('convList');
  var cnt=document.getElementById('listCount');
  if(cnt)cnt.textContent=allConvs.length+' conversation'+(allConvs.length>1?'s':'');

  if(!allConvs.length){
    el.innerHTML='<div class="empty-state"><div class="empty-ico">💬</div><div class="empty-title">Aucune conversation</div><div class="empty-sub">Contacte un vendeur depuis une annonce pour démarrer.</div></div>';
    return;
  }

  var otherIds=allConvs.map(function(c){return c.participant_1===U.id?c.participant_2:c.participant_1;});
  var rp=await sb.from('profiles').select('id,full_name,avatar_url,is_premium,whatsapp').in('id',[...new Set(otherIds)]);
  var pm={};(rp.data||[]).forEach(function(p){pm[p.id]=p;});

  var ru=await sb.from('messages').select('conversation_id')
    .in('conversation_id',allConvs.map(function(c){return c.id;}))
    .eq('read',false).neq('sender_id',U.id);
  var uMap={};
  (ru.data||[]).forEach(function(r){uMap[r.conversation_id]=(uMap[r.conversation_id]||0)+1;});

  el.innerHTML=allConvs.map(function(conv){
    var othId=conv.participant_1===U.id?conv.participant_2:conv.participant_1;
    var oth=pm[othId]||{};
    var name=oth.full_name||'Utilisateur';
    var init=name[0].toUpperCase();
    var unread=uMap[conv.id]||0;
    var t=conv.last_message_at?timeAgo(conv.last_message_at):'';
    var preview=conv.last_message||'Nouvelle conversation';
    var avHtml=oth.avatar_url?'<img src="'+esc(oth.avatar_url)+'"/>':init;
    return '<div class="conv-item'+(unread?' unread':'')+'" onclick="openConv(\''+conv.id+'\',\''+othId+'\')">'+
      '<div class="ci-av">'+avHtml+(unread?'<div class="ci-unread-dot"></div>':'')+'</div>'+
      '<div class="ci-body">'+
        '<div class="ci-top">'+
          '<div class="ci-name">'+esc(name)+(oth.is_premium?' 👑':'')+'</div>'+
          '<div class="ci-time">'+t+'</div>'+
        '</div>'+
        '<div class="ci-preview'+(unread?' bold':'')+'">'+esc(preview.slice(0,50))+'</div>'+
      '</div>'+
      (unread?'<div class="ci-badge">'+unread+'</div>':'')+
    '</div>';
  }).join('');
}

// ── OUVRIR / CRÉER CONV ──
async function openOrCreateConv(otherId,adId){
  var existing=allConvs.find(function(c){return(c.participant_1===U.id&&c.participant_2===otherId)||(c.participant_1===otherId&&c.participant_2===U.id);});
  if(existing){await openConv(existing.id,otherId,adId);return;}
  var r=await sb.from('conversations').insert({participant_1:U.id,participant_2:otherId,last_message:'',last_message_at:new Date().toISOString()}).select().single();
  if(r.error){showToast('Erreur: '+r.error.message,'error');return;}
  allConvs.unshift(r.data);
  await openConv(r.data.id,otherId,adId);
}

async function openConv(convId,otherId,adId){
  currentConvId=convId;
  if(realtimeChat){realtimeChat.unsubscribe();realtimeChat=null;}
  var roth=await sb.from('profiles').select('*').eq('id',otherId).single();
  var oth=roth.data||{};
  currentOther={id:otherId,name:oth.full_name||'Utilisateur',avatar:oth.avatar_url||'',wa:oth.whatsapp||''};
  document.getElementById('chName').textContent=currentOther.name;
  document.getElementById('chSub').textContent='AfriMarket';
  var av=document.getElementById('chAv');
  av.innerHTML=oth.avatar_url?'<img src="'+esc(oth.avatar_url)+'"/>':currentOther.name[0].toUpperCase();
  var waBtn=document.getElementById('chWaBtn');
  if(waBtn)waBtn.style.display=currentOther.wa?'block':'none';
  document.getElementById('viewList').style.display='none';
  document.getElementById('viewChat').style.display='flex';
  document.getElementById('msgInput').disabled=false;
  document.getElementById('sendBtn').disabled=false;
  await loadMessages();
  startChatRealtime();
  sb.from('messages').update({read:true}).eq('conversation_id',convId).neq('sender_id',U.id).then(function(){});
  if(adId)loadAdContext(adId);
}

async function loadAdContext(adId){
  var r=await sb.from('annonces').select('titre,prix,photos').eq('id',adId).single();
  if(!r.data)return;
  var ad=r.data;
  document.getElementById('adcTitle').textContent=ad.titre||'Annonce';
  document.getElementById('adcPrice').textContent=ad.prix?Number(ad.prix).toLocaleString('fr-FR')+' FCFA':'Prix non renseigné';
  var img=document.getElementById('adcImg');
  var photos=ad.photos;if(typeof photos==='string')try{photos=JSON.parse(photos);}catch(e){}
  if(Array.isArray(photos)&&photos[0])img.innerHTML='<img src="'+esc(photos[0])+'" style="width:100%;height:100%;object-fit:cover;border-radius:10px;"/>';
  document.getElementById('adContext').style.display='flex';
}

// ── MESSAGES ──
async function loadMessages(){
  var r=await sb.from('messages').select('*').eq('conversation_id',currentConvId).order('created_at',{ascending:true});
  var now=new Date();
  allMsgs=(r.data||[]).filter(function(m){
    if(m.is_deleted)return false;
    if(m.expires_at&&new Date(m.expires_at)<now)return false;
    return true;
  });
  renderMessages();
}

function renderMessages(){
  var zone=document.getElementById('msgsZone');
  if(!allMsgs.length){
    zone.innerHTML='<div class="empty-state"><div class="empty-ico">👋</div><div class="empty-title">Dites bonjour !</div><div class="empty-sub">Démarrez la conversation avec '+esc(currentOther.name||'…')+'</div></div>';
    return;
  }
  var html='<div style="flex:1;min-height:.5rem"></div>';
  var lastDate='';
  allMsgs.forEach(function(msg){
    var d=new Date(msg.created_at);
    var dateStr=d.toLocaleDateString('fr-FR',{weekday:'long',day:'2-digit',month:'long'});
    if(dateStr!==lastDate){html+='<div class="date-sep"><span>'+dateStr+'</span></div>';lastDate=dateStr;}
    var isMe=msg.sender_id===U.id;
    var time=d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
    var init=isMe?(myProfile.full_name||'M')[0].toUpperCase():(currentOther.name||'?')[0].toUpperCase();
    var epBadge=msg.expires_at?'<span style="font-size:.56rem;opacity:.6;margin-left:.3rem;">⏱</span>':'';
    var content='';
    if(msg.media_url){
      if(msg.media_type==='video'){
        content='<video src="'+esc(msg.media_url)+'" style="max-width:200px;border-radius:10px;display:block;margin-bottom:.3rem;" controls></video>';
      }else{
        content='<img src="'+esc(msg.media_url)+'" style="max-width:200px;border-radius:10px;display:block;margin-bottom:.3rem;cursor:pointer;" onclick="window.open(this.src,\'_blank\')"/>';
      }
      if(msg.content)content+='<span>'+esc(msg.content)+'</span>';
    }else{
      content=esc(msg.content||'');
    }
    var delBtn=isMe?'<button class="msg-del-btn" onclick="deleteMessage(\''+msg.id+'\')" title="Supprimer">✕</button>':'';
    html+='<div class="msg-wrap '+(isMe?'me':'them')+'" id="msg-'+msg.id+'" style="position:relative">'+
      (!isMe?'<div class="msg-av">'+init+'</div>':'')+
      '<div style="position:relative">'+
        '<div class="msg-bubble">'+content+'<span class="msg-time">'+time+epBadge+'</span></div>'+
        delBtn+
        (isMe?'<div class="msg-status" style="color:'+(msg.read?'var(--green)':'rgba(100,120,200,.55)')+';">'+(msg.read?'✓✓ Lu':'✓ Envoyé')+'</div>':'')+
      '</div>'+
      (isMe?'<div class="msg-av" style="background:linear-gradient(135deg,var(--orange),var(--gold))">'+init+'</div>':'')+
    '</div>';
  });
  zone.innerHTML=html;
  scrollBottom();
}

// ── ENVOYER ──
async function sendMsg(){
  var inp=document.getElementById('msgInput');
  var content=inp.value.trim();
  if(!content||!currentConvId)return;
  var btn=document.getElementById('sendBtn');
  btn.disabled=true;inp.value='';inp.style.height='auto';
  var expiresAt=EPHEMERE_DURATION?new Date(Date.now()+EPHEMERE_DURATION*1000).toISOString():null;
  var temp={id:'tmp_'+Date.now(),conversation_id:currentConvId,sender_id:U.id,content:content,read:false,created_at:new Date().toISOString(),expires_at:expiresAt,media_url:null};
  allMsgs.push(temp);renderMessages();
  try{
    var payload={conversation_id:currentConvId,sender_id:U.id,content:content,read:false};
    if(expiresAt)payload.expires_at=expiresAt;
    var r=await sb.from('messages').insert(payload).select().single();
    if(r.error)throw r.error;
    var idx=allMsgs.findIndex(function(m){return m.id===temp.id;});
    if(idx!==-1)allMsgs[idx]=r.data;
    renderMessages();
    await sb.from('conversations').update({last_message:content.length>60?content.slice(0,60)+'…':content,last_message_at:new Date().toISOString()}).eq('id',currentConvId);
    try{await sb.from('notifications').insert({user_id:currentOther.id,title:'💬 '+(myProfile.full_name||'Quelqu\'un'),message:content.length>80?content.slice(0,80)+'…':content,icon:'💬',type:'info',read:false,created_at:new Date().toISOString()});}catch(e){}
  }catch(e){
    allMsgs=allMsgs.filter(function(m){return m.id!==temp.id;});
    renderMessages();inp.value=content;
    showToast('Erreur: '+e.message,'error');
  }finally{btn.disabled=false;inp.focus();}
}

async function deleteMessage(msgId){
  if(!confirm('Supprimer ce message ?'))return;
  var r=await sb.from('messages').update({is_deleted:true,content:''}).eq('id',msgId).eq('sender_id',U.id);
  if(r.error){showToast('Erreur','error');return;}
  allMsgs=allMsgs.filter(function(m){return m.id!==msgId;});
  renderMessages();showToast('Supprimé','success');
}

async function sendMedia(input){
  var file=input.files[0];if(!file)return;
  if(file.size>20*1024*1024){showToast('Fichier trop grand (max 20 Mo)','warning');return;}
  var isVideo=file.type.startsWith('video/');
  showToast('Envoi en cours…','info');
  try{
    var ext=file.name.split('.').pop();
    var path=U.id+'/msg-'+Date.now()+'.'+ext;
    var url=null;
    for(var b of['boutique-media','avatars']){
      var up=await sb.storage.from(b).upload(path,file,{upsert:true,contentType:file.type});
      if(!up.error){url=sb.storage.from(b).getPublicUrl(path).data.publicUrl;break;}
    }
    var caption=(document.getElementById('mediaCaption')||{}).value||'';
    closeMediaModal();
    var expiresAt=EPHEMERE_DURATION?new Date(Date.now()+EPHEMERE_DURATION*1000).toISOString():null;
    var payload={conversation_id:currentConvId,sender_id:U.id,content:caption,read:false,media_url:url||'',media_type:isVideo?'video':'image'};
    if(expiresAt)payload.expires_at=expiresAt;
    var r=await sb.from('messages').insert(payload).select().single();
    if(r.error)throw r.error;
    allMsgs.push(r.data);renderMessages();
    await sb.from('conversations').update({last_message:isVideo?'🎥 Vidéo':'📷 Photo',last_message_at:new Date().toISOString()}).eq('id',currentConvId);
    showToast('Envoyé !','success');
  }catch(e){showToast('Erreur: '+e.message,'error');}
  finally{input.value='';}
}

// ── MODALS ──
function openMediaModal(){document.getElementById('mediaModal').classList.add('open');}
function closeMediaModal(){document.getElementById('mediaModal').classList.remove('open');}
function openEphemereModal(){document.getElementById('ephemereModal').classList.add('open');}
function closeEphemereModal(){document.getElementById('ephemereModal').classList.remove('open');}
function openGroupModal(){document.getElementById('groupModal').classList.add('open');loadGroupMembers();}
function closeGroupModal(){document.getElementById('groupModal').classList.remove('open');}

function setEphemereDuration(secs,label){
  EPHEMERE_DURATION=secs;closeEphemereModal();
  var badge=document.getElementById('ephemereBadge');
  if(badge){badge.textContent=secs?'⏱ '+label:'';badge.style.display=secs?'inline-block':'none';}
  showToast(secs?'Éphémère: '+label:'Éphémères désactivés','success');
  clearInterval(EPHEMERE_TIMER);
  if(secs)EPHEMERE_TIMER=setInterval(function(){allMsgs=allMsgs.filter(function(m){return !m.expires_at||new Date(m.expires_at)>new Date();});renderMessages();},5000);
}

async function loadGroupMembers(){
  var el=document.getElementById('groupMembersList');if(!el)return;
  el.innerHTML='<div style="padding:.5rem;font-size:.78rem;color:var(--gray)">Chargement…</div>';
  var r=await sb.from('profiles').select('id,full_name').neq('id',U.id).limit(30).order('full_name');
  if(!r.data||!r.data.length){el.innerHTML='<div style="padding:.5rem;font-size:.78rem;color:var(--gray)">Aucun utilisateur</div>';return;}
  el.innerHTML=r.data.map(function(p){
    return '<label style="display:flex;align-items:center;gap:.6rem;padding:.5rem .7rem;cursor:pointer;font-size:.82rem;border-bottom:1px solid var(--border)">'+
      '<input type="checkbox" value="'+p.id+'" style="width:16px;height:16px;cursor:pointer"/>'+
      '<div style="width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#7C3AED,#1B3FE4);display:flex;align-items:center;justify-content:center;color:white;font-weight:700;font-size:.75rem;flex-shrink:0">'+esc(p.full_name[0].toUpperCase())+'</div>'+
      esc(p.full_name)+'</label>';
  }).join('');
}

async function creerGroupe(){
  var nom=(document.getElementById('groupName').value||'').trim();
  if(!nom){showToast('Nom du groupe obligatoire','warning');return;}
  var members=[].slice.call(document.querySelectorAll('#groupMembersList input:checked')).map(function(i){return i.value;});
  if(!members.length){showToast('Sélectionne au moins un membre','warning');return;}
  try{
    var r=await sb.from('conversations').insert({participant_1:U.id,participant_2:members[0],last_message:'[Groupe] '+nom,last_message_at:new Date().toISOString()}).select().single();
    if(r.error)throw r.error;
    await sb.from('messages').insert({conversation_id:r.data.id,sender_id:U.id,content:'Groupe "'+nom+'" créé ! '+(members.length+1)+' membres.',read:false});
    closeGroupModal();
    allConvs.unshift(r.data);await loadConversations();await openConv(r.data.id,members[0]);
    showToast('Groupe "'+nom+'" créé !','success');
  }catch(e){showToast('Erreur: '+e.message,'error');}
}

// ── BADGE NAV ──
async function updateNavBadge(){
  try{
    if(!allConvs.length)return;
    var r=await sb.from('messages').select('id',{count:'exact',head:true})
      .in('conversation_id',allConvs.map(function(c){return c.id;}))
      .eq('read',false).neq('sender_id',U.id);
    var badge=document.getElementById('navMsgBadge');
    if(badge){
      if(r.count>0){badge.textContent=r.count>99?'99+':r.count;badge.style.display='flex';}
      else badge.style.display='none';
    }
  }catch(e){}
}

// ── REALTIME ──
function startChatRealtime(){
  realtimeChat=sb.channel('chat-'+currentConvId)
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages',filter:'conversation_id=eq.'+currentConvId},function(p){
      if(p.new.sender_id===U.id||p.new.is_deleted)return;
      allMsgs.push(p.new);renderMessages();
      sb.from('messages').update({read:true}).eq('id',p.new.id).then(function(){});
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'messages',filter:'conversation_id=eq.'+currentConvId},function(p){
      if(p.new.is_deleted){allMsgs=allMsgs.filter(function(m){return m.id!==p.new.id;});}
      else{var i=allMsgs.findIndex(function(m){return m.id===p.new.id;});if(i!==-1)allMsgs[i]=p.new;}
      renderMessages();
    }).subscribe();
}

function setupListRealtime(){
  realtimeList=sb.channel('convlist-'+U.id)
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'conversations'},function(){loadConversations();updateNavBadge();})
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'messages'},function(){updateNavBadge();})
    .subscribe();
}

// ── UTILS ──
function backToList(){
  if(realtimeChat){realtimeChat.unsubscribe();realtimeChat=null;}
  currentConvId=null;
  document.getElementById('adContext').style.display='none';
  document.getElementById('toolBar').classList.remove('open');
  document.getElementById('viewChat').style.display='none';
  document.getElementById('viewList').style.display='flex';
  loadConversations();updateNavBadge();
}
function contactWA(){var n=(currentOther.wa||'').replace(/\D/g,'');if(n)window.open('https://wa.me/'+n,'_blank');}
function toggleToolBar(){document.getElementById('toolBar').classList.toggle('open');}
function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,120)+'px';}
function scrollBottom(){var z=document.getElementById('msgsZone');if(z)setTimeout(function(){z.scrollTop=z.scrollHeight;},50);}
function timeAgo(ts){var s=Math.floor((Date.now()-new Date(ts))/1000);if(s<60)return 'à l\'instant';if(s<3600)return Math.floor(s/60)+'min';if(s<86400)return Math.floor(s/3600)+'h';return Math.floor(s/86400)+'j';}
function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
var _tt=null;
function showToast(msg,type){
  var el=document.getElementById('toast');if(!el)return;
  el.textContent=msg;el.className='show'+(type?' '+type:'');
  clearTimeout(_tt);_tt=setTimeout(function(){el.className='';},3800);
}
</script>
