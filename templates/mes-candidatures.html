<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>AfriMarket — Mes Candidatures</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{--dark:#080E2A;--blue:#1B3FE4;--blue2:#2D55FF;--turq:#00C2B7;
      --green:#00C271;--gold:#F5B731;--red:#E83030;--gray:#8892A4;
      --border:#E8EDF5;--bg:#F4F6FC;--nav-h:72px;}
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);
      padding-bottom:calc(var(--nav-h)+24px+env(safe-area-inset-bottom,0px));overflow-x:hidden;}

    .hdr{position:sticky;top:0;z-index:100;background:white;border-bottom:1px solid var(--border);
      height:60px;padding:0 1.2rem;display:flex;align-items:center;gap:.7rem;}
    .h-back{background:none;border:none;color:var(--gray);font-size:1.1rem;cursor:pointer;padding:.3rem;}
    .h-title{font-family:'Clash Display',sans-serif;font-size:1rem;font-weight:700;color:var(--dark);flex:1;}
    .h-wallet{display:flex;flex-direction:column;align-items:flex-end;}
    .h-wallet-lbl{font-size:.55rem;color:var(--gray);font-weight:600;text-transform:uppercase;}
    .h-wallet-val{font-family:'Clash Display',sans-serif;font-size:.9rem;font-weight:700;color:var(--green);}

    /* STATS */
    .stats-row{display:flex;gap:.6rem;padding:.9rem 1.2rem .5rem;}
    .stat-box{flex:1;background:white;border-radius:14px;border:1.5px solid var(--border);
      padding:.7rem .8rem;text-align:center;box-shadow:0 2px 6px rgba(27,63,228,.04);}
    .sb-val{font-family:'Clash Display',sans-serif;font-size:1.2rem;font-weight:700;color:var(--dark);}
    .sb-lbl{font-size:.58rem;color:var(--gray);font-weight:600;text-transform:uppercase;letter-spacing:.3px;margin-top:.1rem;}

    /* TABS */
    .tabs{background:white;border-bottom:1px solid var(--border);display:flex;padding:0 1.2rem;}
    .tab{flex:1;padding:.65rem .3rem;font-size:.74rem;font-weight:700;color:var(--gray);
      text-align:center;cursor:pointer;border-bottom:2.5px solid transparent;transition:all .2s;}
    .tab.active{color:var(--blue2);border-bottom-color:var(--blue2);}

    /* AGENT CARD */
    .agent-section{padding:.8rem 1.2rem 0;}
    .agent-card{background:white;border-radius:16px;border:1.5px solid var(--border);
      padding:1rem 1.1rem;margin-bottom:.7rem;box-shadow:0 2px 8px rgba(27,63,228,.05);}
    .ac-top{display:flex;align-items:center;gap:.8rem;margin-bottom:.7rem;}
    .ac-ico{width:44px;height:44px;border-radius:13px;display:flex;align-items:center;
      justify-content:center;font-size:1.2rem;flex-shrink:0;}
    .ac-name{font-family:'Clash Display',sans-serif;font-size:.95rem;font-weight:700;color:var(--dark);}
    .ac-code{font-size:.68rem;color:var(--blue2);font-weight:700;letter-spacing:1px;font-family:'Clash Display',sans-serif;}
    .code-copy{background:rgba(27,63,228,.08);border:none;border-radius:6px;
      padding:.15rem .5rem;font-size:.6rem;color:var(--blue2);cursor:pointer;font-weight:700;
      font-family:'Plus Jakarta Sans',sans-serif;margin-left:.3rem;}

    /* STATUS badges */
    .badge{font-size:.62rem;font-weight:800;padding:.2rem .6rem;border-radius:99px;letter-spacing:.3px;}
    .badge.active{background:rgba(0,194,113,.1);color:#007A46;}
    .badge.formation{background:rgba(245,183,49,.12);color:#8A5A00;}
    .badge.pending{background:rgba(27,63,228,.08);color:var(--blue2);}
    .badge.rejected{background:rgba(232,48,48,.1);color:var(--red);}

    /* WORK BUTTON */
    .work-section{border-top:1px solid var(--border);padding-top:.7rem;}
    .work-btn{width:100%;padding:.72rem;background:linear-gradient(135deg,var(--blue),var(--blue2));
      border:none;border-radius:12px;color:white;font-size:.82rem;font-weight:700;
      cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;display:flex;
      align-items:center;justify-content:center;gap:.4rem;}
    .work-btn.gold{background:linear-gradient(135deg,var(--gold),#FFB700);color:var(--dark);}
    .work-btn.gray{background:#f0f0f0;color:var(--gray);cursor:default;}

    /* SUBMISSIONS LIST */
    .sub-card{background:white;border-radius:14px;border:1.5px solid var(--border);
      padding:.9rem 1rem;margin-bottom:.6rem;box-shadow:0 2px 6px rgba(27,63,228,.04);}
    .sub-top{display:flex;align-items:flex-start;justify-content:space-between;gap:.5rem;margin-bottom:.45rem;}
    .sub-title{font-size:.84rem;font-weight:700;color:var(--dark);}
    .sub-svc{font-size:.65rem;font-weight:700;padding:.15rem .5rem;border-radius:99px;
      background:rgba(27,63,228,.07);color:var(--blue2);}
    .sub-meta{font-size:.72rem;color:var(--gray);margin-bottom:.4rem;display:flex;flex-wrap:wrap;gap:.4rem;}
    .sub-desc{font-size:.76rem;color:#555;background:#F8F9FF;border-radius:8px;
      padding:.5rem .7rem;line-height:1.5;border:1px solid var(--border);margin-bottom:.45rem;}
    .sub-gain{font-family:'Clash Display',sans-serif;font-size:.9rem;font-weight:700;color:var(--green);}
    .sub-note{font-size:.72rem;color:var(--gray);background:#f5f5f5;border-radius:8px;padding:.4rem .6rem;margin-top:.4rem;}

    /* MODAL SOUMETTRE TRAVAIL */
    .modal-ov{display:none;position:fixed;inset:0;background:rgba(8,14,42,.6);
      z-index:500;align-items:flex-end;backdrop-filter:blur(4px);}
    .modal-ov.open{display:flex;}
    .modal-sheet{background:white;border-radius:24px 24px 0 0;width:100%;
      max-height:92vh;overflow-y:auto;padding:1.4rem 1.2rem 2.5rem;
      animation:slideUp .3s ease;}
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-handle{width:36px;height:4px;border-radius:99px;background:var(--border);
      margin:0 auto 1rem;}
    .modal-title{font-family:'Clash Display',sans-serif;font-size:1.1rem;font-weight:700;
      color:var(--dark);margin-bottom:.2rem;}
    .modal-sub{font-size:.75rem;color:var(--gray);margin-bottom:1.2rem;line-height:1.5;}
    .f-lbl{font-size:.73rem;font-weight:700;color:var(--dark);margin-bottom:.35rem;display:block;margin-top:.7rem;}
    .f-inp{width:100%;background:#F8F9FF;border:1.5px solid var(--border);border-radius:12px;
      padding:.7rem .9rem;color:var(--dark);font-family:'Plus Jakarta Sans',sans-serif;
      font-size:.84rem;outline:none;transition:border-color .2s;resize:none;}
    .f-inp:focus{border-color:var(--blue2);background:white;}
    .f-inp::placeholder{color:var(--gray);}
    .f-btn{width:100%;padding:.88rem;background:linear-gradient(135deg,var(--blue),var(--blue2));
      border:none;border-radius:14px;color:white;font-family:'Clash Display',sans-serif;
      font-size:.95rem;font-weight:700;cursor:pointer;margin-top:.8rem;
      box-shadow:0 4px 14px rgba(27,63,228,.3);}
    .f-btn:disabled{opacity:.5;cursor:not-allowed;}
    .mission-opts{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.3rem;}
    .mission-opt{background:#F8F9FF;border:1.5px solid var(--border);border-radius:12px;
      padding:.65rem .9rem;font-size:.82rem;font-weight:600;color:var(--dark);
      cursor:pointer;transition:all .2s;}
    .mission-opt.selected{border-color:var(--blue2);background:#EEF2FF;color:var(--blue2);}
    .mission-opt:hover{border-color:var(--blue2);}

    /* EMPTY */
    .empty{background:white;border-radius:16px;border:1.5px dashed var(--border);
      padding:2rem 1.2rem;text-align:center;margin:0 1.2rem;}
    .empty-ico{font-size:2.2rem;margin-bottom:.6rem;}
    .empty-title{font-family:'Clash Display',sans-serif;font-size:.95rem;font-weight:700;
      color:var(--dark);margin-bottom:.3rem;}
    .empty-desc{font-size:.76rem;color:var(--gray);line-height:1.5;margin-bottom:.9rem;}
    .empty-btn{background:linear-gradient(135deg,var(--blue),var(--blue2));color:white;
      border:none;border-radius:12px;padding:.6rem 1.2rem;font-size:.8rem;
      font-weight:700;cursor:pointer;font-family:'Plus Jakarta Sans',sans-serif;}

    .bottom-nav{position:fixed;bottom:0;left:0;right:0;background:white;
      border-top:1px solid var(--border);display:flex;align-items:center;
      justify-content:space-around;padding:0 .5rem;
      padding-bottom:env(safe-area-inset-bottom,0px);
      height:calc(var(--nav-h)+env(safe-area-inset-bottom,0px));
      box-shadow:0 -4px 20px rgba(8,14,42,.08);z-index:99;}
    .nav-item{display:flex;flex-direction:column;align-items:center;gap:.18rem;
      padding:.4rem .6rem;border:none;background:none;cursor:pointer;border-radius:12px;min-width:52px;}
    .nav-ico{font-size:1.25rem;line-height:1;}
    .nav-lbl{font-size:.58rem;font-weight:600;color:var(--gray);}
    .nav-plus-btn{width:44px;height:44px;border-radius:50%;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white;font-size:1.4rem;display:flex;align-items:center;justify-content:center;
      border:none;cursor:pointer;box-shadow:0 4px 14px rgba(27,63,228,.4);}
    #toast{position:fixed;bottom:calc(var(--nav-h)+12px+env(safe-area-inset-bottom,0px));
      left:50%;transform:translateX(-50%) translateY(20px);background:var(--dark);color:white;
      padding:.65rem 1.1rem;border-radius:14px;font-size:.8rem;font-weight:600;
      opacity:0;transition:all .35s;pointer-events:none;z-index:600;
      border-left:3px solid var(--turq);max-width:88vw;text-align:center;}
    #toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
    .spin{width:28px;height:28px;border:3px solid var(--border);border-top-color:var(--blue2);
      border-radius:50%;animation:spin .7s linear infinite;margin:0 auto .6rem;}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<div class="hdr">
  <button class="h-back" onclick="location.href='gagner.html'">←</button>
  <div class="h-title">Mes Candidatures</div>
  <div class="h-wallet">
    <div class="h-wallet-lbl">Portefeuille</div>
    <div class="h-wallet-val" id="walletBal">—</div>
  </div>
</div>

<!-- STATS -->
<div class="stats-row">
  <div class="stat-box"><div class="sb-val" id="statActifs">—</div><div class="sb-lbl">Actifs</div></div>
  <div class="stat-box"><div class="sb-val" id="statSoumis">—</div><div class="sb-lbl">Soumissions</div></div>
  <div class="stat-box"><div class="sb-val" id="statGains">—</div><div class="sb-lbl">FCFA gagnés</div></div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" id="tab-agents" onclick="switchTab('agents',this)">💼 Mes Rôles</div>
  <div class="tab" id="tab-travaux" onclick="switchTab('travaux',this)">📝 Mes Soumissions</div>
</div>

<!-- CONTENT -->
<div id="mainContent" style="padding-top:.3rem;">
  <div style="text-align:center;padding:2rem;color:var(--gray);">
    <div class="spin"></div>Chargement…
  </div>
</div>

<!-- MODAL SOUMETTRE TRAVAIL -->
<div class="modal-ov" id="workModal" onclick="if(event.target===this)closeModal()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">📝 Soumettre mon travail</div>
    <div class="modal-sub" id="modalSub">Décris précisément ce que tu as accompli et joins une preuve.</div>

    <label class="f-lbl">Type de travail effectué *</label>
    <div class="mission-opts" id="missionOpts"></div>

    <label class="f-lbl" id="quantityLabel">Quantité (nombre) *</label>
    <input class="f-inp" type="number" id="wQuantity" min="1" value="1" placeholder="Ex: 3 vendeurs recrutés"/>

    <label class="f-lbl">Description détaillée de ce que tu as fait *</label>
    <textarea class="f-inp" id="wDesc" rows="4"
      placeholder="Sois précis : noms, lieux, dates, ce qui s'est passé exactement…"></textarea>

    <label class="f-lbl">Lien vers ta preuve (photo, WhatsApp, Drive…) *</label>
    <input class="f-inp" type="url" id="wProof" placeholder="https://…"/>
    <div style="font-size:.68rem;color:var(--gray);margin-top:.2rem;">
      📸 Prends une photo, uploade sur WhatsApp ou Google Drive, copie le lien ici.
    </div>

    <label class="f-lbl">Détails supplémentaires (optionnel)</label>
    <textarea class="f-inp" id="wDetails" rows="2"
      placeholder="Ex: Noms des vendeurs, numéros WhatsApp, adresses…"></textarea>

    <button class="f-btn" id="submitWorkBtn" onclick="submitWork()">✅ Soumettre pour validation</button>
  </div>
</div>

<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='dashboard.html'"><span class="nav-ico">🏠</span><span class="nav-lbl">Accueil</span></button>
  <button class="nav-item" onclick="location.href='messages.html'"><span class="nav-ico">💬</span><span class="nav-lbl">Messages</span></button>
  <div class="nav-item"><button class="nav-plus-btn" onclick="location.href='dashboard.html'">➕</button><span class="nav-lbl" style="color:var(--blue2);font-weight:700">Publier</span></div>
  <button class="nav-item active"><span class="nav-ico">💰</span><span class="nav-lbl" style="color:var(--blue2);font-weight:700">Gagner</span></button>
  <button class="nav-item" onclick="location.href='profil.html'"><span class="nav-ico">👤</span><span class="nav-lbl">Profil</span></button>
</nav>
<div id="toast"></div>

<script>
const _sb = supabase.createClient(
  'https://elgbvitijyjriozvzqpf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
);

var U=null, _regs=[], _subs=[], _wallet=0, _currentTab='agents';
var _currentReg=null, _selectedMission=null;

const SVC_INFO = {
  'gagner-chasseur':    {label:'Chasseur de Vendeurs',ico:'🎯',color:'#E8960A',
    missions:[
      {title:'Vendeurs recrutés',quantityLabel:'Nombre de vendeurs (chacun a publié 1 annonce)',earnPer:500,unit:'vendeur'},
    ],
    proofTip:'📸 Capture d\'écran du profil vendeur + son annonce publiée sur AfriMarket.'},
  'gagner-livreur':     {label:'Livreur Indépendant',ico:'📦',color:'#009958',
    missions:[
      {title:'Livraison effectuée',quantityLabel:'Nombre de colis livrés',earnPer:800,unit:'livraison'},
    ],
    proofTip:'📸 Photo du colis remis à l\'acheteur + confirmation WhatsApp de l\'acheteur.'},
  'gagner-verificateur':{label:'Vérificateur Certifié',ico:'🕵️',color:'#00A8A0',
    missions:[
      {title:'Vérification produit effectuée',quantityLabel:'Nombre de produits vérifiés',earnPer:700,unit:'vérification'},
    ],
    proofTip:'📸 Photos détaillées du produit inspecté + rapport de vérification.'},
  'gagner-negociateur': {label:'Négociateur Pro',ico:'🗣️',color:'#D4561A',
    missions:[
      {title:'Négociation réussie',quantityLabel:'Montant économisé pour l\'acheteur (FCFA)',earnPer:null,unit:'FCFA économisés'},
      {title:'Tentative de négociation (vendeur refus)',quantityLabel:'Nombre de tentatives',earnPer:200,unit:'tentative'},
    ],
    proofTip:'📸 Capture de la conversation avec le vendeur + prix initial vs prix final obtenu.'},
  'gagner-formateur':   {label:'Formateur Certifié',ico:'🎓',color:'#1B3FE4',
    missions:[
      {title:'Session de formation animée',quantityLabel:'Nombre de participants ayant créé leur compte',earnPer:2000,unit:'participant'},
    ],
    proofTip:'📸 Photo de groupe + captures des nouveaux comptes créés + liste participants avec numéros WhatsApp.'},
  'gagner-courtier':    {label:'Courtier Import-Export',ico:'🌍',color:'#8B2FD4',
    missions:[
      {title:'Transaction inter-pays facilitée',quantityLabel:'Montant total de la transaction (FCFA)',earnPer:null,unit:'FCFA (2-3% de commission)'},
    ],
    proofTip:'📸 Preuve de la transaction AfriMarket entre les 2 pays (numéro de transaction).'},
};

// INIT
(async function(){
  var sess = await _sb.auth.getSession();
  if(!sess.data.session){ location.href='index.html'; return; }
  U = sess.data.session.user;
  await loadAll();
})();

async function loadAll(){
  try{
    var [regsR, subsR, walR] = await Promise.all([
      _sb.from('service_registrations').select('*').eq('user_id',U.id).order('created_at',{ascending:false}),
      _sb.from('work_submissions').select('*').eq('user_id',U.id).order('created_at',{ascending:false}),
      _sb.from('user_wallets').select('balance').eq('user_id',U.id).maybeSingle()
    ]);
    _regs = regsR.data||[];
    _subs = subsR.data||[];
    _wallet = walR.data?.balance||0;
  } catch(e){ _regs=[]; _subs=[]; }

  updateStats();
  renderTab();
}

function updateStats(){
  var actifs = _regs.filter(r=>r.status==='approved'&&r.formation_done).length;
  var gains  = _subs.filter(s=>s.status==='validated').reduce((a,s)=>a+(s.actual_gain||0),0);
  document.getElementById('statActifs').textContent = actifs;
  document.getElementById('statSoumis').textContent = _subs.length;
  document.getElementById('statGains').textContent  = gains > 0 ? gains.toLocaleString('fr-FR') : '0';
  document.getElementById('walletBal').textContent  = _wallet.toLocaleString('fr-FR') + ' F';
}

function switchTab(tab, el){
  _currentTab = tab;
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');
  renderTab();
}

function renderTab(){
  if(_currentTab==='agents') renderAgents();
  else renderSubs();
}

function renderAgents(){
  if(!_regs.length){
    document.getElementById('mainContent').innerHTML =
      '<div class="empty"><div class="empty-ico">💼</div>' +
      '<div class="empty-title">Aucune candidature</div>' +
      '<div class="empty-desc">Postule à une activité pour commencer à gagner de l\'argent.</div>' +
      '<button class="empty-btn" onclick="location.href=\'gagner.html\'">Voir les opportunités →</button></div>';
    return;
  }

  var html = '<div class="agent-section">';
  _regs.forEach(function(r){
    var info = SVC_INFO[r.service]||{label:r.service,ico:'💼',color:'#888'};
    var badgeHtml = '';
    var workHtml = '';

    if(r.status==='pending'){
      badgeHtml = '<span class="badge pending">⏳ En attente</span>';
      workHtml = '<div class="work-section"><button class="work-btn gray" disabled>⏳ En attente d\'approbation</button></div>';
    } else if(r.status==='rejected'){
      badgeHtml = '<span class="badge rejected">❌ Non retenu</span>';
      workHtml = '<div class="work-section"><button class="work-btn" style="background:#f0f0f0;color:var(--gray);" onclick="location.href=\''+r.service+'.html\'">↩ Recandidater</button></div>';
    } else if(r.status==='approved' && r.needs_formation && !r.formation_done){
      badgeHtml = '<span class="badge formation">📚 Formation requise</span>';
      workHtml = '<div class="work-section">' +
        '<div style="font-size:.72rem;color:var(--gray);margin-bottom:.5rem;line-height:1.5;">Tu dois d\'abord compléter la formation et obtenir ton certificat avant de commencer à travailler.</div>' +
        '<button class="work-btn gold" onclick="location.href=\'formation.html?service='+r.service+'\'">📚 Commencer la formation →</button>' +
        '</div>';
    } else if(r.status==='approved'){
      badgeHtml = '<span class="badge active">✅ Actif</span>';
      // Soumissions récentes
      var recSubs = _subs.filter(s=>s.registration_id===r.id||s.service===r.service).slice(0,2);
      var recHtml = '';
      if(recSubs.length){
        recHtml = '<div style="margin:.5rem 0;border-top:1px solid var(--border);padding-top:.6rem;">';
        recSubs.forEach(function(s){
          var statusIcon = s.status==='validated'?'✅ Validé':s.status==='rejected'?'❌ Rejeté':'⏳ En attente';
          var gainHtml   = s.status==='validated'?'<span style="font-family:\'Clash Display\',sans-serif;font-size:.85rem;font-weight:700;color:var(--green);">+'+s.actual_gain.toLocaleString('fr-FR')+' F</span>':'';
          recHtml += '<div style="display:flex;justify-content:space-between;align-items:center;padding:.3rem 0;font-size:.73rem;">' +
            '<span style="color:var(--dark);font-weight:600;">'+s.mission_title+'</span>' +
            '<div style="display:flex;align-items:center;gap:.4rem;"><span style="color:var(--gray);">'+statusIcon+'</span>'+gainHtml+'</div>' +
            '</div>';
        });
        recHtml += '</div>';
      }
      workHtml = '<div class="work-section">' +
        recHtml +
        '<button class="work-btn" onclick="openWorkModal(\''+r.id+'\',\''+r.service+'\')">📝 Soumettre du travail →</button>' +
        '</div>';
    }

    var codeHtml = r.agent_code
      ? '<div class="ac-code">' + r.agent_code + '<button class="code-copy" onclick="copyCode(\''+r.agent_code+'\',event)">Copier</button></div>'
      : '';

    html += '<div class="agent-card">' +
      '<div class="ac-top">' +
        '<div class="ac-ico" style="background:'+info.color+'18;border:1.5px solid '+info.color+'30;">'+info.ico+'</div>' +
        '<div style="flex:1;">' +
          '<div class="ac-name">'+info.label+'</div>' +
          codeHtml +
        '</div>' +
        badgeHtml +
      '</div>' +
      workHtml +
    '</div>';
  });
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

function renderSubs(){
  if(!_subs.length){
    document.getElementById('mainContent').innerHTML =
      '<div class="empty" style="margin-top:.8rem;"><div class="empty-ico">📝</div>' +
      '<div class="empty-title">Aucune soumission</div>' +
      '<div class="empty-desc">Soumets ton travail depuis l\'onglet "Mes Rôles".</div></div>';
    return;
  }
  var html = '<div style="padding:.8rem 1.2rem 0;">';
  _subs.forEach(function(s){
    var info = SVC_INFO[s.service]||{label:s.service,ico:'💼',color:'#888'};
    var statusBadge = {
      pending  :'<span class="badge" style="background:rgba(245,183,49,.12);color:#8A5A00;">⏳ En attente de validation</span>',
      validated:'<span class="badge active">✅ Validé</span>',
      rejected :'<span class="badge rejected">❌ Rejeté</span>'
    }[s.status]||'';
    var gainHtml = s.status==='validated'
      ? '<div class="sub-gain">+' + (s.actual_gain||0).toLocaleString('fr-FR') + ' FCFA</div>'
      : s.status==='rejected' ? '<div style="font-size:.75rem;color:var(--red);">Non payé</div>'
      : '<div style="font-size:.75rem;color:var(--gray);">En attente · ~'+s.expected_gain+' FCFA estimé</div>';
    var noteHtml = s.admin_note ? '<div class="sub-note">💬 Admin : '+s.admin_note+'</div>' : '';
    var dt = s.created_at ? new Date(s.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) : '';
    html += '<div class="sub-card">' +
      '<div class="sub-top"><div>' +
        '<div class="sub-title">'+s.mission_title+'</div>' +
        '<span class="sub-svc">'+info.ico+' '+info.label+'</span>' +
      '</div>' + statusBadge + '</div>' +
      '<div class="sub-meta"><span>🕐 '+dt+'</span>' + (s.quantity>1?'<span>📊 Quantité : '+s.quantity+'</span>':'') + '</div>' +
      '<div class="sub-desc">'+s.description+'</div>' +
      gainHtml + noteHtml +
    '</div>';
  });
  html += '</div>';
  document.getElementById('mainContent').innerHTML = html;
}

// MODAL TRAVAIL
function openWorkModal(regId, service){
  _currentReg = {id:regId, service:service};
  _selectedMission = null;
  var info = SVC_INFO[service]||{label:service,ico:'💼'};
  document.getElementById('modalTitle').textContent = '📝 Soumettre — ' + info.label;
  document.getElementById('modalSub').textContent = 'Décris précisément ce que tu as accompli. Sois honnête : chaque soumission est vérifiée.';

  // Mission types
  var mOpts = '';
  (info.missions||[{title:'Travail effectué',quantityLabel:'Quantité',earnPer:null,unit:'unité'}]).forEach(function(m,i){
    var earnStr = m.earnPer ? '→ '+m.earnPer+' FCFA/'+m.unit : '→ Commission calculée';
    mOpts += '<div class="mission-opt" id="mopt-'+i+'" onclick="selectMission('+i+')">' + m.title + ' <span style="color:var(--blue2);font-size:.72rem;">'+earnStr+'</span></div>';
  });
  document.getElementById('missionOpts').innerHTML = mOpts;

  // Proof tip
  if(info.proofTip){
    var existing = document.getElementById('proofTip');
    if(!existing){
      var tip = document.createElement('div');
      tip.id='proofTip';
      tip.style='font-size:.7rem;color:var(--gray);margin-top:.2rem;line-height:1.5;background:#F8F9FF;border-radius:8px;padding:.4rem .6rem;';
      var proofEl = document.getElementById('wProof');
      proofEl.parentNode.insertBefore(tip, proofEl.nextSibling);
    }
    document.getElementById('proofTip').textContent = info.proofTip;
  }

  // Reset form
  document.getElementById('wQuantity').value=1;
  document.getElementById('wDesc').value='';
  document.getElementById('wProof').value='';
  document.getElementById('wDetails').value='';
  document.getElementById('submitWorkBtn').disabled=false;
  document.getElementById('submitWorkBtn').textContent='✅ Soumettre pour validation';

  if((info.missions||[]).length===1){ selectMission(0); }

  document.getElementById('workModal').classList.add('open');
}

function selectMission(i){
  _selectedMission = i;
  document.querySelectorAll('.mission-opt').forEach(function(o,j){
    o.classList.toggle('selected', j===i);
  });
  var info = SVC_INFO[_currentReg.service]||{};
  var m = (info.missions||[])[i]||{};
  document.getElementById('quantityLabel').textContent = (m.quantityLabel||'Quantité') + ' *';
}

function closeModal(){
  document.getElementById('workModal').classList.remove('open');
  _currentReg=null; _selectedMission=null;
}

async function submitWork(){
  if(_selectedMission===null){ toast('Sélectionne le type de travail','warn'); return; }
  var desc    = document.getElementById('wDesc').value.trim();
  var proof   = document.getElementById('wProof').value.trim();
  var qty     = parseInt(document.getElementById('wQuantity').value)||1;
  var details = document.getElementById('wDetails').value.trim();
  if(!desc)  { toast('Décris ton travail en détail','warn'); return; }
  if(!proof) { toast('Le lien de preuve est obligatoire','warn'); return; }

  var info = SVC_INFO[_currentReg.service]||{};
  var m = (info.missions||[])[_selectedMission]||{title:'Travail',earnPer:null};
  var reg = _regs.find(r=>r.id===_currentReg.id);
  var expectedGain = m.earnPer ? m.earnPer * qty : null;

  var btn = document.getElementById('submitWorkBtn');
  btn.disabled=true; btn.textContent='⏳ Envoi en cours…';

  try{
    var {error} = await _sb.from('work_submissions').insert({
      user_id        : U.id,
      registration_id: _currentReg.id,
      service        : _currentReg.service,
      agent_code     : reg?.agent_code||null,
      mission_title  : m.title,
      description    : desc,
      proof_link     : proof,
      proof_details  : details||null,
      quantity       : qty,
      expected_gain  : expectedGain,
      status         : 'pending'
    });
    if(error) throw error;
    toast('✅ Soumission envoyée ! Validation sous 48h.','ok');
    closeModal();
    await loadAll();
  } catch(e){
    btn.disabled=false; btn.textContent='✅ Soumettre pour validation';
    toast('Erreur : '+e.message,'err');
  }
}

function copyCode(code, e){
  e.stopPropagation();
  navigator.clipboard.writeText(code).then(function(){
    toast('✅ Code copié : '+code,'ok');
  });
}

var _tt;
function toast(msg,t){
  var el=document.getElementById('toast');
  el.textContent=msg;el.className='show';
  el.style.borderLeftColor=t==='err'?'var(--red)':t==='warn'?'var(--gold)':'var(--turq)';
  clearTimeout(_tt);_tt=setTimeout(function(){el.className='';},4500);
}
</script>
