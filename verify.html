<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Vérification — AfriMarket</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{
  --blue:#1B3FE4; --blue2:#2D55FF; --turq:#00C2B7;
  --dark:#060D24; --card:#0C1535; --input:#111E3E;
  --red:#E83030; --orange:#FF6B1A; --muted:#8892A8;
  --border:rgba(255,255,255,.08); --white:#fff;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100%;font-family:'DM Sans',sans-serif;background:var(--dark);color:var(--white);}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;min-height:100vh;position:relative;overflow:hidden;}

/* Orbes de fond */
body::before{content:'';position:absolute;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(0,194,183,.12) 0%,transparent 70%);top:-80px;right:-80px;pointer-events:none;}
body::after{content:'';position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,rgba(27,63,228,.1) 0%,transparent 70%);bottom:-60px;left:-60px;pointer-events:none;}

/* CARD */
.verify-card{
  width:100%;max-width:380px;
  background:var(--card);
  border-radius:28px;
  padding:2rem 1.5rem;
  border:1px solid var(--border);
  box-shadow:0 20px 60px rgba(0,0,0,.4);
  position:relative;z-index:1;
  text-align:center;
}

/* LOGO */
.logo{display:flex;align-items:center;gap:.6rem;justify-content:center;margin-bottom:1.8rem;}
.logo-ico{width:44px;height:44px;background:linear-gradient(135deg,var(--turq),var(--blue));border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:1.4rem;}
.logo-name{font-family:'Syne',sans-serif;font-size:1.25rem;font-weight:800;}

/* ICON EMAIL */
.email-ico-wrap{
  width:72px;height:72px;border-radius:50%;
  background:linear-gradient(135deg,rgba(0,194,183,.15),rgba(27,63,228,.15));
  border:2px solid rgba(0,194,183,.3);
  display:flex;align-items:center;justify-content:center;
  font-size:2rem;margin:0 auto 1.2rem;
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}

.verify-title{font-family:'Syne',sans-serif;font-size:1.5rem;font-weight:800;margin-bottom:.4rem;}
.verify-sub{font-size:.83rem;color:var(--muted);line-height:1.65;margin-bottom:.4rem;}
.verify-email{color:var(--turq);font-weight:700;font-size:.88rem;margin-bottom:1.8rem;word-break:break-all;}

/* OTP INPUT */
.otp-row{display:flex;gap:.5rem;justify-content:center;margin-bottom:1.2rem;}
.otp-cell{
  width:46px;height:56px;
  background:var(--input);
  border:2px solid rgba(255,255,255,.07);
  border-radius:14px;
  font-family:'Syne',sans-serif;
  font-size:1.5rem;font-weight:800;
  color:var(--white);
  text-align:center;
  outline:none;
  transition:border-color .2s,box-shadow .2s;
  caret-color:var(--turq);
}
.otp-cell:focus{border-color:var(--turq);box-shadow:0 0 0 3px rgba(0,194,183,.15);}
.otp-cell.filled{border-color:rgba(0,194,183,.4);background:#0d1e3a;}
.otp-cell.error{border-color:var(--red);box-shadow:0 0 0 3px rgba(232,48,48,.12);animation:shake .35s ease;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}

/* TIMER */
.timer-row{font-size:.78rem;color:var(--muted);margin-bottom:1.4rem;}
.timer-val{color:var(--turq);font-weight:700;}
.resend-btn{background:none;border:none;color:var(--turq);font-size:.78rem;font-weight:700;cursor:pointer;text-decoration:underline;display:none;}
.resend-btn.visible{display:inline;}

/* BOUTON PRINCIPAL */
.btn-verify{
  width:100%;padding:.88rem;
  border-radius:14px;
  background:linear-gradient(135deg,var(--turq),var(--blue2));
  color:white;font-family:'DM Sans',sans-serif;
  font-size:.97rem;font-weight:700;
  border:none;cursor:pointer;
  box-shadow:0 6px 24px rgba(0,194,183,.3);
  transition:transform .18s,box-shadow .18s,opacity .18s;
  margin-bottom:1rem;
  position:relative;overflow:hidden;
  display:flex;align-items:center;justify-content:center;gap:.5rem;
}
.btn-verify:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 10px 30px rgba(0,194,183,.4);}
.btn-verify:disabled{opacity:.5;cursor:not-allowed;transform:none;}
.btn-verify.loading::after{
  content:'';position:absolute;inset:0;
  background:linear-gradient(90deg,transparent 25%,rgba(255,255,255,.15) 50%,transparent 75%);
  background-size:200% 100%;animation:shimmer 1.2s infinite;
}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

.btn-back{
  width:100%;padding:.7rem;
  border-radius:12px;background:transparent;
  border:1.5px solid var(--border);
  color:var(--muted);font-size:.82rem;font-weight:600;
  cursor:pointer;transition:all .2s;
}
.btn-back:hover{border-color:rgba(255,255,255,.2);color:white;}

/* SUCCÈS */
.success-state{display:none;}
.success-state.show{display:block;}
.initial-state.hide{display:none;}

.success-ico{font-size:3.5rem;margin-bottom:.8rem;animation:popIn .5s cubic-bezier(.34,1.56,.64,1);}
@keyframes popIn{from{transform:scale(0);}to{transform:scale(1);}}
.success-title{font-family:'Syne',sans-serif;font-size:1.3rem;font-weight:800;margin-bottom:.5rem;}
.success-sub{font-size:.82rem;color:var(--muted);line-height:1.7;margin-bottom:1.5rem;}

/* ERREUR */
.err-msg{
  font-size:.75rem;color:var(--red);
  background:rgba(232,48,48,.1);
  border:1px solid rgba(232,48,48,.2);
  border-radius:10px;padding:.6rem .9rem;
  margin-bottom:1rem;display:none;
}
.err-msg.show{display:block;}

/* TOAST */
#toast{
  position:fixed;bottom:2rem;left:50%;
  transform:translateX(-50%) translateY(14px);
  background:var(--card);border:1px solid var(--border);
  color:white;padding:.65rem 1.2rem;border-radius:12px;
  font-size:.82rem;font-weight:600;
  display:flex;align-items:center;gap:.4rem;
  opacity:0;pointer-events:none;
  transition:all .3s cubic-bezier(.34,1.56,.64,1);
  z-index:999;white-space:nowrap;max-width:90vw;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.success{border-color:rgba(0,194,183,.4);}
#toast.error{border-color:rgba(232,48,48,.4);}
</style>
</head>
<body>

<div class="verify-card">
  <div class="logo">
    <div class="logo-ico">🏪</div>
    <div class="logo-name">AfriMarket</div>
  </div>

  <!-- ── ÉTAT INITIAL ── -->
  <div class="initial-state" id="initialState">
    <div class="email-ico-wrap">📧</div>
    <div class="verify-title">Vérifie ton email</div>
    <div class="verify-sub">On a envoyé un code de confirmation à</div>
    <div class="verify-email" id="verifyEmailDisplay">—</div>

    <!-- Champs OTP 6 chiffres -->
    <div class="otp-row" id="otpRow">
      <input class="otp-cell" id="otp0" maxlength="1" inputmode="numeric" pattern="[0-9]" autocomplete="one-time-code"/>
      <input class="otp-cell" id="otp1" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
      <input class="otp-cell" id="otp2" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
      <input class="otp-cell" id="otp3" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
      <input class="otp-cell" id="otp4" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
      <input class="otp-cell" id="otp5" maxlength="1" inputmode="numeric" pattern="[0-9]"/>
    </div>

    <!-- Message erreur -->
    <div class="err-msg" id="errMsg">Code incorrect ou expiré. Vérifie ton email.</div>

    <!-- Timer -->
    <div class="timer-row">
      Code valide pendant <span class="timer-val" id="timerVal">60:00</span>
      &nbsp;·&nbsp;
      <button class="resend-btn" id="resendBtn" onclick="resendCode()">Renvoyer</button>
    </div>

    <button class="btn-verify" id="btnVerify" onclick="verifyCode()" disabled>
      ✅ Confirmer mon compte
    </button>
    <button class="btn-back" onclick="location.href='auth.html'">← Retour à l'inscription</button>
  </div>

  <!-- ── ÉTAT SUCCÈS ── -->
  <div class="success-state" id="successState">
    <div class="success-ico">🎉</div>
    <div class="success-title">Compte activé !</div>
    <div class="success-sub">
      Bienvenue sur AfriMarket !<br/>
      Ton compte est maintenant actif. Tu vas être redirigé vers ton tableau de bord.
    </div>
    <button class="btn-verify" onclick="location.href='dashboard.html'" style="animation:none;">
      🚀 Aller sur mon tableau de bord
    </button>
  </div>
</div>

<div id="toast"><span id="tIco"></span><span id="tMsg"></span></div>

<script>
'use strict';
const{createClient}=supabase;
const sb=createClient(
  'https://elgbvitijyjriozvzqpf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
);

// ── ÉTAT ────────────────────────────────────────────────────
var VERIFY_EMAIL = '';
var TIMER_INTERVAL = null;
var SECONDS_LEFT = 3600; // 1 heure

// ── INIT ─────────────────────────────────────────────────────
(async function(){
  // Récupérer l'email depuis localStorage (mis par auth.html après inscription)
  VERIFY_EMAIL = localStorage.getItem('am_verify_email') || '';
  if(!VERIFY_EMAIL){
    // Chercher dans les params URL ?email=...
    var urlEmail = new URLSearchParams(window.location.search).get('email');
    if(urlEmail) VERIFY_EMAIL = decodeURIComponent(urlEmail);
  }
  if(!VERIFY_EMAIL){
    // Pas d'email → retour inscription
    location.href = 'auth.html';
    return;
  }
  document.getElementById('verifyEmailDisplay').textContent = VERIFY_EMAIL;

  // Si déjà connecté → dashboard
  try{
    var{data:{session}}=await sb.auth.getSession();
    if(session){ location.href='dashboard.html'; return; }
  }catch(e){}

  // Démarrer le timer
  startTimer();

  // Focus sur premier champ
  document.getElementById('otp0').focus();
})();

// ── TIMER ────────────────────────────────────────────────────
function startTimer(){
  clearInterval(TIMER_INTERVAL);
  SECONDS_LEFT = 3600;
  updateTimerDisplay();
  TIMER_INTERVAL = setInterval(function(){
    SECONDS_LEFT--;
    updateTimerDisplay();
    if(SECONDS_LEFT <= 0){
      clearInterval(TIMER_INTERVAL);
      document.getElementById('timerVal').textContent = 'Expiré';
      document.getElementById('resendBtn').classList.add('visible');
    }
  }, 1000);
}

function updateTimerDisplay(){
  var m = Math.floor(SECONDS_LEFT/60);
  var s = SECONDS_LEFT%60;
  document.getElementById('timerVal').textContent =
    String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

// ── LOGIQUE OTP ──────────────────────────────────────────────
var otpCells = Array.from({length:6}, function(_,i){ return document.getElementById('otp'+i); });

otpCells.forEach(function(cell, idx){
  cell.addEventListener('input', function(e){
    var v = e.target.value.replace(/\D/g,'');
    e.target.value = v;
    e.target.classList.toggle('filled', v.length>0);
    if(v && idx < 5){
      otpCells[idx+1].focus();
    }
    // Activer bouton si tous remplis
    var full = otpCells.every(function(c){ return c.value.length===1; });
    document.getElementById('btnVerify').disabled = !full;
    document.getElementById('errMsg').classList.remove('show');
    // Auto-submit si complet
    if(full) verifyCode();
  });

  cell.addEventListener('keydown', function(e){
    if(e.key==='Backspace' && !e.target.value && idx>0){
      otpCells[idx-1].focus();
      otpCells[idx-1].value = '';
      otpCells[idx-1].classList.remove('filled');
    }
    if(e.key==='ArrowLeft'  && idx>0) otpCells[idx-1].focus();
    if(e.key==='ArrowRight' && idx<5) otpCells[idx+1].focus();
  });

  // Gérer le paste (coller le code entier)
  cell.addEventListener('paste', function(e){
    e.preventDefault();
    var pasted = (e.clipboardData||window.clipboardData).getData('text').replace(/\D/g,'').slice(0,6);
    pasted.split('').forEach(function(ch, i){
      if(otpCells[i]){
        otpCells[i].value = ch;
        otpCells[i].classList.add('filled');
      }
    });
    if(pasted.length >= 6){
      document.getElementById('btnVerify').disabled = false;
      verifyCode();
    } else if(pasted.length > 0){
      otpCells[Math.min(pasted.length, 5)].focus();
    }
  });
});

// ── VÉRIFIER LE CODE ─────────────────────────────────────────
async function verifyCode(){
  var code = otpCells.map(function(c){ return c.value; }).join('');
  if(code.length !== 6) return;

  var btn = document.getElementById('btnVerify');
  btn.disabled = true;
  btn.classList.add('loading');

  try{
    var{data, error} = await sb.auth.verifyOtp({
      email: VERIFY_EMAIL,
      token: code,
      type:  'signup'
    });

    if(error) throw error;

    // Succès !
    clearInterval(TIMER_INTERVAL);
    localStorage.removeItem('am_verify_email');

    // Créer le profil si pas encore fait
    var user = data.user || (data.session && data.session.user);
    if(user){
      try{
        var meta = user.user_metadata || {};
        await sb.from('profiles').upsert({
          id:        user.id,
          full_name: meta.full_name || meta.name || user.email.split('@')[0],
          whatsapp:  meta.whatsapp  || '',
          pays:      meta.pays      || '',
          ville:     meta.ville     || '',
          email:     user.email,
          ref_code:  user.id.substring(0,8),
          referred_by: meta.referred_by || null,
          created_at: new Date().toISOString()
        }, {onConflict:'id'});
      }catch(dbErr){ console.warn('Profile upsert:', dbErr.message); }
    }

    showSuccess();
  }catch(err){
    console.error('verifyOtp error:', err);
    // Animer les cellules en rouge
    otpCells.forEach(function(c){ c.classList.add('error'); });
    setTimeout(function(){ otpCells.forEach(function(c){ c.classList.remove('error'); }); }, 500);
    document.getElementById('errMsg').classList.add('show');
    document.getElementById('errMsg').textContent =
      err.message && err.message.includes('expired')
        ? 'Code expiré. Clique sur "Renvoyer" pour en recevoir un nouveau.'
        : 'Code incorrect. Vérifie et réessaie.';
    // Vider les cellules
    otpCells.forEach(function(c){ c.value=''; c.classList.remove('filled'); });
    otpCells[0].focus();
  }finally{
    btn.classList.remove('loading');
    btn.disabled = false;
  }
}

// ── RENVOYER ─────────────────────────────────────────────────
async function resendCode(){
  var btn = document.getElementById('resendBtn');
  btn.textContent = 'Envoi...';
  btn.disabled = true;
  try{
    var{error} = await sb.auth.resend({
      type:  'signup',
      email: VERIFY_EMAIL
    });
    if(error) throw error;
    toast('Nouveau code envoyé ! Vérifie ton email.','success');
    document.getElementById('resendBtn').classList.remove('visible');
    startTimer();
  }catch(err){
    toast('Erreur: '+err.message,'error');
  }finally{
    btn.textContent = 'Renvoyer';
    btn.disabled = false;
  }
}

// ── SUCCÈS ───────────────────────────────────────────────────
function showSuccess(){
  document.getElementById('initialState').classList.add('hide');
  document.getElementById('successState').classList.add('show');
  // Redirect auto après 3s
  setTimeout(function(){ location.href='dashboard.html'; }, 3000);
}

// ── TOAST ────────────────────────────────────────────────────
var _tt;
function toast(msg, type){
  var icons={success:'✅',error:'❌',warning:'⚠️'};
  document.getElementById('tIco').textContent = icons[type]||'💬';
  document.getElementById('tMsg').textContent = msg;
  var el = document.getElementById('toast');
  el.className = 'show '+(type||'');
  clearTimeout(_tt);
  _tt = setTimeout(function(){ el.className=''; }, 4000);
}
</script>
</body>
</html>
