<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
  <title>AfriMarket — Mes Missions</title>
  <link href="https://fonts.googleapis.com/css2?family=Clash+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    :root{
      --dark:#080E2A; --darker:#040916; --gold:#F5B731; --gold2:#FFD166; --gold3:#E8960A;
      --orange:#FF6B1A; --turq:#00C2B7; --green:#00C271; --blue:#1B3FE4; --blue2:#2D55FF;
      --red:#E83030; --gray:#8892A4; --border:#E8EDF5; --nav-h:72px;
      --bg:#F4F6FC;
    }
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    html{scroll-behavior:smooth;}
    body{
      font-family:'Plus Jakarta Sans',sans-serif;
      background:var(--bg);
      color:var(--dark);
      min-height:100vh;
      /* ── Espace haut : header 60px ── */
      padding-top:0;
      /* ── Espace bas : nav + safe area ── */
      padding-bottom:calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));
      overflow-x:hidden;
    }

    /* ───────── HEADER ───────── */
    .header{
      position:sticky; top:0; z-index:100;
      background:white;
      border-bottom:1px solid var(--border);
      padding:0 1.2rem;
      height:60px;
      display:flex; align-items:center; gap:.8rem;
    }
    .h-back{
      background:none; border:none; color:var(--gray);
      font-size:1.15rem; cursor:pointer; padding:.3rem;
      border-radius:8px; transition:color .2s;
    }
    .h-back:hover{color:var(--dark);}
    .h-title{
      font-family:'Clash Display',sans-serif;
      font-size:1rem; font-weight:700; color:var(--dark); flex:1;
    }
    .h-sub{font-size:.7rem;color:var(--gray);margin-top:1px;}
    .h-refresh{
      background:none; border:1.5px solid var(--border); border-radius:10px;
      padding:.3rem .6rem; font-size:.75rem; font-weight:600;
      color:var(--gray); cursor:pointer; transition:all .2s;
    }
    .h-refresh:hover{border-color:var(--blue);color:var(--blue);}

    /* ───────── HERO STATS ───────── */
    .stats-bar{
      background:linear-gradient(135deg,var(--dark) 0%,#0D1E6B 100%);
      padding:1.2rem 1.2rem 1.4rem;
      display:flex; gap:.8rem;
    }
    .stat-pill{
      flex:1; background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius:14px; padding:.7rem .6rem; text-align:center;
    }
    .stat-val{
      font-family:'Clash Display',sans-serif; font-size:1.2rem;
      font-weight:700; color:var(--gold); margin-bottom:.15rem;
    }
    .stat-lbl{font-size:.58rem; color:rgba(255,255,255,.45); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}

    /* ───────── SERVICE SELECTOR ───────── */
    .service-selector{
      background:white; border-bottom:1px solid var(--border);
      padding:.7rem 1.2rem; display:flex; gap:.5rem;
      overflow-x:auto; -webkit-overflow-scrolling:touch;
    }
    .service-selector::-webkit-scrollbar{display:none;}
    .svc-chip{
      display:flex; align-items:center; gap:.35rem;
      background:#F4F6FC; border:1.5px solid var(--border);
      border-radius:99px; padding:.32rem .8rem;
      font-size:.72rem; font-weight:700; color:var(--gray);
      cursor:pointer; white-space:nowrap; transition:all .2s; flex-shrink:0;
    }
    .svc-chip.active{
      background:var(--dark); border-color:var(--dark); color:white;
    }
    .svc-chip .chip-dot{
      width:7px; height:7px; border-radius:50%;
    }

    /* ───────── TABS ───────── */
    .tabs{
      background:white; border-bottom:1px solid var(--border);
      display:flex; padding:0 1.2rem; gap:0;
    }
    .tab{
      flex:1; padding:.7rem .3rem;
      font-size:.74rem; font-weight:700; color:var(--gray);
      text-align:center; cursor:pointer; border-bottom:2.5px solid transparent;
      transition:all .2s;
    }
    .tab.active{color:var(--blue2); border-bottom-color:var(--blue2);}

    /* ───────── CONTENT ───────── */
    .content{padding:.9rem 1.2rem; display:flex; flex-direction:column; gap:.7rem;}

    /* ───────── MISSION CARD ───────── */
    .mission-card{
      background:white; border-radius:16px;
      border:1.5px solid var(--border);
      box-shadow:0 2px 10px rgba(27,63,228,.05);
      overflow:hidden;
    }
    .mc-top{padding:.9rem 1rem .7rem; display:flex; align-items:flex-start; gap:.7rem;}
    .mc-ico{
      width:40px; height:40px; border-radius:12px;
      display:flex; align-items:center; justify-content:center;
      font-size:1.1rem; flex-shrink:0;
    }
    .mc-body{flex:1; min-width:0;}
    .mc-title{font-size:.84rem; font-weight:700; color:var(--dark); margin-bottom:.15rem;}
    .mc-desc{font-size:.72rem; color:var(--gray); line-height:1.5;}
    .mc-status{
      font-size:.62rem; font-weight:800; padding:.18rem .55rem;
      border-radius:99px; letter-spacing:.3px; flex-shrink:0;
    }
    .mc-status.open{background:rgba(0,194,113,.1); color:#007A46;}
    .mc-status.inprogress{background:rgba(245,183,49,.12); color:#8A5A00;}
    .mc-status.done{background:rgba(27,63,228,.08); color:var(--blue2);}
    .mc-status.pending_user{background:rgba(255,107,26,.1); color:#B04000;}

    .mc-foot{
      border-top:1px solid var(--border);
      padding:.65rem 1rem;
      display:flex; align-items:center; justify-content:space-between; gap:.5rem;
    }
    .mc-earn{display:flex; flex-direction:column;}
    .mc-earn-lbl{font-size:.58rem; color:var(--gray); font-weight:600; text-transform:uppercase; letter-spacing:.3px;}
    .mc-earn-val{font-family:'Clash Display',sans-serif; font-size:.88rem; font-weight:700; color:var(--green);}
    .mc-actions{display:flex; gap:.4rem;}
    .mc-btn{
      border:none; border-radius:10px; padding:.4rem .75rem;
      font-size:.72rem; font-weight:700; cursor:pointer;
      font-family:'Plus Jakarta Sans',sans-serif; transition:all .2s;
    }
    .mc-btn.primary{background:linear-gradient(135deg,var(--blue),var(--blue2)); color:white;}
    .mc-btn.secondary{background:#F4F6FC; color:var(--dark); border:1.5px solid var(--border);}
    .mc-btn.success{background:linear-gradient(135deg,var(--green),#00A878); color:white;}
    .mc-btn:hover{opacity:.85;}

    /* ───────── EMPTY STATE ───────── */
    .empty-state{
      background:white; border-radius:16px;
      border:1.5px dashed var(--border);
      padding:2rem 1.2rem; text-align:center;
    }
    .es-ico{font-size:2.2rem; margin-bottom:.6rem;}
    .es-title{font-family:'Clash Display',sans-serif; font-size:1rem; font-weight:700; color:var(--dark); margin-bottom:.3rem;}
    .es-desc{font-size:.76rem; color:var(--gray); line-height:1.5; margin-bottom:.9rem;}
    .es-btn{
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white; border:none; border-radius:12px;
      padding:.6rem 1.2rem; font-size:.8rem; font-weight:700;
      cursor:pointer; font-family:'Plus Jakarta Sans',sans-serif;
    }

    /* ───────── GAIN HISTORY ───────── */
    .history-row{
      background:white; border-radius:12px;
      border:1.5px solid var(--border);
      padding:.75rem 1rem;
      display:flex; align-items:center; gap:.7rem;
    }
    .hr-ico{width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:1rem; flex-shrink:0;}
    .hr-body{flex:1; min-width:0;}
    .hr-title{font-size:.8rem; font-weight:600; color:var(--dark); margin-bottom:.1rem;}
    .hr-date{font-size:.66rem; color:var(--gray);}
    .hr-amount{font-family:'Clash Display',sans-serif; font-size:.9rem; font-weight:700; color:var(--green); white-space:nowrap;}

    /* ───────── SKELETON LOADER ───────── */
    .skeleton{background:linear-gradient(90deg,#f0f2f8 25%,#e4e8f5 50%,#f0f2f8 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; border-radius:8px;}
    @keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}

    /* ───────── MODAL RAPPORT ───────── */
    .modal-ov{
      display:none; position:fixed; inset:0;
      background:rgba(8,14,42,.6); z-index:500;
      align-items:flex-end; backdrop-filter:blur(4px);
    }
    .modal-ov.open{display:flex;}
    .modal-sheet{
      background:white; border-radius:24px 24px 0 0;
      width:100%; max-height:88vh; overflow-y:auto;
      padding:1.4rem 1.2rem 2rem;
      border-top:1px solid var(--border);
      animation:slideUp .3s ease;
    }
    @keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
    .modal-handle{width:36px; height:4px; border-radius:99px; background:var(--border); margin:0 auto 1.2rem;}
    .modal-title{font-family:'Clash Display',sans-serif; font-size:1.1rem; font-weight:700; color:var(--dark); margin-bottom:.25rem;}
    .modal-sub{font-size:.74rem; color:var(--gray); margin-bottom:1.2rem; line-height:1.5;}
    .f-lbl{font-size:.73rem; font-weight:600; color:var(--gray); margin-bottom:.38rem; display:block;}
    .f-inp{
      width:100%; background:#F8F9FF;
      border:1.5px solid var(--border); border-radius:12px;
      padding:.7rem .9rem; color:var(--dark);
      font-family:'Plus Jakarta Sans',sans-serif; font-size:.84rem;
      outline:none; transition:border-color .2s; margin-bottom:.8rem;
    }
    .f-inp:focus{border-color:var(--blue2); background:white;}
    .f-inp::placeholder{color:var(--gray);}
    .f-btn{
      width:100%; padding:.85rem;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      border:none; border-radius:14px;
      color:white; font-family:'Clash Display',sans-serif;
      font-size:.95rem; font-weight:700; cursor:pointer;
    }
    .f-btn:disabled{opacity:.5; cursor:not-allowed;}

    /* ───────── BOTTOM NAV ───────── */
    .bottom-nav{
      position:fixed; bottom:0; left:0; right:0;
      background:white;
      border-top:1px solid var(--border);
      display:flex; align-items:center; justify-content:space-around;
      padding:0 .5rem;
      padding-bottom:env(safe-area-inset-bottom,0px);
      height:calc(var(--nav-h) + env(safe-area-inset-bottom,0px));
      box-shadow:0 -4px 20px rgba(8,14,42,.08);
      z-index:99;
    }
    .nav-item{
      display:flex; flex-direction:column; align-items:center; gap:.18rem;
      padding:.4rem .6rem; border:none; background:none; cursor:pointer;
      border-radius:12px; min-width:52px;
    }
    .nav-ico{font-size:1.25rem; line-height:1;}
    .nav-lbl{font-size:.58rem; font-weight:600; color:var(--gray);}
    .nav-item.active .nav-lbl{color:var(--blue2); font-weight:700;}
    .nav-plus-btn{
      width:44px; height:44px; border-radius:50%;
      background:linear-gradient(135deg,var(--blue),var(--blue2));
      color:white; font-size:1.4rem;
      display:flex; align-items:center; justify-content:center;
      border:none; cursor:pointer;
      box-shadow:0 4px 14px rgba(27,63,228,.4);
    }

    /* ───────── TOAST ───────── */
    #toast{
      position:fixed;
      bottom:calc(var(--nav-h) + 12px + env(safe-area-inset-bottom,0px));
      left:50%; transform:translateX(-50%) translateY(20px);
      background:var(--dark); color:white;
      padding:.65rem 1.1rem; border-radius:14px;
      font-size:.8rem; font-weight:600;
      opacity:0; transition:all .35s; pointer-events:none;
      z-index:600; border-left:3px solid var(--turq);
      box-shadow:0 6px 20px rgba(0,0,0,.2);
      max-width:88vw; text-align:center;
    }
    #toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

    /* ───────── LOADING ───────── */
    .loading-wrap{padding:2rem; text-align:center;}
    .loading-spinner{
      width:32px; height:32px; border:3px solid var(--border);
      border-top-color:var(--blue2); border-radius:50%;
      animation:spin .7s linear infinite; margin:0 auto .8rem;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <button class="h-back" onclick="history.back()">←</button>
  <div>
    <div class="h-title">Mes Missions</div>
    <div class="h-sub" id="headerSub">Chargement…</div>
  </div>
  <button class="h-refresh" onclick="loadAll()">🔄</button>
</div>

<!-- STATS BAR -->
<div class="stats-bar">
  <div class="stat-pill"><div class="stat-val" id="statActives">—</div><div class="stat-lbl">Services actifs</div></div>
  <div class="stat-pill"><div class="stat-val" id="statMissions">—</div><div class="stat-lbl">Missions totales</div></div>
  <div class="stat-pill"><div class="stat-val" id="statGains">—</div><div class="stat-lbl">FCFA gagnés</div></div>
</div>

<!-- SERVICE SELECTOR -->
<div class="service-selector" id="svcSelector">
  <div class="svc-chip active" data-svc="all" onclick="selectSvc(this,'all')">
    <span class="chip-dot" style="background:var(--blue2)"></span>Tous
  </div>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" data-tab="available" onclick="selectTab(this,'available')">📋 Disponibles</div>
  <div class="tab" data-tab="inprogress"        onclick="selectTab(this,'inprogress')">⚡ En cours</div>
  <div class="tab" data-tab="history"           onclick="selectTab(this,'history')">✅ Terminées</div>
  <div class="tab" data-tab="gains"             onclick="selectTab(this,'gains')">💰 Gains</div>
</div>

<!-- CONTENT -->
<div class="content" id="mainContent">
  <div class="loading-wrap"><div class="loading-spinner"></div><div style="font-size:.8rem;color:var(--gray);">Chargement de tes missions…</div></div>
</div>

<!-- MODAL SOUMETTRE RAPPORT -->
<div class="modal-ov" id="reportModal" onclick="if(event.target===this)closeReport()">
  <div class="modal-sheet">
    <div class="modal-handle"></div>
    <div class="modal-title" id="reportTitle">📝 Soumettre mon travail</div>
    <div class="modal-sub" id="reportSub">Décris ce que tu as fait et joins les preuves si nécessaire.</div>
    <label class="f-lbl">Résumé de ton travail *</label>
    <textarea class="f-inp" id="reportDesc" rows="4" placeholder="Ex: J'ai recruté 3 vendeurs au marché de Mokolo. Leurs noms et numéros : …"></textarea>
    <label class="f-lbl">Lien preuve (photo, Google Drive, WhatsApp…) optionnel</label>
    <input class="f-inp" type="url" id="reportProof" placeholder="https://…"/>
    <button class="f-btn" id="reportBtn" onclick="submitReport()">✅ Soumettre</button>
  </div>
</div>

<!-- BOTTOM NAV -->
<nav class="bottom-nav">
  <button class="nav-item" onclick="location.href='dashboard.html'"><span class="nav-ico">🏠</span><span class="nav-lbl">Accueil</span></button>
  <button class="nav-item" onclick="location.href='messages.html'"><span class="nav-ico">💬</span><span class="nav-lbl">Messages</span></button>
  <div class="nav-item"><button class="nav-plus-btn" onclick="location.href='dashboard.html'">➕</button><span class="nav-lbl" style="color:var(--blue2);font-weight:700">Publier</span></div>
  <button class="nav-item active" onclick="location.href='gagner.html'"><span class="nav-ico">💰</span><span class="nav-lbl" style="color:var(--blue2);font-weight:700">Gagner</span></button>
  <button class="nav-item" onclick="location.href='profil.html'"><span class="nav-ico">👤</span><span class="nav-lbl">Profil</span></button>
</nav>
<div id="toast"></div>

<script>
const _sb = supabase.createClient(
  'https://elgbvitijyjriozvzqpf.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM'
);

var U = null;
var _myServices    = [];   // approved service_registrations
var _missions      = [];   // from user_missions table
var _gains         = [];   // from mission_gains table
var _currentSvc    = 'all';
var _currentTab    = 'available';
var _reportMission = null;

const SVC_INFO = {
  'gagner-chasseur':    {label:'Chasseur de Vendeurs', icon:'🎯', color:'#E8960A'},
  'gagner-verificateur':{label:'Vérificateur Certifié',icon:'🕵️', color:'#00A8A0'},
  'gagner-negociateur': {label:'Négociateur Pro',      icon:'🗣️', color:'#D4561A'},
  'gagner-livreur':     {label:'Livreur Indépendant',  icon:'📦', color:'#009958'},
  'gagner-formateur':   {label:'Formateur Certifié',   icon:'🎓', color:'#1B3FE4'},
  'gagner-courtier':    {label:'Courtier Import-Export',icon:'🌍',color:'#8B2FD4'},
  'gagner-encheres':    {label:'Enchères Inversées',   icon:'🎰', color:'#C42020'},
};

// ── MISSION TEMPLATES par service ────────────────────────
// Ces missions sont générées dynamiquement selon le service.
// Quand la table user_missions est vide, on affiche les missions génériques à faire.
const MISSION_TEMPLATES = {
  'gagner-chasseur': [
    {title:'Recruter 5 vendeurs actifs',        desc:'Trouve 5 commerçants qui publient au moins 1 annonce avec ton code.',                        earn:'2 500 FCFA', type:'recrutement'},
    {title:'Recruter 1 vendeur Premium',         desc:'Convaincs un vendeur de passer Premium (2 000 FCFA/mois).',                                  earn:'1 000 FCFA', type:'premium'},
    {title:'Défi hebdo : 10 recrutements',       desc:'Recrute 10 vendeurs actifs cette semaine pour décrocher le bonus.',                          earn:'10 000 FCFA', type:'defi'},
  ],
  'gagner-verificateur': [
    {title:'Effectue ta première vérification',  desc:'Accepte une mission de vérification dans ta zone et soumets ton rapport.',                   earn:'3 000+ FCFA', type:'mission'},
    {title:'Obtiens 5 étoiles sur 3 rapports',   desc:'Fais 3 vérifications notées 5/5 par les acheteurs pour débloquer le bonus.',                 earn:'Bonus +20%',  type:'bonus'},
  ],
  'gagner-negociateur': [
    {title:'Première négociation réussie',       desc:'Obtiens une réduction sur n\'importe quelle annonce pour un acheteur mandataire.',           earn:'15-20% réduction', type:'mission'},
    {title:'Défi : économiser 100 000 FCFA',     desc:'Cumule 100 000 FCFA de réductions obtenues pour les acheteurs ce mois.',                    earn:'Bonus 5 000 FCFA', type:'defi'},
  ],
  'gagner-livreur': [
    {title:'Effectue 5 livraisons',              desc:'Complète 5 livraisons confirmées dans ta zone cette semaine.',                               earn:'2 500 – 10 000 FCFA', type:'mission'},
    {title:'Note parfaite sur 10 livraisons',    desc:'Maintiens une note de 5 étoiles sur tes 10 prochaines livraisons.',                         earn:'Bonus +15%',          type:'bonus'},
  ],
  'gagner-formateur': [
    {title:'Organise ta première formation',     desc:'Forme un groupe de 5 personnes minimum à utiliser AfriMarket.',                             earn:'10 000+ FCFA',   type:'mission'},
    {title:'Former 20 utilisateurs ce mois',     desc:'Cumule 20 participants formés ce mois pour le badge "Super Formateur".',                     earn:'Badge + Bonus',  type:'defi'},
  ],
  'gagner-courtier': [
    {title:'Crée ta première annonce inter-pays',desc:'Publie une offre ou une demande visible dans au moins 2 pays.',                              earn:'Commission sur deal', type:'mission'},
    {title:'Finalise 1 deal transfrontalier',    desc:'Facilite une transaction conclue entre acheteur et vendeur de pays différents.',             earn:'5–12% du deal',       type:'mission'},
  ],
  'gagner-encheres': [
    {title:'Participe à 3 enchères',             desc:'Soumets des offres sur 3 demandes d\'acheteurs différents.',                                 earn:'Vente garantie',  type:'mission'},
    {title:'Remporte 1 enchère inversée',        desc:'Sois sélectionné par un acheteur et finalise la vente.',                                    earn:'Prix de vente',   type:'mission'},
  ],
};

// ─── INIT ────────────────────────────────────────────────
(async function() {
  var res = await _sb.auth.getSession();
  var session = res.data && res.data.session;
  if (!session) { location.href = 'index.html'; return; }
  U = session.user;

  // URL param ?service=
  var urlSvc = new URLSearchParams(location.search).get('service');

  await loadAll();

  if (urlSvc && SVC_INFO[urlSvc]) {
    // Auto-select the service from URL
    var chip = document.querySelector('.svc-chip[data-svc="'+urlSvc+'"]');
    if (chip) { selectSvc(chip, urlSvc); }
  }
})();

// ─── LOAD ALL DATA ───────────────────────────────────────
async function loadAll() {
  if (!U) return;
  try {
    // 1. My approved services
    var svcRes = await _sb.from('service_registrations')
      .select('*').eq('user_id', U.id).eq('status','approved');
    _myServices = (svcRes.data || []);

    // 2. My missions (if table exists)
    var mRes = await _sb.from('user_missions')
      .select('*').eq('user_id', U.id)
      .order('created_at', {ascending:false});
    _missions = (mRes.data || []);

    // 3. My gains (if table exists)
    var gRes = await _sb.from('mission_gains')
      .select('*').eq('user_id', U.id)
      .order('created_at', {ascending:false});
    _gains = (gRes.data || []);

  } catch(e) {
    // Tables may not exist yet — work with empty arrays
    _missions = []; _gains = [];
  }

  buildUI();
}

// ─── BUILD UI ────────────────────────────────────────────
function buildUI() {
  updateStats();
  buildServiceSelector();
  render();
}

function updateStats() {
  document.getElementById('statActives').textContent  = _myServices.length;
  document.getElementById('statMissions').textContent = _missions.length;
  var totalGains = _gains.reduce(function(sum,g){ return sum + (g.amount||0); }, 0);
  document.getElementById('statGains').textContent    = totalGains > 0 ? totalGains.toLocaleString('fr-FR') : '0';

  // Subtitle
  var names = _myServices.map(function(s){ return (SVC_INFO[s.service]||{}).icon||'📋'; }).join(' ');
  document.getElementById('headerSub').textContent = _myServices.length
    ? names + ' — ' + _myServices.length + ' service(s) actif(s)'
    : 'Aucun service actif';
}

function buildServiceSelector() {
  var sel = document.getElementById('svcSelector');
  var chips = '<div class="svc-chip active" data-svc="all" onclick="selectSvc(this,\'all\')"><span class="chip-dot" style="background:var(--blue2)"></span>Tous</div>';
  _myServices.forEach(function(s) {
    var info = SVC_INFO[s.service] || {label:s.service, icon:'📋', color:'#888'};
    chips += '<div class="svc-chip" data-svc="'+s.service+'" onclick="selectSvc(this,\''+s.service+'\')">'
      + '<span class="chip-dot" style="background:'+info.color+'"></span>'
      + info.icon + ' ' + info.label
      + '</div>';
  });
  sel.innerHTML = chips;
}

function selectSvc(el, svc) {
  document.querySelectorAll('.svc-chip').forEach(function(c){ c.classList.remove('active'); });
  el.classList.add('active');
  _currentSvc = svc;
  render();
}

function selectTab(el, tab) {
  document.querySelectorAll('.tab').forEach(function(t){ t.classList.remove('active'); });
  el.classList.add('active');
  _currentTab = tab;
  render();
}

function render() {
  if (!_myServices.length) {
    renderNoServices();
    return;
  }
  if (_currentTab === 'gains') { renderGains(); return; }

  // Filter services
  var svcs = _currentSvc === 'all' ? _myServices : _myServices.filter(function(s){ return s.service === _currentSvc; });

  if (_currentTab === 'available')   renderAvailable(svcs);
  else if (_currentTab === 'inprogress') renderInProgress(svcs);
  else if (_currentTab === 'history')    renderHistory(svcs);
}

// ─── RENDERS ─────────────────────────────────────────────
function renderNoServices() {
  document.getElementById('mainContent').innerHTML =
    '<div class="empty-state">'
    + '<div class="es-ico">💰</div>'
    + '<div class="es-title">Aucun service actif</div>'
    + '<div class="es-desc">Tu n\'as pas encore de service approuvé.<br>Postule à une opportunité pour commencer.</div>'
    + '<button class="es-btn" onclick="location.href=\'gagner.html\'">Voir les opportunités →</button>'
    + '</div>';
}

function renderAvailable(svcs) {
  var html = '';
  svcs.forEach(function(s) {
    var info  = SVC_INFO[s.service] || {label:s.service, icon:'📋', color:'#888'};
    var tmpls = MISSION_TEMPLATES[s.service] || [];
    if (tmpls.length) {
      html += '<div style="font-size:.72rem;font-weight:700;color:var(--gray);text-transform:uppercase;letter-spacing:.5px;margin:.3rem 0 .2rem;">'+info.icon+' '+info.label+'</div>';
      tmpls.forEach(function(t, i) {
        // Check if mission already started
        var existing = _missions.find(function(m){ return m.service===s.service && m.template_idx===i; });
        var statusBadge = existing ? '<span class="mc-status '+existing.status+'">'+statusLabelFn(existing.status)+'</span>' : '<span class="mc-status open">📋 À faire</span>';
        var actionBtn = '';
        if (!existing) {
          actionBtn = '<button class="mc-btn primary" onclick="startMission(\''+s.service+'\','+i+')">Commencer</button>';
        } else if (existing.status === 'inprogress') {
          actionBtn = '<button class="mc-btn success" onclick="openReport(\''+existing.id+'\',\''+t.title+'\')">Soumettre</button>';
        } else {
          actionBtn = '<button class="mc-btn secondary" disabled>'+statusLabelFn(existing.status)+'</button>';
        }
        html += missionCard(info, t.title, t.desc, t.earn, statusBadge, actionBtn);
      });
    }
  });
  document.getElementById('mainContent').innerHTML = html ||
    '<div class="empty-state"><div class="es-ico">✅</div><div class="es-title">Tout est fait !</div><div class="es-desc">Tu as lancé toutes les missions disponibles. Reviens bientôt pour de nouvelles opportunités.</div></div>';
}

function renderInProgress(svcs) {
  var actives = _missions.filter(function(m){
    return m.status === 'inprogress' && (svcs.some(function(s){ return s.service === m.service; }));
  });
  if (!actives.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-state"><div class="es-ico">⚡</div><div class="es-title">Aucune mission en cours</div><div class="es-desc">Commence une mission depuis l\'onglet "Disponibles".</div></div>';
    return;
  }
  var html = actives.map(function(m) {
    var info  = SVC_INFO[m.service] || {label:m.service, icon:'📋', color:'#888'};
    var tmpls = MISSION_TEMPLATES[m.service] || [];
    var t     = tmpls[m.template_idx] || {title:m.title||'Mission', desc:'', earn:'—'};
    var btn   = '<button class="mc-btn success" onclick="openReport(\''+m.id+'\',\''+t.title+'\')">📝 Soumettre mon travail</button>';
    return missionCard(info, t.title, t.desc, t.earn, '<span class="mc-status inprogress">⚡ En cours</span>', btn);
  }).join('');
  document.getElementById('mainContent').innerHTML = html;
}

function renderHistory(svcs) {
  var done = _missions.filter(function(m){
    return (m.status==='done'||m.status==='validated') && svcs.some(function(s){ return s.service===m.service; });
  });
  if (!done.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-state"><div class="es-ico">📜</div><div class="es-title">Pas encore d\'historique</div><div class="es-desc">Les missions terminées apparaîtront ici.</div></div>';
    return;
  }
  var html = done.map(function(m) {
    var info  = SVC_INFO[m.service] || {label:m.service, icon:'📋', color:'#888'};
    var tmpls = MISSION_TEMPLATES[m.service] || [];
    var t     = tmpls[m.template_idx] || {title:m.title||'Mission', desc:'', earn:'—'};
    return missionCard(info, t.title, t.desc, m.gain ? m.gain.toLocaleString('fr-FR')+' FCFA' : t.earn,
      '<span class="mc-status done">✅ Terminée</span>', '');
  }).join('');
  document.getElementById('mainContent').innerHTML = html;
}

function renderGains() {
  if (!_gains.length) {
    document.getElementById('mainContent').innerHTML =
      '<div class="empty-state"><div class="es-ico">💸</div><div class="es-title">Pas encore de gains</div><div class="es-desc">Tes gains apparaîtront ici dès qu\'une mission sera validée.</div></div>';
    return;
  }
  var html = _gains.map(function(g) {
    var info = SVC_INFO[g.service] || {label:g.service||'Service', icon:'💰', color:'#009958'};
    return '<div class="history-row">'
      + '<div class="hr-ico" style="background:'+info.color+'18;border:1.5px solid '+info.color+'30;">'+info.icon+'</div>'
      + '<div class="hr-body"><div class="hr-title">'+info.label+' — '+g.description+'</div><div class="hr-date">'+fmtDate(g.created_at)+'</div></div>'
      + '<div class="hr-amount">+' + (g.amount||0).toLocaleString('fr-FR') + ' F</div>'
      + '</div>';
  }).join('');

  var total = _gains.reduce(function(s,g){ return s+(g.amount||0); }, 0);
  html = '<div style="background:linear-gradient(135deg,var(--green),#00A878);border-radius:16px;padding:1rem 1.2rem;margin-bottom:.5rem;display:flex;justify-content:space-between;align-items:center;">'
    + '<div style="font-size:.75rem;font-weight:600;color:rgba(255,255,255,.8);">Total gagné</div>'
    + '<div style="font-family:\'Clash Display\',sans-serif;font-size:1.3rem;font-weight:700;color:white;">'+total.toLocaleString('fr-FR')+' F</div>'
    + '</div>' + html;
  document.getElementById('mainContent').innerHTML = html;
}

// ─── HELPERS ─────────────────────────────────────────────
function missionCard(info, title, desc, earn, statusBadge, actionBtn) {
  return '<div class="mission-card">'
    + '<div class="mc-top">'
    +   '<div class="mc-ico" style="background:'+info.color+'18;border:1.5px solid '+info.color+'30;">'+info.icon+'</div>'
    +   '<div class="mc-body"><div class="mc-title">'+title+'</div><div class="mc-desc">'+desc+'</div></div>'
    +   statusBadge
    + '</div>'
    + '<div class="mc-foot">'
    +   '<div class="mc-earn"><div class="mc-earn-lbl">Gain</div><div class="mc-earn-val">'+earn+'</div></div>'
    +   '<div class="mc-actions">'+actionBtn+'</div>'
    + '</div>'
    + '</div>';
}

function statusLabelFn(s) {
  return {open:'📋 À faire', inprogress:'⚡ En cours', done:'✅ Validée', pending_user:'⏳ En attente', rejected:'❌ Rejetée'}[s] || s;
}

function fmtDate(d) {
  if (!d) return '';
  return new Date(d).toLocaleDateString('fr-FR', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}

// ─── ACTIONS ─────────────────────────────────────────────
async function startMission(service, templateIdx) {
  try {
    var { data, error } = await _sb.from('user_missions').insert({
      user_id: U.id,
      service: service,
      template_idx: templateIdx,
      status: 'inprogress',
      created_at: new Date().toISOString()
    }).select().single();
    if (error) throw error;
    _missions.push(data);
    render();
    toast('⚡ Mission démarrée ! Bonne chance.', 'ok');
  } catch(e) {
    toast('Erreur : ' + e.message, 'err');
  }
}

function openReport(missionId, title) {
  _reportMission = missionId;
  document.getElementById('reportTitle').textContent = '📝 ' + title;
  document.getElementById('reportSub').textContent   = 'Décris ton travail en détail. Plus c\'est précis, plus la validation est rapide.';
  document.getElementById('reportDesc').value = '';
  document.getElementById('reportProof').value = '';
  document.getElementById('reportBtn').disabled = false;
  document.getElementById('reportBtn').textContent = '✅ Soumettre';
  document.getElementById('reportModal').classList.add('open');
}

function closeReport() {
  document.getElementById('reportModal').classList.remove('open');
  _reportMission = null;
}

async function submitReport() {
  if (!_reportMission) return;
  var desc  = document.getElementById('reportDesc').value.trim();
  var proof = document.getElementById('reportProof').value.trim();
  if (!desc) { toast('Décris ton travail avant de soumettre', 'warn'); return; }

  var btn = document.getElementById('reportBtn');
  btn.disabled = true; btn.textContent = '⏳ Envoi…';

  try {
    var { error } = await _sb.from('user_missions').update({
      status: 'pending_user',
      report_desc: desc,
      report_proof: proof || null,
      submitted_at: new Date().toISOString()
    }).eq('id', _reportMission);
    if (error) throw error;

    // Update local state
    var m = _missions.find(function(m){ return m.id === _reportMission; });
    if (m) { m.status = 'pending_user'; m.report_desc = desc; }

    // Notif admin via notifications table
    await _sb.from('notifications').insert({
      user_id: U.id, // admin will see it
      title: '📋 Rapport soumis',
      message: 'Un agent a soumis un rapport de mission : ' + desc.substring(0,80),
      icon: '📋', type:'info', read:false
    });

    closeReport();
    render();
    toast('✅ Rapport envoyé ! Validation sous 24h.', 'ok');
  } catch(e) {
    btn.disabled = false; btn.textContent = '✅ Soumettre';
    toast('Erreur : ' + e.message, 'err');
  }
}

// ─── TOAST ───────────────────────────────────────────────
var _tt;
function toast(msg, t) {
  var cols = {ok:'var(--green)', err:'var(--red)', warn:'var(--gold)'};
  var el = document.getElementById('toast');
  el.textContent = msg; el.className = 'show';
  el.style.borderLeftColor = cols[t] || 'var(--turq)';
  clearTimeout(_tt); _tt = setTimeout(function(){ el.className = ''; }, 4500);
}
</script>
</body>
</html>
