<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Couleurs de la plateforme */
        :root {
            --bleu: #0066cc;
            --rouge: #ff4444;
            --blanc: #ffffff;
            --turquoise: #40e0d0;
            --orange: #ffa500;
        }

        /* Contenu principal */
        .main-content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, rgba(0,102,204,0.1), rgba(255,68,68,0.1), rgba(64,224,208,0.1), rgba(255,165,0,0.1));
            padding: 20px;
        }

        .container {
            max-width: 500px;
            width: 100%;
        }

        .card {
            background: var(--blanc);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 40px;
            border: 3px solid transparent;
            background-image: linear-gradient(white, white), 
                            linear-gradient(135deg, var(--bleu), var(--rouge), var(--turquoise), var(--orange));
            background-origin: border-box;
            background-clip: content-box, border-box;
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.5em;
            background: linear-gradient(135deg, var(--bleu), var(--rouge), var(--turquoise), var(--orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            color: #333;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--turquoise);
            box-shadow: 0 0 0 3px rgba(64,224,208,0.2);
        }

        input:hover, select:hover {
            border-color: var(--orange);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, var(--bleu), var(--turquoise));
            color: var(--blanc);
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,102,204,0.4);
            background: linear-gradient(135deg, var(--rouge), var(--orange));
        }

        .message {
            margin-top: 20px;
            padding: 10px;
            border-radius: 5px;
            display: none;
        }

        .message.success {
            display: block;
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin-top: 5px;
        }

        .payment-method {
            background: #f8f9fa;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .payment-method.selected {
            border-color: var(--turquoise);
            background: linear-gradient(135deg, rgba(64,224,208,0.1), rgba(255,165,0,0.1));
        }

        .payment-method:hover {
            border-color: var(--orange);
            transform: scale(1.05);
        }

        .payment-method i {
            font-size: 24px;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <!-- Contenu principal -->
    <div class="main-content">
        <div class="container">
            <div class="card">
                <div class="logo">
                    <h1>AFRIMARKET</h1>
                </div>
                
                <form id="signupForm">
                    <div class="form-group">
                        <label for="fullname">Nom complet *</label>
                        <input type="text" id="fullname" name="fullname" required placeholder="Entrez votre nom complet">
                    </div>

                    <div class="form-group">
                        <label for="whatsapp">Numéro WhatsApp *</label>
                        <input type="tel" id="whatsapp" name="whatsapp" required placeholder="Ex: +221 77 123 45 67">
                    </div>

                    <div class="form-group">
                        <label for="email">Email *</label>
                        <input type="email" id="email" name="email" required placeholder="votre@email.com">
                    </div>

                    <div class="form-group">
                        <label for="password">Mot de passe *</label>
                        <input type="password" id="password" name="password" required placeholder="Créez un mot de passe">
                    </div>

                    <div class="form-group">
                        <label for="payment">Moyen de paiement *</label>
                        <div class="payment-methods">
                            <div class="payment-method" onclick="selectPayment('Orange Money')">
                                <i>📱</i>
                                <span>Orange Money</span>
                            </div>
                            <div class="payment-method" onclick="selectPayment('Wave')">
                                <i>🌊</i>
                                <span>Wave</span>
                            </div>
                            <div class="payment-method" onclick="selectPayment('Free Money')">
                                <i>💳</i>
                                <span>Free Money</span>
                            </div>
                            <div class="payment-method" onclick="selectPayment('Carte Bancaire')">
                                <i>💳</i>
                                <span>Carte Bancaire</span>
                            </div>
                        </div>
                        <input type="hidden" id="payment" name="payment" required>
                    </div>

                    <div class="form-group">
                        <label for="city">Ville *</label>
                        <select id="city" name="city" required>
                            <option value="">Sélectionnez votre ville</option>
                            <option value="Dakar">Dakar</option>
                            <option value="Thiès">Thiès</option>
                            <option value="Saint-Louis">Saint-Louis</option>
                            <option value="Kaolack">Kaolack</option>
                            <option value="Ziguinchor">Ziguinchor</option>
                            <option value="Autre">Autre</option>
                        </select>
                    </div>

                    <button type="submit" class="submit-btn" id="submitBtn">
                        S'inscrire sur Afrimarket
                    </button>

                    <div class="message" id="message"></div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration Supabase
        const supabaseUrl = 'https://elgbvitijyjriozvzqpf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM';
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Sélection du moyen de paiement
        function selectPayment(method) {
            document.getElementById('payment').value = method;
            
            // Mise à jour visuelle
            document.querySelectorAll('.payment-method').forEach(el => {
                el.classList.remove('selected');
                if (el.textContent.includes(method)) {
                    el.classList.add('selected');
                }
            });
        }

        // Validation du formulaire
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            // Vérification du moyen de paiement
            if (!document.getElementById('payment').value) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Veuillez sélectionner un moyen de paiement';
                return;
            }

            // Désactiver le bouton pendant l'envoi
            submitBtn.disabled = true;
            submitBtn.textContent = 'Inscription en cours...';

            try {
                // Récupération des données
                const formData = {
                    fullname: document.getElementById('fullname').value,
                    whatsapp: document.getElementById('whatsapp').value,
                    email: document.getElementById('email').value,
                    password: document.getElementById('password').value,
                    payment_method: document.getElementById('payment').value,
                    city: document.getElementById('city').value,
                    created_at: new Date()
                };

                // Insertion dans Supabase
                const { data, error } = await supabase
                    .from('users')
                    .insert([formData]);

                if (error) throw error;

                // Succès
                messageDiv.className = 'message success';
                messageDiv.textContent = 'Inscription réussie ! Bienvenue sur Afrimarket.';
                
                // Réinitialisation du formulaire
                document.getElementById('signupForm').reset();
                document.querySelectorAll('.payment-method').forEach(el => {
                    el.classList.remove('selected');
                });

            } catch (error) {
                messageDiv.className = 'message error';
                messageDiv.textContent = 'Erreur lors de l\'inscription : ' + error.message;
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'S\'inscrire sur Afrimarket';
            }
        });

        // Création de la table users dans Supabase (à exécuter une fois)
        async function createTable() {
            try {
                const { error } = await supabase
                    .from('users')
                    .select('*')
                    .limit(1);

                if (error && error.code === '42P01') { // Table n'existe pas
                    console.log('La table users n\'existe pas. Veuillez la créer dans Supabase avec les colonnes :');
                    console.log('- fullname (text)');
                    console.log('- whatsapp (text)');
                    console.log('- email (text)');
                    console.log('- password (text)');
                    console.log('- payment_method (text)');
                    console.log('- city (text)');
                    console.log('- created_at (timestamp)');
                }
            } catch (error) {
                console.log('Vérification de la table:', error);
            }
        }

        // Appeler la fonction au chargement
        createTable();
    </script>
</body>
</html>
