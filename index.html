
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Plateforme de petites annonces</title>
    <style>
        :root {
            --primary-blue: #0066cc;
            --primary-red: #ff4444;
            --primary-orange: #ff8800;
            --primary-turquoise: #40e0d0;
            --white: #ffffff;
            --light-gray: #f5f5f5;
            --dark-gray: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-red), var(--primary-turquoise), var(--primary-orange));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            animation: gradientBG 15s ease infinite;
            background-size: 400% 400%;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .logo {
            background: var(--white);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid transparent;
            border-image: linear-gradient(90deg, var(--primary-blue), var(--primary-red), var(--primary-turquoise), var(--primary-orange));
            border-image-slice: 1;
        }

        .logo h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-red), var(--primary-turquoise), var(--primary-orange));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--dark-gray);
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .form-container {
            padding: 30px;
        }

        .form-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--light-gray);
            padding: 5px;
            border-radius: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--dark-gray);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-turquoise));
            color: var(--white);
            box-shadow: 0 4px 15px rgba(0, 102, 204, 0.3);
        }

        .form {
            display: none;
            animation: slideIn 0.3s ease;
        }

        .form.active {
            display: block;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--dark-gray);
            font-size: 1.8rem;
            font-weight: 600;
        }

        .form input, .form select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: var(--white);
        }

        .form input:focus, .form select:focus {
            outline: none;
            border-color: var(--primary-turquoise);
            box-shadow: 0 0 0 3px rgba(64, 224, 208, 0.1);
        }

        .form input:hover, .form select:hover {
            border-color: var(--primary-orange);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-turquoise));
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--primary-red), var(--primary-orange));
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255, 68, 68, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: var(--white);
            font-weight: 600;
            display: none;
            z-index: 1000;
            animation: slideInRight 0.3s ease;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        @keyframes slideInRight {
            from {
                opacity: 0;
                transform: translateX(100%);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert.success {
            background: linear-gradient(135deg, #00b09b, #96c93d);
        }

        .alert.error {
            background: linear-gradient(135deg, #ff416c, #ff4b2b);
        }

        .alert.info {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-turquoise));
        }

        .color-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-red), var(--primary-turquoise), var(--primary-orange));
            margin: 20px 0;
            border-radius: 3px;
        }

        .terms {
            text-align: center;
            margin-top: 15px;
            font-size: 0.85rem;
            color: #666;
        }

        .terms a {
            color: var(--primary-blue);
            text-decoration: none;
            font-weight: 600;
        }

        .terms a:hover {
            color: var(--primary-red);
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: var(--primary-blue);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .forgot-password a:hover {
            color: var(--primary-red);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>AFRIMARKET</h1>
            <span>Petites annonces • Facile • Rapide • Local</span>
        </div>
        
        <div class="form-container">
            <div class="form-tabs">
                <button class="tab-btn active" onclick="showForm('login')">Connexion</button>
                <button class="tab-btn" onclick="showForm('register')">Inscription</button>
            </div>
            
            <!-- Formulaire de connexion -->
            <div id="loginForm" class="form active">
                <h2>Bienvenue !</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                <button class="btn-primary" onclick="login()">Se connecter</button>
                <div class="forgot-password">
                    <a href="#">Mot de passe oublié ?</a>
                </div>
            </div>
            
            <!-- Formulaire d'inscription -->
            <div id="registerForm" class="form">
                <h2>Créer un compte</h2>
                <input type="text" id="regName" placeholder="Nom complet" required>
                <input type="tel" id="regWhatsapp" placeholder="Numéro WhatsApp" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Mot de passe (min. 6 caractères)" required minlength="6">
                
                <select id="regCountry" required>
                    <option value="">Sélectionnez votre pays</option>
                    <option value="Senegal">Sénégal</option>
                    <option value="Mali">Mali</option>
                    <option value="Cote d'Ivoire">Côte d'Ivoire</option>
                    <option value="Burkina Faso">Burkina Faso</option>
                    <option value="Niger">Niger</option>
                    <option value="Guinee">Guinée</option>
                    <option value="Mauritanie">Mauritanie</option>
                    <option value="Maroc">Maroc</option>
                    <option value="Algerie">Algérie</option>
                    <option value="Tunisie">Tunisie</option>
                </select>
                
                <input type="text" id="regCity" placeholder="Ville" required>
                
                <button class="btn-primary" onclick="register()">S'inscrire sur Afrimarket</button>
                <div class="color-bar"></div>
                <p class="terms">
                    En vous inscrivant, vous acceptez nos <a href="#">conditions d'utilisation</a>
                </p>
            </div>
        </div>
    </div>
    
    <div id="alertMessage" class="alert"></div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://elgbvitijyjriozvzqpf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM';
        
        // Initialisation de Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Gestion des onglets
        function showForm(form) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            
            if(form === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // Fonction d'alerte
        function showAlert(message, type) {
            const alert = document.getElementById('alertMessage');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            setTimeout(() => {
                alert.style.display = 'none';
            }, 4000);
        }

        // Fonction de connexion
        async function login() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            
            if(!email || !password) {
                showAlert('Veuillez remplir tous les champs', 'error');
                return;
            }

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                showAlert('Connexion réussie ! Redirection...', 'success');
                
                // Redirection après connexion
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 1500);

            } catch (error) {
                console.error('Erreur connexion:', error);
                showAlert('Email ou mot de passe incorrect', 'error');
            }
        }

        // Fonction d'inscription
        async function register() {
            const name = document.getElementById('regName').value;
            const whatsapp = document.getElementById('regWhatsapp').value;
            const email = document.getElementById('regEmail').value;
            const password = document.getElementById('regPassword').value;
            const country = document.getElementById('regCountry').value;
            const city = document.getElementById('regCity').value;

            // Validations
            if(!name || !whatsapp || !email || !password || !country || !city) {
                showAlert('Veuillez remplir tous les champs', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            // Validation email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Veuillez entrer un email valide', 'error');
                return;
            }

            // Désactiver le bouton
            const submitBtn = document.querySelector('#registerForm .btn-primary');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Inscription en cours...';

            try {
                // 1. Créer l'utilisateur dans Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            whatsapp: whatsapp,
                            country: country,
                            city: city
                        }
                    }
                });

                if (authError) throw authError;

                // 2. Sauvegarder dans la table profiles
                if (authData.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([
                            {
                                id: authData.user.id,
                                full_name: name,
                                whatsapp: whatsapp,
                                email: email,
                                country: country,
                                city: city,
                                created_at: new Date()
                            }
                        ]);

                    if (profileError) {
                        console.error('Erreur profil:', profileError);
                    }
                }

                showAlert('Inscription réussie ! Vérifiez votre email pour confirmer votre compte.', 'success');
                
                // Réinitialiser le formulaire
                document.getElementById('registerForm').querySelectorAll('input, select').forEach(field => field.value = '');
                
                // Basculer vers l'onglet de connexion après 2 secondes
                setTimeout(() => {
                    showForm('login');
                }, 2000);

            } catch (error) {
                console.error('Erreur inscription:', error);
                
                let errorMessage = "Une erreur est survenue lors de l'inscription.";
                
                if (error.message) {
                    if (error.message.includes('already registered')) {
                        errorMessage = "Cet email est déjà utilisé.";
                    } else {
                        errorMessage = error.message;
                    }
                }
                
                showAlert(errorMessage, 'error');
            } finally {
                // Réactiver le bouton
                submitBtn.disabled = false;
                submitBtn.textContent = "S'inscrire sur Afrimarket";
            }
        }

        // Vérifier si l'utilisateur est déjà connecté
        async function checkUser() {
            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                // Rediriger vers le tableau de bord si déjà connecté
                // window.location.href = 'dashboard.html';
                console.log('Utilisateur connecté:', user);
            }
        }

        // Vérifier au chargement
        checkUser();
    </script>
</body>
</html>
