<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Authentification</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0066cc 0%, #ff3300 50%, #40e0d0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Loader overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease 5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0066cc;
            border-right: 5px solid #ff3300;
            border-bottom: 5px solid #40e0d0;
            border-left: 5px solid #ff8c00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Container principal */
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 3px solid transparent;
            background-image: linear-gradient(white, white), 
                              linear-gradient(135deg, #0066cc, #ff3300, #40e0d0, #ff8c00);
            background-origin: border-box;
            background-clip: content-box, border-box;
        }

        /* En-tête */
        .header {
            background: linear-gradient(135deg, #0066cc, #ff3300);
            padding: 30px 20px;
            text-align: center;
            color: white;
            border-bottom: 3px solid #40e0d0;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: white;
            border-bottom: 2px solid #e0e0e0;
        }

        .tab {
            flex: 1;
            padding: 15px;
            text-align: center;
            font-weight: 700;
            font-size: 1.1em;
            cursor: pointer;
            transition: all 0.3s ease;
            background: white;
            border: none;
            outline: none;
        }

        .tab.active {
            background: linear-gradient(135deg, #0066cc, #ff3300);
            color: white;
            border-bottom: 3px solid #40e0d0;
        }

        .tab:not(.active):hover {
            background: #f5f5f5;
            color: #0066cc;
        }

        /* Formulaires */
        .form-container {
            padding: 30px;
            transition: all 0.3s ease;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }

        .required::after {
            content: " *";
            color: #ff3300;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #0066cc;
            font-size: 1.2em;
            z-index: 1;
        }

        .toggle-password {
            position: absolute;
            right: 15px;
            cursor: pointer;
            color: #666;
            font-size: 1.2em;
            z-index: 1;
        }

        .toggle-password:hover {
            color: #0066cc;
        }

        input, select {
            width: 100%;
            padding: 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
            background: #f9f9f9;
        }

        select {
            padding: 12px 15px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }

        input:focus, select:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
            background: white;
        }

        input:hover, select:hover {
            border-color: #ff8c00;
        }

        /* Force du mot de passe */
        .password-strength {
            margin-top: 10px;
            height: 5px;
            border-radius: 5px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s ease;
        }

        .strength-text {
            font-size: 0.85em;
            margin-top: 5px;
            text-align: right;
        }

        /* Options */
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin: 20px 0;
            flex-wrap: wrap;
            gap: 10px;
        }

        .remember-me, .terms-checkbox {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .remember-me input, .terms-checkbox input {
            width: auto;
            padding: 0;
        }

        .remember-me label, .terms-checkbox label {
            margin-bottom: 0;
            font-weight: normal;
            font-size: 0.95em;
        }

        .forgot-password a {
            color: #0066cc;
            text-decoration: none;
            font-size: 0.95em;
            font-weight: 600;
        }

        .forgot-password a:hover {
            color: #ff3300;
            text-decoration: underline;
        }

        /* Bouton principal */
        .btn-primary {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0066cc, #ff3300);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
        }

        .btn-primary:active {
            transform: translateY(0);
        }

        .btn-primary::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-primary:hover::before {
            left: 100%;
        }

        .btn-primary.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn-primary.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: button-spin 0.8s linear infinite;
        }

        @keyframes button-spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        /* Séparateur */
        .separator {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .separator::before,
        .separator::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #0066cc, #ff3300, #40e0d0, #ff8c00, transparent);
        }

        .separator::before {
            left: 0;
        }

        .separator::after {
            right: 0;
        }

        .separator span {
            background: white;
            padding: 0 10px;
            color: #666;
            font-size: 0.9em;
        }

        /* Boutons sociaux */
        .social-login {
            display: flex;
            gap: 15px;
            margin: 20px 0;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: all 0.3s ease;
        }

        .social-btn:hover {
            border-color: #0066cc;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .social-btn.google { color: #DB4437; }
        .social-btn.facebook { color: #4267B2; }

        /* Message de statut */
        .status-message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                transform: translateY(-10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .status-message.success {
            background-color: #40e0d0;
            color: #0066cc;
            border: 2px solid #0066cc;
            display: block;
        }

        .status-message.error {
            background-color: #ff3300;
            color: white;
            border: 2px solid #ff8c00;
            display: block;
        }

        .status-message.info {
            background-color: #0066cc;
            color: white;
            border: 2px solid #40e0d0;
            display: block;
        }

        /* Pied de page */
        .footer {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #40e0d0, #ff8c00);
            color: white;
            font-size: 0.9em;
            border-top: 3px solid #0066cc;
        }

        .footer a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Grille pour le pays et la ville */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Validation visuelle */
        .input-valid {
            border-color: #40e0d0 !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2340e0d0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='20 6 9 17 4 12'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }

        .input-invalid {
            border-color: #ff3300 !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff3300' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='12' cy='12' r='10'%3e%3c/circle%3e%3cline x1='12' y1='8' x2='12' y2='12'%3e%3c/line%3e%3cline x1='12' y1='16' x2='12.01' y2='16'%3e%3c/line%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 10000;
            justify-content: center;
            align-items: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 20px;
            max-width: 400px;
            width: 90%;
            animation: modalSlideIn 0.3s ease;
        }

        @keyframes modalSlideIn {
            from {
                transform: translateY(-50px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal-header {
            background: linear-gradient(135deg, #0066cc, #ff3300);
            color: white;
            padding: 20px;
            border-radius: 20px 20px 0 0;
        }

        .modal-body {
            padding: 20px;
        }

        .modal-footer {
            padding: 20px;
            text-align: right;
            border-top: 1px solid #e0e0e0;
        }

        .modal-footer button {
            padding: 10px 20px;
            background: linear-gradient(135deg, #0066cc, #ff3300);
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .row {
                grid-template-columns: 1fr;
            }
            
            .form-container {
                padding: 20px;
            }
            
            .social-login {
                flex-direction: column;
            }
            
            .form-options {
                flex-direction: column;
                align-items: flex-start;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="loader"></div>
    </div>

    <!-- Conteneur principal -->
    <div class="container">
        <div class="header">
            <h1>AFRIMARKET</h1>
            <p>Bienvenue sur votre plateforme</p>
        </div>

        <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" id="loginTab" onclick="switchTab('login')">CONNEXION</button>
            <button class="tab" id="registerTab" onclick="switchTab('register')">INSCRIPTION</button>
        </div>

        <!-- Formulaire de connexion -->
        <div id="loginForm" class="form-container" style="display: block;">
            <form onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label for="loginEmail" class="required">Email ou WhatsApp</label>
                    <div class="input-group">
                        <span class="input-icon">📧</span>
                        <input type="text" id="loginEmail" name="email" placeholder="votre@email.com ou +221 77 123 45 67" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="loginPassword" class="required">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="loginPassword" name="password" placeholder="Entrez votre mot de passe" required>
                        <span class="toggle-password" onclick="togglePassword('loginPassword')">👁️</span>
                    </div>
                </div>

                <div class="form-options">
                    <div class="remember-me">
                        <input type="checkbox" id="rememberMe" name="remember">
                        <label for="rememberMe">Se souvenir de moi</label>
                    </div>
                    <div class="forgot-password">
                        <a href="#" onclick="showForgotPassword()">Mot de passe oublié ?</a>
                    </div>
                </div>

                <button type="submit" class="btn-primary" id="loginBtn">
                    SE CONNECTER
                </button>
            </form>

            <div class="separator">
                <span>ou connectez-vous avec</span>
            </div>

            <div class="social-login">
                <button class="social-btn google" onclick="socialLogin('google')">
                    <span style="font-weight: bold;">G</span> Google
                </button>
                <button class="social-btn facebook" onclick="socialLogin('facebook')">
                    <span style="font-weight: bold;">f</span> Facebook
                </button>
            </div>
        </div>

        <!-- Formulaire d'inscription -->
        <div id="registerForm" class="form-container" style="display: none;">
            <form onsubmit="handleRegister(event)">
                <div class="form-group">
                    <label for="registerNom" class="required">Nom complet</label>
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input type="text" id="registerNom" name="nom" placeholder="Entrez votre nom complet" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerWhatsapp" class="required">Numéro WhatsApp</label>
                    <div class="input-group">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="registerWhatsapp" name="whatsapp" placeholder="+221 77 123 45 67" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerEmail" class="required">Email</label>
                    <div class="input-group">
                        <span class="input-icon">📧</span>
                        <input type="email" id="registerEmail" name="email" placeholder="votre@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="registerPassword" class="required">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="registerPassword" name="password" placeholder="Créez un mot de passe" required>
                        <span class="toggle-password" onclick="togglePassword('registerPassword')">👁️</span>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Faible</div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="registerPays" class="required">Pays</label>
                        <select id="registerPays" name="pays" required>
                            <option value="">Sélectionnez</option>
                            <option value="senegal">Sénégal</option>
                            <option value="cote divoire">Côte d'Ivoire</option>
                            <option value="mali">Mali</option>
                            <option value="burkina faso">Burkina Faso</option>
                            <option value="cameroon">Cameroun</option>
                            <option value="maroc">Maroc</option>
                            <option value="tunisie">Tunisie</option>
                            <option value="algerie">Algérie</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="registerVille" class="required">Ville</label>
                        <div class="input-group">
                            <span class="input-icon">🏙️</span>
                            <input type="text" id="registerVille" name="ville" placeholder="Votre ville" required>
                        </div>
                    </div>
                </div>

                <div class="terms-checkbox">
                    <input type="checkbox" id="acceptTerms" name="terms" required>
                    <label for="acceptTerms">J'accepte les <a href="#">conditions</a> et la <a href="#">politique</a></label>
                </div>

                <button type="submit" class="btn-primary" id="registerBtn">
                    CRÉER MON COMPTE
                </button>
            </form>
        </div>

        <!-- Message de statut -->
        <div id="statusMessage" class="status-message"></div>

        <!-- Pied de page -->
        <div class="footer">
            <p>© 2024 Afrimarket - Tous droits réservés</p>
            <p><a href="#">Aide</a> | <a href="#">Contact</a></p>
        </div>
    </div>

    <!-- Modal Mot de passe oublié -->
    <div class="modal" id="forgotModal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Réinitialiser le mot de passe</h2>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 15px;">Entrez votre email pour recevoir un lien de réinitialisation.</p>
                <input type="email" id="resetEmail" placeholder="votre@email.com" style="width: 100%; padding: 12px; border: 2px solid #e0e0e0; border-radius: 8px;">
            </div>
            <div class="modal-footer">
                <button onclick="closeModal()" style="background: #666; margin-right: 10px;">Annuler</button>
                <button onclick="sendResetLink()">Envoyer</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://elgbvitijyjriozvzqpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM';

        // Initialisation de Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Gestion du loader
        setTimeout(() => {
            document.getElementById('loader').style.animation = 'fadeOut 0.5s ease forwards';
        }, 5000);

        // Switch entre les tabs
        function switchTab(tab) {
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const statusMessage = document.getElementById('statusMessage');
            
            statusMessage.style.display = 'none';
            
            if (tab === 'login') {
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
                loginForm.style.display = 'block';
                registerForm.style.display = 'none';
            } else {
                registerTab.classList.add('active');
                loginTab.classList.remove('active');
                registerForm.style.display = 'block';
                loginForm.style.display = 'none';
            }
        }

        // Afficher/Cacher mot de passe
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            const type = input.type === 'password' ? 'text' : 'password';
            input.type = type;
        }

        // Formatage WhatsApp
        document.getElementById('registerWhatsapp')?.addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 0) {
                if (value.length <= 2) {
                    value = '+' + value;
                } else if (value.length <= 5) {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2);
                } else if (value.length <= 8) {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2, 5) + ' ' + value.slice(5);
                } else {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2, 5) + ' ' + value.slice(5, 8) + ' ' + value.slice(8, 12);
                }
            }
            e.target.value = value;
        });

        // Force du mot de passe
        document.getElementById('registerPassword')?.addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]+/)) strength += 25;
            if (password.match(/[A-Z]+/)) strength += 25;
            if (password.match(/[0-9]+/)) strength += 15;
            if (password.match(/[$@#&!]+/)) strength += 10;
            
            strengthBar.style.width = strength + '%';
            
            if (strength < 30) {
                strengthBar.style.backgroundColor = '#ff3300';
                strengthText.textContent = 'Faible';
                strengthText.style.color = '#ff3300';
            } else if (strength < 60) {
                strengthBar.style.backgroundColor = '#ff8c00';
                strengthText.textContent = 'Moyen';
                strengthText.style.color = '#ff8c00';
            } else if (strength < 80) {
                strengthBar.style.backgroundColor = '#40e0d0';
                strengthText.textContent = 'Bon';
                strengthText.style.color = '#0066cc';
            } else {
                strengthBar.style.backgroundColor = '#0066cc';
                strengthText.textContent = 'Fort';
                strengthText.style.color = '#0066cc';
            }
        });

        // Validation email en temps réel
        document.getElementById('registerEmail')?.addEventListener('input', function(e) {
            const email = e.target.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (emailRegex.test(email)) {
                this.classList.add('input-valid');
                this.classList.remove('input-invalid');
            } else {
                this.classList.add('input-invalid');
                this.classList.remove('input-valid');
            }
        });

        // Gestion de la connexion
        async function handleLogin(event) {
            event.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const loginBtn = document.getElementById('loginBtn');
            
            if (!email || !password) {
                showStatus('Veuillez remplir tous les champs', 'error');
                return;
            }

            loginBtn.classList.add('loading');
            loginBtn.textContent = 'CONNEXION...';

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) throw error;

                showStatus('Connexion réussie ! Redirection...', 'success');
                
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 2000);

            } catch (error) {
                console.error('Erreur:', error);
                showStatus('Email ou mot de passe incorrect', 'error');
            } finally {
                loginBtn.classList.remove('loading');
                loginBtn.textContent = 'SE CONNECTER';
            }
        }

        // Gestion de l'inscription
        async function handleRegister(event) {
            event.preventDefault();
            
            const formData = {
                nom: document.getElementById('registerNom').value,
                whatsapp: document.getElementById('registerWhatsapp').value,
                email: document.getElementById('registerEmail').value,
                password: document.getElementById('registerPassword').value,
                pays: document.getElementById('registerPays').value,
                ville: document.getElementById('registerVille').value
            };

            const registerBtn = document.getElementById('registerBtn');

            // Validations
            if (!formData.nom || !formData.whatsapp || !formData.email || !formData.password || !formData.pays || !formData.ville) {
                showStatus('Veuillez remplir tous les champs', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(formData.email)) {
                showStatus('Email invalide', 'error');
                return;
            }

            if (formData.password.length < 6) {
                showStatus('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            if (!document.getElementById('acceptTerms').checked) {
                showStatus('Vous devez accepter les conditions', 'error');
                return;
            }

            registerBtn.classList.add('loading');
            registerBtn.textContent = 'INSCRIPTION...';

            try {
                // Inscription dans Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: formData.email,
                    password: formData.password,
                    options: {
                        data: {
                            nom_complet: formData.nom,
                            whatsapp: formData.whatsapp,
                            pays: formData.pays,
                            ville: formData.ville
                        }
                    }
                });

                if (authError) throw authError;

                // Insertion dans la table utilisateurs
                const { error: userError } = await supabase
                    .from('utilisateurs')
                    .insert([{
                        id: authData.user.id,
                        nom_complet: formData.nom,
                        whatsapp: formData.whatsapp,
                        email: formData.email,
                        password: formData.password,
                        pays: formData.pays,
                        ville: formData.ville
                    }]);

                if (userError) throw userError;

                showStatus('Inscription réussie ! Vérifiez votre email', 'success');
                
                setTimeout(() => {
                    switchTab('login');
                }, 3000);

            } catch (error) {
                console.error('Erreur:', error);
                
                if (error.message.includes('already registered')) {
                    showStatus('Cet email est déjà utilisé', 'error');
                } else {
                    showStatus('Erreur lors de l\'inscription', 'error');
                }
            } finally {
                registerBtn.classList.remove('loading');
                registerBtn.textContent = 'CRÉER MON COMPTE';
            }
        }

        // Connexion sociale
        async function socialLogin(provider) {
            try {
                const { error } = await supabase.auth.signInWithOAuth({
                    provider: provider,
                    options: {
                        redirectTo: window.location.origin + '/dashboard.html'
                    }
                });
                
                if (error) throw error;
            } catch (error) {
                console.error('Erreur:', error);
                showStatus(`Erreur de connexion avec ${provider}`, 'error');
            }
        }

        // Mot de passe oublié
        function showForgotPassword() {
            document.getElementById('forgotModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('forgotModal').classList.remove('active');
        }

        async function sendResetLink() {
            const email = document.getElementById('resetEmail').value;
            
            if (!email) {
                alert('Veuillez entrer votre email');
                return;
            }

            try {
                const { error } = await supabase.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/reset-password.html',
                });

                if (error) throw error;

                alert('Lien de réinitialisation envoyé !');
                closeModal();
            } catch (error) {
                console.error('Erreur:', error);
                alert('Erreur lors de l\'envoi');
            }
        }

        // Afficher les messages
        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = `status-message ${type}`;
            statusMessage.textContent = message;
            
            setTimeout(() => {
                statusMessage.style.display = 'none';
            }, 5000);
        }

        // Vérifier la session
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                window.location.href = 'dashboard.html';
            }
        }

        // Initialisation
        checkSession();

        // Fermer le modal en cliquant à l'extérieur
        window.onclick = function(event) {
            const modal = document.getElementById('forgotModal');
            if (event.target === modal) {
                closeModal();
            }
        }
    </script>
</body>
</html>
