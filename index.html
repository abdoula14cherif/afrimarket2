<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Plateforme de petites annonces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0066cc 0%, #ff3300 50%, #40e0d0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Loader overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease 5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0066cc;
            border-right: 5px solid #ff3300;
            border-bottom: 5px solid #40e0d0;
            border-left: 5px solid #ff8c00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Container principal */
        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 3px solid transparent;
            background-image: linear-gradient(white, white), 
                              linear-gradient(135deg, #0066cc, #ff3300, #40e0d0, #ff8c00);
            background-origin: border-box;
            background-clip: content-box, border-box;
        }

        /* En-tête */
        .header {
            background: linear-gradient(135deg, #0066cc, #ff3300);
            padding: 30px 20px;
            text-align: center;
            color: white;
            border-bottom: 3px solid #40e0d0;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
            color: #ffffff;
        }

        /* Formulaire */
        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }

        .required::after {
            content: " *";
            color: #ff3300;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus, select:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        input:hover, select:hover {
            border-color: #ff8c00;
        }

        /* Style spécifique pour les inputs */
        input[type="tel"], input[type="email"], input[type="password"] {
            background-color: #f9f9f9;
        }

        /* Grille pour le pays et la ville */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Bouton de soumission */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0066cc, #ff3300);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        /* Message de statut */
        .status-message {
            margin-top: 15px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status-message.success {
            background-color: #40e0d0;
            color: #0066cc;
            border: 2px solid #0066cc;
            display: block;
        }

        .status-message.error {
            background-color: #ff3300;
            color: white;
            border: 2px solid #ff8c00;
            display: block;
        }

        /* Pied de page */
        .footer {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #40e0d0, #ff8c00);
            color: white;
            font-size: 0.9em;
            border-top: 3px solid #0066cc;
        }

        .footer a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .row {
                grid-template-columns: 1fr;
            }
            
            .form-container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="loader"></div>
    </div>

    <!-- Conteneur principal -->
    <div class="container">
        <div class="header">
            <h1>AFRIMARKET</h1>
            <p>Votre plateforme de petites annonces</p>
        </div>

        <div class="form-container">
            <form id="registrationForm">
                <div class="form-group">
                    <label for="nomComplet" class="required">Nom complet</label>
                    <input type="text" id="nomComplet" name="nomComplet" placeholder="Entrez votre nom complet" required>
                </div>

                <div class="form-group">
                    <label for="whatsapp" class="required">Numéro WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" placeholder="+221 77 123 45 67" required>
                </div>

                <div class="form-group">
                    <label for="email" class="required">Email</label>
                    <input type="email" id="email" name="email" placeholder="votre@email.com" required>
                </div>

                <div class="form-group">
                    <label for="password" class="required">Mot de passe</label>
                    <input type="password" id="password" name="password" placeholder="Créez un mot de passe sécurisé" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="pays" class="required">Pays</label>
                        <select id="pays" name="pays" required>
                            <option value="">Sélectionnez un pays</option>
                            <option value="senegal">Sénégal</option>
                            <option value="cote divoire">Côte d'Ivoire</option>
                            <option value="mali">Mali</option>
                            <option value="burkina faso">Burkina Faso</option>
                            <option value="cameroon">Cameroun</option>
                            <option value="maroc">Maroc</option>
                            <option value="tunisie">Tunisie</option>
                            <option value="algerie">Algérie</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ville" class="required">Ville</label>
                        <input type="text" id="ville" name="ville" placeholder="Votre ville" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    S'INSCRIRE SUR AFRIMARKET
                </button>
            </form>

            <div id="statusMessage" class="status-message"></div>
        </div>

        <div class="footer">
            <p>© 2024 Afrimarket - Tous droits réservés</p>
            <p><a href="#">Conditions d'utilisation</a> | <a href="#">Politique de confidentialité</a></p>
        </div>
    </div>

    <script>

        // Initialisation de Supabase (à décommenter quand vous installez la librairie)
        // const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Gestion du loader (disparaît après 5 secondes)
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.animation = 'fadeOut 0.5s ease forwards';
            }
        }, 5000);

        // Gestion du formulaire
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            // Récupération des données du formulaire
            const formData = {
                nom_complet: document.getElementById('nomComplet').value,
                whatsapp: document.getElementById('whatsapp').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                pays: document.getElementById('pays').value,
                ville: document.getElementById('ville').value,
                created_at: new Date().toISOString()
            };

            // Validation basique
            if (!formData.nom_complet || !formData.whatsapp || !formData.email || !formData.password || !formData.pays || !formData.ville) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = 'Veuillez remplir tous les champs obligatoires.';
                return;
            }

            // Validation email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(formData.email)) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = 'Veuillez entrer une adresse email valide.';
                return;
            }

            // Validation mot de passe (minimum 6 caractères)
            if (formData.password.length < 6) {
                statusMessage.className = 'status-message error';
                statusMessage.textContent = 'Le mot de passe doit contenir au moins 6 caractères.';
                return;
            }

            // Simulation d'envoi (à remplacer par l'appel Supabase réel)

            submitBtn.textContent = 'Inscription en cours...';
            
            try {
                // Simulation d'un délai réseau
                await new Promise(resolve => setTimeout(resolve, 2000));

                // Pour l'instant, on simule une réussite
                console.log('Données à envoyer à Supabase:', formData);
                
                // Code réel pour Supabase (à décommenter quand vous aurez créé la table)
                /*
                const { data, error } = await supabase
                    .from('utilisateurs')
                    .insert([formData]);

                if (error) throw error;
                */

                // Message de succès
                statusMessage.className = 'status-message success';
                statusMessage.textContent = 'Inscription réussie ! Bienvenue sur Afrimarket.';
                
                // Réinitialisation du formulaire
                this.reset();

            } catch (error) {
                console.error('Erreur:', error);
                statusMessage.className = 'status-message error';
                statusMessage.textContent = 'Une erreur est survenue. Veuillez réessayer.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'S\'INSCRIRE SUR AFRIMARKET';
            }
        });

        // Validation en temps réel pour le numéro WhatsApp
        document.getElementById('whatsapp').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 0) {
                if (value.length <= 2) {
                    value = '+' + value;
                } else if (value.length <= 5) {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2);
                } else if (value.length <= 8) {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2, 5) + ' ' + value.slice(5);
                } else {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2, 5) + ' ' + value.slice(5, 8) + ' ' + value.slice(8, 12);
                }
            }
            e.target.value = value;
        });

        // Animation supplémentaire au focus
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
                this.parentElement.style.transition = 'transform 0.3s ease';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });
    </script>

</html>
