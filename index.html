<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0066cc 0%, #ff3300 50%, #40e0d0 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Loader overlay */
        .loader-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            animation: fadeOut 0.5s ease 5s forwards;
        }

        @keyframes fadeOut {
            to {
                opacity: 0;
                visibility: hidden;
            }
        }

        .loader {
            width: 80px;
            height: 80px;
            border: 5px solid #f3f3f3;
            border-top: 5px solid #0066cc;
            border-right: 5px solid #ff3300;
            border-bottom: 5px solid #40e0d0;
            border-left: 5px solid #ff8c00;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Container principal */
        .container {
            width: 100%;
            max-width: 550px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            position: relative;
            z-index: 1;
            border: 3px solid transparent;
            background-image: linear-gradient(white, white), 
                              linear-gradient(135deg, #0066cc, #ff3300, #40e0d0, #ff8c00);
            background-origin: border-box;
            background-clip: content-box, border-box;
        }

        /* En-tête */
        .header {
            background: linear-gradient(135deg, #0066cc, #ff3300);
            padding: 30px 20px;
            text-align: center;
            color: white;
            border-bottom: 3px solid #40e0d0;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 5px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
            letter-spacing: 2px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
            color: #ffffff;
        }

        /* Formulaire */
        .form-container {
            padding: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 0.95em;
        }

        .required::after {
            content: " *";
            color: #ff3300;
        }

        .input-group {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 15px;
            color: #0066cc;
            font-size: 1.2em;
        }

        input, select {
            width: 100%;
            padding: 12px 15px 12px 45px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1em;
            transition: all 0.3s ease;
            outline: none;
            background-color: #f9f9f9;
        }

        select {
            padding: 12px 15px;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='currentColor' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 15px;
        }

        input:focus, select:focus {
            border-color: #0066cc;
            box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
        }

        input:hover, select:hover {
            border-color: #ff8c00;
        }

        /* Force du mot de passe */
        .password-strength {
            margin-top: 10px;
            height: 5px;
            border-radius: 5px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s ease, background-color 0.3s ease;
        }

        .strength-text {
            font-size: 0.85em;
            margin-top: 5px;
            text-align: right;
        }

        /* Grille pour le pays et la ville */
        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        /* Checkbox des conditions */
        .terms-checkbox {
            display: flex;
            align-items: flex-start;
            gap: 10px;
            margin: 20px 0;
        }

        .terms-checkbox input {
            width: auto;
            padding: 0;
            margin-top: 3px;
        }

        .terms-checkbox label {
            margin-bottom: 0;
            font-weight: normal;
            font-size: 0.95em;
        }

        .terms-checkbox a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }

        .terms-checkbox a:hover {
            color: #ff3300;
            text-decoration: underline;
        }

        /* Bouton d'inscription */
        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #0066cc, #ff3300);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.2em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .btn-submit:hover::before {
            left: 100%;
        }

        .btn-submit.loading {
            pointer-events: none;
            opacity: 0.7;
        }

        .btn-submit.loading::after {
            content: '';
            position: absolute;
            width: 20px;
            height: 20px;
            top: 50%;
            right: 20px;
            transform: translateY(-50%);
            border: 2px solid white;
            border-top-color: transparent;
            border-radius: 50%;
            animation: button-spin 0.8s linear infinite;
        }

        @keyframes button-spin {
            to { transform: translateY(-50%) rotate(360deg); }
        }

        /* Séparateur */
        .separator {
            text-align: center;
            margin: 20px 0;
            position: relative;
        }

        .separator::before,
        .separator::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 45%;
            height: 1px;
            background: linear-gradient(90deg, transparent, #0066cc, #ff3300, #40e0d0, #ff8c00, transparent);
        }

        .separator::before {
            left: 0;
        }

        .separator::after {
            right: 0;
        }

        .separator span {
            background: white;
            padding: 0 10px;
            color: #666;
            font-size: 0.9em;
        }

        /* Bouton de connexion */
        .btn-login {
            width: 100%;
            padding: 12px;
            background: white;
            color: #0066cc;
            border: 2px solid #0066cc;
            border-radius: 10px;
            font-size: 1.1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-block;
            text-align: center;
        }

        .btn-login:hover {
            background: linear-gradient(135deg, #0066cc, #ff3300);
            color: white;
            border-color: transparent;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 102, 204, 0.3);
        }

        /* Message de statut */
        .status-message {
            margin: 15px 0;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .status-message.success {
            background-color: #40e0d0;
            color: #0066cc;
            border: 2px solid #0066cc;
            display: block;
        }

        .status-message.error {
            background-color: #ff3300;
            color: white;
            border: 2px solid #ff8c00;
            display: block;
        }

        .status-message.info {
            background-color: #0066cc;
            color: white;
            border: 2px solid #40e0d0;
            display: block;
        }

        /* Pied de page */
        .footer {
            text-align: center;
            padding: 20px;
            background: linear-gradient(135deg, #40e0d0, #ff8c00);
            color: white;
            font-size: 0.9em;
            border-top: 3px solid #0066cc;
        }

        .footer a {
            color: #0066cc;
            text-decoration: none;
            font-weight: 600;
        }

        .footer a:hover {
            text-decoration: underline;
        }

        /* Responsive */
        @media (max-width: 600px) {
            .container {
                margin: 10px;
            }
            
            .header h1 {
                font-size: 2em;
            }
            
            .row {
                grid-template-columns: 1fr;
            }
            
            .form-container {
                padding: 20px;
            }
        }

        /* Animation de validation */
        .input-valid {
            border-color: #40e0d0 !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2340e0d0' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='20 6 9 17 4 12'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }

        .input-invalid {
            border-color: #ff3300 !important;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23ff3300' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'%3e%3ccircle cx='12' cy='12' r='10'%3e%3c/circle%3e%3cline x1='12' y1='8' x2='12' y2='12'%3e%3c/line%3e%3cline x1='12' y1='16' x2='12.01' y2='16'%3e%3c/line%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 15px center;
            background-size: 20px;
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader-overlay" id="loader">
        <div class="loader"></div>
    </div>

    <!-- Conteneur principal -->
    <div class="container">
        <div class="header">
            <h1>AFRIMARKET</h1>
            <p>Créez votre compte gratuitement</p>
        </div>

        <div class="form-container">
            <!-- Formulaire d'inscription -->
            <form id="registrationForm">
                <div class="form-group">
                    <label for="nomComplet" class="required">Nom complet</label>
                    <div class="input-group">
                        <span class="input-icon">👤</span>
                        <input type="text" id="nomComplet" name="nomComplet" placeholder="Entrez votre nom complet" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="whatsapp" class="required">Numéro WhatsApp</label>
                    <div class="input-group">
                        <span class="input-icon">📱</span>
                        <input type="tel" id="whatsapp" name="whatsapp" placeholder="+221 77 123 45 67" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="email" class="required">Email</label>
                    <div class="input-group">
                        <span class="input-icon">📧</span>
                        <input type="email" id="email" name="email" placeholder="votre@email.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password" class="required">Mot de passe</label>
                    <div class="input-group">
                        <span class="input-icon">🔒</span>
                        <input type="password" id="password" name="password" placeholder="Créez un mot de passe sécurisé" required>
                    </div>
                    <div class="password-strength">
                        <div class="strength-bar" id="strengthBar"></div>
                    </div>
                    <div class="strength-text" id="strengthText">Faible</div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label for="pays" class="required">Pays</label>
                        <select id="pays" name="pays" required>
                            <option value="">Sélectionnez</option>
                            <option value="senegal">Sénégal</option>
                            <option value="cote divoire">Côte d'Ivoire</option>
                            <option value="mali">Mali</option>
                            <option value="burkina faso">Burkina Faso</option>
                            <option value="cameroon">Cameroun</option>
                            <option value="maroc">Maroc</option>
                            <option value="tunisie">Tunisie</option>
                            <option value="algerie">Algérie</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="ville" class="required">Ville</label>
                        <div class="input-group">
                            <span class="input-icon">🏙️</span>
                            <input type="text" id="ville" name="ville" placeholder="Votre ville" required>
                        </div>
                    </div>
                </div>

                <div class="terms-checkbox">
                    <input type="checkbox" id="terms" name="terms" required>
                    <label for="terms">J'accepte les <a href="#">conditions d'utilisation</a> et la <a href="#">politique de confidentialité</a></label>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    CRÉER MON COMPTE
                </button>
            </form>

            <!-- Message de statut -->
            <div id="statusMessage" class="status-message"></div>

            <div class="separator">
                <span>déjà inscrit ?</span>
            </div>

            <!-- Bouton de connexion -->
            <a href="connexion.html" class="btn-login">
                SE CONNECTER
            </a>
        </div>

        <div class="footer">
            <p>© 2024 Afrimarket - Tous droits réservés</p>
            <p><a href="#">Conditions d'utilisation</a> | <a href="#">Politique de confidentialité</a></p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://elgbvitijyjriozvzqpf.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM';

        // Initialisation de Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Gestion du loader
        setTimeout(() => {
            const loader = document.getElementById('loader');
            if (loader) {
                loader.style.animation = 'fadeOut 0.5s ease forwards';
            }
        }, 5000);

        // Formatage du numéro WhatsApp
        document.getElementById('whatsapp').addEventListener('input', function(e) {
            let value = e.target.value.replace(/\D/g, '');
            if (value.length > 0) {
                if (value.length <= 2) {
                    value = '+' + value;
                } else if (value.length <= 5) {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2);
                } else if (value.length <= 8) {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2, 5) + ' ' + value.slice(5);
                } else {
                    value = '+' + value.slice(0, 2) + ' ' + value.slice(2, 5) + ' ' + value.slice(5, 8) + ' ' + value.slice(8, 12);
                }
            }
            e.target.value = value;
        });

        // Vérification de la force du mot de passe
        document.getElementById('password').addEventListener('input', function(e) {
            const password = e.target.value;
            const strengthBar = document.getElementById('strengthBar');
            const strengthText = document.getElementById('strengthText');
            
            let strength = 0;
            
            if (password.length >= 8) strength += 25;
            if (password.match(/[a-z]+/)) strength += 25;
            if (password.match(/[A-Z]+/)) strength += 25;
            if (password.match(/[0-9]+/)) strength += 15;
            if (password.match(/[$@#&!]+/)) strength += 10;
            
            strengthBar.style.width = strength + '%';
            
            if (strength < 30) {
                strengthBar.style.backgroundColor = '#ff3300';
                strengthText.textContent = 'Faible';
                strengthText.style.color = '#ff3300';
            } else if (strength < 60) {
                strengthBar.style.backgroundColor = '#ff8c00';
                strengthText.textContent = 'Moyen';
                strengthText.style.color = '#ff8c00';
            } else if (strength < 80) {
                strengthBar.style.backgroundColor = '#40e0d0';
                strengthText.textContent = 'Bon';
                strengthText.style.color = '#0066cc';
            } else {
                strengthBar.style.backgroundColor = '#0066cc';
                strengthText.textContent = 'Fort';
                strengthText.style.color = '#0066cc';
            }
        });

        // Validation en temps réel
        document.getElementById('email').addEventListener('input', function(e) {
            const email = e.target.value;
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (emailRegex.test(email)) {
                this.classList.add('input-valid');
                this.classList.remove('input-invalid');
            } else {
                this.classList.add('input-invalid');
                this.classList.remove('input-valid');
            }
        });

        // Gestion de l'inscription
        document.getElementById('registrationForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const statusMessage = document.getElementById('statusMessage');
            
            // Récupération des données
            const formData = {
                nom_complet: document.getElementById('nomComplet').value,
                whatsapp: document.getElementById('whatsapp').value,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value,
                pays: document.getElementById('pays').value,
                ville: document.getElementById('ville').value
            };

            // Validation
            if (!formData.nom_complet || !formData.whatsapp || !formData.email || !formData.password || !formData.pays || !formData.ville) {
                showStatus('Veuillez remplir tous les champs obligatoires.', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(formData.email)) {
                showStatus('Veuillez entrer une adresse email valide.', 'error');
                return;
            }

            if (formData.password.length < 6) {
                showStatus('Le mot de passe doit contenir au moins 6 caractères.', 'error');
                return;
            }

            if (!document.getElementById('terms').checked) {
                showStatus('Vous devez accepter les conditions d\'utilisation.', 'error');
                return;
            }

            // Désactiver le bouton
            submitBtn.classList.add('loading');
            submitBtn.textContent = 'CRÉATION EN COURS...';
            
            try {
                // 1. Créer l'utilisateur dans Supabase Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: formData.email,
                    password: formData.password,
                    options: {
                        data: {
                            nom_complet: formData.nom_complet,
                            whatsapp: formData.whatsapp,
                            pays: formData.pays,
                            ville: formData.ville
                        }
                    }
                });

                if (authError) throw authError;

                // 2. Ajouter les informations supplémentaires dans la table utilisateurs
                const { data: userData, error: userError } = await supabase
                    .from('utilisateurs')
                    .insert([
                        {
                            id: authData.user.id,
                            nom_complet: formData.nom_complet,
                            whatsapp: formData.whatsapp,
                            email: formData.email,
                            password: formData.password, // Note: En production, ne stockez pas le mot de passe en clair
                            pays: formData.pays,
                            ville: formData.ville,
                            created_at: new Date().toISOString()
                        }
                    ]);

                if (userError) throw userError;

                // Succès
                showStatus('Inscription réussie ! Vérifiez votre email pour confirmer votre compte.', 'success');
                
                // Réinitialiser le formulaire
                this.reset();
                
                // Redirection après 3 secondes
                setTimeout(() => {
                    window.location.href = 'connexion.html';
                }, 3000);

            } catch (error) {
                console.error('Erreur:', error);
                
                let errorMessage = 'Une erreur est survenue. Veuillez réessayer.';
                
                if (error.message.includes('duplicate key') || error.message.includes('already registered')) {
                    errorMessage = 'Cet email est déjà utilisé. Veuillez vous connecter.';
                } else if (error.message.includes('password')) {
                    errorMessage = 'Le mot de passe n\'est pas assez sécurisé.';
                }
                
                showStatus(errorMessage, 'error');
            } finally {
                submitBtn.classList.remove('loading');
                submitBtn.textContent = 'CRÉER MON COMPTE';
            }
        });

        // Fonction pour afficher les messages
        function showStatus(message, type) {
            const statusMessage = document.getElementById('statusMessage');
            statusMessage.className = `status-message ${type}`;
            statusMessage.textContent = message;
            
            // Auto-cacher après 5 secondes pour les messages de succès
            if (type === 'success') {
                setTimeout(() => {
                    statusMessage.style.display = 'none';
                }, 5000);
            }
        }

        // Animation au focus
        const inputs = document.querySelectorAll('input, select');
        inputs.forEach(input => {
            input.addEventListener('focus', function() {
                this.parentElement.style.transform = 'scale(1.02)';
                this.parentElement.style.transition = 'transform 0.3s ease';
            });
            
            input.addEventListener('blur', function() {
                this.parentElement.style.transform = 'scale(1)';
            });
        });

        // Vérifier si l'utilisateur est déjà connecté
        async function checkSession() {
            const { data: { session } } = await supabase.auth.getSession();
            if (session) {
                // Proposer de se déconnecter ou rediriger
                console.log('Utilisateur déjà connecté');
            }
        }

        checkSession();
    </script>
</body>
</html>
