<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Inscription</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Loader styles */
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #ff6b6b, #40e0d0, #ffa500);
            background-size: 400% 400%;
            animation: gradientBG 3s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }

        .loader-wrapper.hidden {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }

        .loader {
            text-align: center;
            color: white;
        }

        .loader-circle {
            width: 100px;
            height: 100px;
            border: 6px solid rgba(255, 255, 255, 0.3);
            border-top: 6px solid #ff6b6b;
            border-right: 6px solid #40e0d0;
            border-bottom: 6px solid #ffa500;
            border-left: 6px solid #1e3c72;
            border-radius: 50%;
            margin: 0 auto 30px;
            animation: spin 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55) infinite;
        }

        .loader h2 {
            font-size: 36px;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 3px;
        }

        .loader p {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 30px;
        }

        .progress-bar {
            width: 300px;
            height: 6px;
            background: rgba(255,255,255,0.2);
            border-radius: 10px;
            overflow: hidden;
            margin: 20px auto;
        }

        .progress {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff6b6b, #40e0d0, #ffa500);
            border-radius: 10px;
            animation: progress 5s linear forwards;
        }

        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Main content styles */
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            margin: 0;
        }

        .container {
            max-width: 550px;
            width: 100%;
            opacity: 0;
            transform: translateY(30px);
            transition: opacity 0.8s ease, transform 0.8s ease;
        }

        .container.visible {
            opacity: 1;
            transform: translateY(0);
        }

        .form-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 48px;
            margin-bottom: 10px;
            background: linear-gradient(45deg, #1e3c72, #ff6b6b, #40e0d0, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .header p {
            color: #666;
            font-size: 16px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: white;
        }

        .form-group input:focus, .form-group select:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 0 3px rgba(255,107,107,0.1);
        }

        .form-group input:hover, .form-group select:hover {
            border-color: #40e0d0;
        }

        .form-group input.error {
            border-color: #ff4444;
        }

        .form-group input.valid {
            border-color: #44ff44;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .btn-submit {
            width: 100%;
            padding: 15px;
            background: linear-gradient(45deg, #1e3c72, #2a5298, #ff6b6b, #40e0d0, #ffa500);
            background-size: 300% 300%;
            animation: gradientMove 5s ease infinite;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s, opacity 0.3s;
            margin-top: 20px;
            letter-spacing: 1px;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-submit:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .btn-submit:active:not(:disabled) {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.success {
            display: block;
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            display: block;
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }

        .login-link a {
            color: #ff6b6b;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s;
        }

        .login-link a:hover {
            color: #40e0d0;
            text-decoration: underline;
        }

        .color-bar {
            display: flex;
            height: 5px;
            margin-top: 30px;
            border-radius: 5px;
            overflow: hidden;
        }

        .color-bar span {
            flex: 1;
            height: 100%;
        }

        .color-blue { background: #1e3c72; }
        .color-red { background: #ff6b6b; }
        .color-turquoise { background: #40e0d0; }
        .color-orange { background: #ffa500; }
        .color-white { background: #ffffff; }

        /* Password strength indicator */
        .password-strength {
            margin-top: 10px;
            height: 5px;
            border-radius: 5px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .strength-bar {
            height: 100%;
            width: 0;
            transition: width 0.3s, background 0.3s;
        }

        .strength-text {
            font-size: 12px;
            margin-top: 5px;
            text-align: right;
        }

        /* Toggle password visibility */
        .toggle-password {
            position: absolute;
            right: 15px;
            top: 45px;
            cursor: pointer;
            color: #999;
            user-select: none;
            font-size: 20px;
        }

        .toggle-password:hover {
            color: #ff6b6b;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .form-card {
                padding: 20px;
            }

            .row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .header h1 {
                font-size: 32px;
            }

            .loader h2 {
                font-size: 28px;
            }

            .progress-bar {
                width: 250px;
            }
        }
    </style>
</head>
<body>
    <!-- Loader - Disparaît après 5 secondes -->
    <div class="loader-wrapper" id="loader">
        <div class="loader">
            <div class="loader-circle"></div>
            <h2>AFRIMARKET</h2>
            <p>Préparation de votre plateforme d'annonces...</p>
            <div class="progress-bar">
                <div class="progress"></div>
            </div>
            <p style="font-size: 14px; margin-top: 15px;" id="timer">5 secondes</p>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container" id="mainContent">
        <div class="form-card">
            <div class="header">
                <h1>AFRIMARKET</h1>
                <p>Créez votre compte pour publier vos annonces</p>
            </div>

            <form id="registerForm" novalidate>
                <div class="form-group">
                    <label>Nom complet *</label>
                    <input type="text" id="fullName" placeholder="Entrez votre nom complet" required>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>WhatsApp *</label>
                        <input type="tel" id="whatsapp" placeholder="+225 XX XX XX XX" required>
                    </div>

                    <div class="form-group">
                        <label>Email *</label>
                        <input type="email" id="email" placeholder="votre@email.com" required>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Mot de passe *</label>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePassword('password')">👁️</span>
                        <div class="password-strength">
                            <div class="strength-bar" id="strengthBar"></div>
                        </div>
                        <div class="strength-text" id="strengthText"></div>
                    </div>

                    <div class="form-group">
                        <label>Confirmer *</label>
                        <input type="password" id="confirmPassword" placeholder="••••••••" required>
                        <span class="toggle-password" onclick="togglePassword('confirmPassword')">👁️</span>
                    </div>
                </div>

                <div class="row">
                    <div class="form-group">
                        <label>Pays *</label>
                        <select id="country" required>
                            <option value="">Sélectionnez</option>
                            <option value="Côte d'Ivoire">Côte d'Ivoire</option>
                            <option value="Sénégal">Sénégal</option>
                            <option value="Mali">Mali</option>
                            <option value="Burkina Faso">Burkina Faso</option>
                            <option value="Cameroun">Cameroun</option>
                            <option value="Togo">Togo</option>
                            <option value="Bénin">Bénin</option>
                            <option value="Guinée">Guinée</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Ville *</label>
                        <input type="text" id="city" placeholder="Votre ville" required>
                    </div>
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">
                    CRÉER MON COMPTE
                </button>

                <div class="message" id="message"></div>

                <div class="login-link">
                    Déjà un compte ? <a href="login.html">Se connecter</a>
                </div>

                <div class="color-bar">
                    <span class="color-blue"></span>
                    <span class="color-red"></span>
                    <span class="color-turquoise"></span>
                    <span class="color-orange"></span>
                    <span class="color-white"></span>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Configuration Supabase
        const supabaseUrl = 'https://elgbvitijyjriozvzqpf.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM';
        
        const supabase = supabase.createClient(supabaseUrl, supabaseKey);

        // Gestion du loader - Disparaît après 5 secondes
        document.addEventListener('DOMContentLoaded', function() {
            // Timer countdown
            let seconds = 5;
            const timerElement = document.getElementById('timer');
            const loader = document.getElementById('loader');
            const mainContent = document.getElementById('mainContent');
            
            // Cacher le formulaire au départ
            mainContent.style.opacity = '0';
            
            const countdown = setInterval(() => {
                seconds--;
                if (seconds > 0) {
                    timerElement.textContent = seconds + ' seconde' + (seconds > 1 ? 's' : '');
                }
            }, 1000);

            // Cacher le loader après 5 secondes
            setTimeout(() => {
                clearInterval(countdown);
                loader.classList.add('hidden');
                mainContent.style.opacity = '1';
                mainContent.style.transform = 'translateY(0)';
                timerElement.textContent = 'Prêt !';
            }, 5000);
        });

        // Fonction pour afficher/masquer le mot de passe
        window.togglePassword = function(inputId) {
            const input = document.getElementById(inputId);
            const type = input.getAttribute('type') === 'password' ? 'text' : 'password';
            input.setAttribute('type', type);
            
            // Changer l'icône
            const toggle = event.target;
            toggle.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
        };

        // Validation du formulaire en temps réel
        document.getElementById('fullName').addEventListener('input', validateFullName);
        document.getElementById('email').addEventListener('input', validateEmail);
        document.getElementById('password').addEventListener('input', validatePassword);
        document.getElementById('confirmPassword').addEventListener('input', validateConfirmPassword);
        document.getElementById('whatsapp').addEventListener('input', formatWhatsApp);
        document.getElementById('city').addEventListener('input', capitalizeFirstLetter);

        function validateFullName() {
            const input = document.getElementById('fullName');
            const value = input.value.trim();
            
            // Capitaliser la première lettre de chaque mot
            let capitalized = value.replace(/\b\w/g, l => l.toUpperCase());
            input.value = capitalized;
            
            if (value.length < 2) {
                input.classList.add('error');
                input.classList.remove('valid');
            } else {
                input.classList.remove('error');
                input.classList.add('valid');
            }
        }

        function validateEmail() {
            const input = document.getElementById('email');
            const email = input.value.trim();
            const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            
            if (!re.test(email)) {
                input.classList.add('error');
                input.classList.remove('valid');
            } else {
                input.classList.remove('error');
                input.classList.add('valid');
            }
        }

        function validatePassword() {
            const password = document.getElementById('password').value;
            const strength = checkPasswordStrength(password);
            updatePasswordStrength(strength, password);
            
            // Vérifier aussi la confirmation si elle existe
            if (document.getElementById('confirmPassword').value) {
                validateConfirmPassword();
            }
        }

        function validateConfirmPassword() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword');
            
            if (confirm.value.length > 0) {
                if (password === confirm.value) {
                    confirm.classList.remove('error');
                    confirm.classList.add('valid');
                } else {
                    confirm.classList.add('error');
                    confirm.classList.remove('valid');
                }
            } else {
                confirm.classList.remove('error', 'valid');
            }
        }

        function formatWhatsApp() {
            const input = document.getElementById('whatsapp');
            let x = input.value.replace(/\D/g, '').match(/(\d{0,3})(\d{0,2})(\d{0,2})(\d{0,2})/);
            input.value = !x[2] ? x[1] : '+' + x[1] + ' ' + x[2] + (x[3] ? ' ' + x[3] : '') + (x[4] ? ' ' + x[4] : '');
        }

        function capitalizeFirstLetter() {
            const input = document.getElementById('city');
            let value = input.value;
            value = value.replace(/\b\w/g, l => l.toUpperCase());
            input.value = value;
        }

        function checkPasswordStrength(password) {
            let strength = 0;
            if (password.length >= 8) strength++;
            if (password.match(/[a-z]+/)) strength++;
            if (password.match(/[A-Z]+/)) strength++;
            if (password.match(/[0-9]+/)) strength++;
            if (password.match(/[$@#&!]+/)) strength++;
            return strength;
        }

        function updatePasswordStrength(strength, password) {
            const bar = document.getElementById('strengthBar');
            const text = document.getElementById('strengthText');
            
            const strengths = ['Très faible', 'Faible', 'Moyen', 'Bon', 'Fort'];
            const colors = ['#ff4444', '#ff7744', '#ffaa44', '#44ff77', '#44aaff'];
            
            let index = Math.min(strength, 4);
            
            bar.style.width = (index + 1) * 20 + '%';
            bar.style.background = colors[index];
            
            if (password.length > 0) {
                text.textContent = 'Force: ' + strengths[index];
                text.style.color = colors[index];
            } else {
                text.textContent = '';
            }
        }

        // Soumission du formulaire
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const messageDiv = document.getElementById('message');
            const submitBtn = document.getElementById('submitBtn');
            
            // Récupérer les valeurs
            const fullName = document.getElementById('fullName').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const country = document.getElementById('country').value;
            const city = document.getElementById('city').value.trim();

            // Validation finale
            if (!fullName || !whatsapp || !email || !password || !confirmPassword || !country || !city) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            if (password !== confirmPassword) {
                showMessage('Les mots de passe ne correspondent pas', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Veuillez entrer un email valide', 'error');
                return;
            }

            // Désactiver le bouton
            submitBtn.disabled = true;
            submitBtn.textContent = 'Création en cours...';

            try {
                // Inscription avec Supabase
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            whatsapp: whatsapp,
                            country: country,
                            city: city
                        }
                    }
                });

                if (authError) throw authError;

                // Essayer d'insérer dans la table users (si elle existe)
                try {
                    const { error: insertError } = await supabase
                        .from('users')
                        .insert([
                            {
                                id: authData.user.id,
                                full_name: fullName,
                                whatsapp: whatsapp,
                                email: email,
                                country: country,
                                city: city,
                                created_at: new Date()
                            }
                        ]);
                    
                    if (insertError) console.log('Note: Table users peut-être inexistante');
                } catch (insertError) {
                    console.log('Insertion ignorée - table non créée');
                }

                showMessage('Compte créé avec succès ! Vérifiez votre email pour confirmer.', 'success');
                
                // Réinitialiser le formulaire
                document.getElementById('registerForm').reset();

                // Rediriger vers la page de connexion après 3 secondes
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 3000);

            } catch (error) {
                console.error('Erreur:', error);
                
                if (error.message.includes('User already registered')) {
                    showMessage('Cet email est déjà utilisé', 'error');
                } else {
                    showMessage(error.message || 'Une erreur est survenue', 'error');
                }
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'CRÉER MON COMPTE';
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = 'message ' + type;
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 5000);
        }
    </script>
</body>
</html>
