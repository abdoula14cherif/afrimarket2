<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Plateforme de petites annonces</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            position: relative;
        }

        /* Loader styles */
        .loader-wrapper {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1e3c72, #2a5298, #ff6b6b, #40e0d0, #ffa500);
            background-size: 400% 400%;
            animation: gradientBG 5s ease infinite;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease-in-out;
        }

        .loader-wrapper.fade-out {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .loader-content {
            text-align: center;
            color: white;
        }

        .loader-content h1 {
            font-size: 3rem;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
            letter-spacing: 4px;
        }

        .loader-spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 1s ease-in-out infinite;
            margin: 20px auto;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Main content styles */
        .main-content {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            transition: opacity 0.5s ease-in-out;
        }

        .main-content.visible {
            opacity: 1;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 500px;
            width: 100%;
            backdrop-filter: blur(10px);
            border: 3px solid transparent;
            background: linear-gradient(white, white) padding-box,
                        linear-gradient(135deg, #1e3c72, #ff6b6b, #40e0d0, #ffa500) border-box;
            border: 3px solid transparent;
        }

        h2 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
            background: linear-gradient(135deg, #1e3c72, #ff6b6b, #40e0d0, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: bold;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #2c3e50;
            font-weight: 600;
        }

        input, select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #ff6b6b;
            box-shadow: 0 0 10px rgba(255,107,107,0.3);
        }

        input:hover, select:hover {
            border-color: #40e0d0;
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #ff6b6b, #ffa500);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(255,107,107,0.4);
        }

        .message {
            margin-top: 20px;
            padding: 12px;
            border-radius: 8px;
            text-align: center;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
            display: block;
        }

        .color-bar {
            height: 5px;
            background: linear-gradient(90deg, #1e3c72, #ff6b6b, #40e0d0, #ffa500);
            margin: 20px 0;
            border-radius: 5px;
        }

        footer {
            text-align: center;
            margin-top: 20px;
            color: #fff;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <!-- Loader -->
    <div class="loader-wrapper" id="loader">
        <div class="loader-content">
            <h1>AFRIMARKET</h1>
            <div class="loader-spinner"></div>
            <p>Votre plateforme de confiance...</p>
        </div>
    </div>

    <!-- Main content -->
    <div class="main-content" id="mainContent">
        <div class="container">
            <h2>Inscription</h2>
            <div class="color-bar"></div>
            
            <form id="signupForm">
                <div class="form-group">
                    <label for="fullName">Nom complet</label>
                    <input type="text" id="fullName" name="fullName" required placeholder="Entrez votre nom complet">
                </div>

                <div class="form-group">
                    <label for="whatsapp">Numéro WhatsApp</label>
                    <input type="tel" id="whatsapp" name="whatsapp" required placeholder="Ex: +221 77 123 45 67">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required placeholder="exemple@email.com">
                </div>

                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required placeholder="Minimum 6 caractères" minlength="6">
                </div>

                <div class="form-group">
                    <label for="pay">Pays</label>
                    <select id="pay" name="pay" required>
                        <option value="">Sélectionnez votre pays</option>
                        <option value="Senegal">Sénégal</option>
                        <option value="Mali">Mali</option>
                        <option value="Cote d'Ivoire">Côte d'Ivoire</option>
                        <option value="Burkina Faso">Burkina Faso</option>
                        <option value="Niger">Niger</option>
                        <option value="Guinee">Guinée</option>
                        <option value="Mauritanie">Mauritanie</option>
                        <option value="Maroc">Maroc</option>
                        <option value="Algerie">Algérie</option>
                        <option value="Tunisie">Tunisie</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="ville">Ville</label>
                    <input type="text" id="ville" name="ville" required placeholder="Entrez votre ville">
                </div>

                <button type="submit" class="btn-submit" id="submitBtn">S'inscrire</button>
                
                <div id="message" class="message"></div>
            </form>
        </div>
    </div>

    <footer>
        <p>&copy; 2024 Afrimarket - Tous droits réservés</p>
    </footer>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://elgbvitijyjriozvzqpf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM';
        
        // Initialisation de Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Gestion du loader
        window.addEventListener('load', function() {
            setTimeout(function() {
                document.getElementById('loader').classList.add('fade-out');
                document.getElementById('mainContent').classList.add('visible');
            }, 5000);
        });

        // Gestion du formulaire
        document.getElementById('signupForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('message');
            
            // Récupération des valeurs
            const fullName = document.getElementById('fullName').value.trim();
            const whatsapp = document.getElementById('whatsapp').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const pay = document.getElementById('pay').value;
            const ville = document.getElementById('ville').value.trim();

            // Validation basique
            if (!fullName || !whatsapp || !email || !password || !pay || !ville) {
                showMessage('Veuillez remplir tous les champs', 'error');
                return;
            }

            if (password.length < 6) {
                showMessage('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            // Validation email
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showMessage('Veuillez entrer un email valide', 'error');
                return;
            }

            // Désactivation du bouton pendant l'envoi
            submitBtn.disabled = true;
            submitBtn.textContent = 'Inscription en cours...';
            messageDiv.style.display = 'none';

            try {
                // 1. Création de l'utilisateur dans Auth
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: fullName,
                            whatsapp: whatsapp,
                            country: pay,
                            city: ville
                        }
                    }
                });

                if (authError) throw authError;

                // 2. Insertion des données supplémentaires dans une table 'profiles'
                if (authData.user) {
                    const { error: profileError } = await supabase
                        .from('profiles')
                        .insert([
                            {
                                id: authData.user.id,
                                full_name: fullName,
                                whatsapp: whatsapp,
                                email: email,
                                country: pay,
                                city: ville,
                                created_at: new Date()
                            }
                        ]);

                    if (profileError) {
                        console.error('Erreur profil:', profileError);
                        // On continue même si l'insertion échoue, l'utilisateur est créé
                    }
                }

                showMessage('Inscription réussie ! Veuillez vérifier votre email pour confirmer votre compte.', 'success');
                document.getElementById('signupForm').reset();

            } catch (error) {
                console.error('Erreur complète:', error);
                
                let errorMessage = "Une erreur est survenue lors de l'inscription.";
                
                if (error.message) {
                    if (error.message.includes('already registered')) {
                        errorMessage = "Cet email est déjà utilisé.";
                    } else if (error.message.includes('password')) {
                        errorMessage = "Le mot de passe doit contenir au moins 6 caractères.";
                    } else {
                        errorMessage = error.message;
                    }
                }
                
                showMessage(errorMessage, 'error');
            } finally {
                // Réactivation du bouton
                submitBtn.disabled = false;
                submitBtn.textContent = 'S\'inscrire';
            }
        });

        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            // Scroll jusqu'au message
            messageDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        // Création de la table profiles si elle n'existe pas
        // Note: Cette partie doit être exécutée dans l'éditeur SQL de Supabase
        /*
        CREATE TABLE profiles (
            id UUID REFERENCES auth.users PRIMARY KEY,
            full_name TEXT NOT NULL,
            whatsapp TEXT NOT NULL,
            email TEXT NOT NULL,
            country TEXT NOT NULL,
            city TEXT NOT NULL,
            created_at TIMESTAMP DEFAULT NOW()
        );
        */
    </script>
</body>
</html>
