<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Afrimarket - Plateforme de petites annonces</title>
    <style>
        :root {
            --primary-blue: #0066cc;
            --primary-red: #ff4444;
            --primary-orange: #ff8800;
            --primary-turquoise: #40e0d0;
            --white: #ffffff;
            --light-gray: #f5f5f5;
            --dark-gray: #333333;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, var(--primary-blue), var(--primary-red), var(--primary-turquoise), var(--primary-orange));
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .logo {
            background: var(--white);
            padding: 30px 20px;
            text-align: center;
            border-bottom: 3px solid var(--primary-turquoise);
        }

        .logo h1 {
            font-size: 2.8rem;
            margin-bottom: 5px;
            color: var(--primary-blue);
            font-weight: 800;
            letter-spacing: 2px;
        }

        .logo span {
            color: var(--dark-gray);
            font-size: 0.9rem;
        }

        .form-container {
            padding: 30px;
        }

        .form-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            background: var(--light-gray);
            padding: 5px;
            border-radius: 10px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px;
            border: none;
            background: transparent;
            color: var(--dark-gray);
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            border-radius: 8px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            background: var(--primary-blue);
            color: var(--white);
        }

        .tab-btn:hover {
            background: var(--primary-turquoise);
            color: var(--white);
        }

        .form {
            display: none;
        }

        .form.active {
            display: block;
        }

        .form h2 {
            text-align: center;
            margin-bottom: 25px;
            color: var(--dark-gray);
            font-size: 1.8rem;
        }

        .form input, .form select {
            width: 100%;
            padding: 15px;
            margin-bottom: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form input:focus, .form select:focus {
            outline: none;
            border-color: var(--primary-turquoise);
        }

        .btn-primary {
            width: 100%;
            padding: 15px;
            background: var(--primary-blue);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .btn-primary:hover {
            background: var(--primary-orange);
            transform: translateY(-2px);
        }

        .btn-primary:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 25px;
            border-radius: 10px;
            color: var(--white);
            font-weight: 600;
            display: none;
            z-index: 1000;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
        }

        .alert.success {
            background: #28a745;
        }

        .alert.error {
            background: #dc3545;
        }

        .alert.info {
            background: var(--primary-blue);
        }

        .color-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--primary-blue), var(--primary-red), var(--primary-turquoise), var(--primary-orange));
            margin: 20px 0;
        }

        .forgot-password {
            text-align: center;
            margin-top: 15px;
        }

        .forgot-password a {
            color: var(--primary-blue);
            text-decoration: none;
        }

        .forgot-password a:hover {
            color: var(--primary-red);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">
            <h1>AFRIMARKET</h1>
            <span>Petites annonces • Facile • Rapide • Local</span>
        </div>
        
        <div class="form-container">
            <div class="form-tabs">
                <button class="tab-btn active" onclick="showForm('login')">Connexion</button>
                <button class="tab-btn" onclick="showForm('register')">Inscription</button>
            </div>
            
            <!-- Formulaire de connexion -->
            <div id="loginForm" class="form active">
                <h2>Bienvenue !</h2>
                <input type="email" id="loginEmail" placeholder="Email" required>
                <input type="password" id="loginPassword" placeholder="Mot de passe" required>
                <button class="btn-primary" onclick="login()">Se connecter</button>
                <div class="forgot-password">
                    <a href="#" onclick="showAlert('Contactez le support pour réinitialiser votre mot de passe', 'info')">Mot de passe oublié ?</a>
                </div>
            </div>
            
            <!-- Formulaire d'inscription -->
            <div id="registerForm" class="form">
                <h2>Créer un compte</h2>
                <input type="text" id="regName" placeholder="Nom complet" required>
                <input type="tel" id="regWhatsapp" placeholder="Numéro WhatsApp" required>
                <input type="email" id="regEmail" placeholder="Email" required>
                <input type="password" id="regPassword" placeholder="Mot de passe (min. 6 caractères)" required>
                
                <select id="regCountry" required>
                    <option value="">Sélectionnez votre pays</option>
                    <option value="Senegal">Sénégal</option>
                    <option value="Mali">Mali</option>
                    <option value="Cote d'Ivoire">Côte d'Ivoire</option>
                    <option value="Burkina Faso">Burkina Faso</option>
                    <option value="Niger">Niger</option>
                </select>
                
                <input type="text" id="regCity" placeholder="Ville" required>
                
                <button class="btn-primary" onclick="register()">S'inscrire sur Afrimarket</button>
                <div class="color-bar"></div>
            </div>
        </div>
    </div>
    
    <div id="alertMessage" class="alert"></div>

    <!-- Supabase JS -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script>
        // Configuration Supabase
        const SUPABASE_URL = 'https://elgbvitijyjriozvzqpf.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM';
        
        // Initialisation de Supabase
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Fonction pour afficher les alertes
        function showAlert(message, type) {
            const alert = document.getElementById('alertMessage');
            alert.textContent = message;
            alert.className = `alert ${type}`;
            alert.style.display = 'block';
            
            setTimeout(() => {
                alert.style.display = 'none';
            }, 4000);
        }

        // Fonction pour changer d'onglet
        window.showForm = function(form) {
            // Mettre à jour les boutons
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            // Mettre à jour les formulaires
            document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
            
            if(form === 'login') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('loginForm').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('registerForm').classList.add('active');
            }
        }

        // Fonction de connexion
        window.login = async function() {
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value;
            
            if(!email || !password) {
                showAlert('Veuillez remplir tous les champs', 'error');
                return;
            }

            try {
                const { data, error } = await supabase.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    console.error('Erreur Supabase:', error);
                    showAlert('Email ou mot de passe incorrect', 'error');
                    return;
                }

                if (data.user) {
                    showAlert('Connexion réussie !', 'success');
                    console.log('Utilisateur connecté:', data.user);
                    // Redirection après connexion
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1500);
                }

            } catch (error) {
                console.error('Erreur:', error);
                showAlert('Erreur de connexion au serveur', 'error');
            }
        }

        // Fonction d'inscription
        window.register = async function() {
            const name = document.getElementById('regName').value.trim();
            const whatsapp = document.getElementById('regWhatsapp').value.trim();
            const email = document.getElementById('regEmail').value.trim();
            const password = document.getElementById('regPassword').value;
            const country = document.getElementById('regCountry').value;
            const city = document.getElementById('regCity').value.trim();

            // Validations
            if(!name || !whatsapp || !email || !password || !country || !city) {
                showAlert('Veuillez remplir tous les champs', 'error');
                return;
            }

            if (password.length < 6) {
                showAlert('Le mot de passe doit contenir au moins 6 caractères', 'error');
                return;
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showAlert('Email invalide', 'error');
                return;
            }

            const phoneRegex = /^[0-9+\s]{8,}$/;
            if (!phoneRegex.test(whatsapp)) {
                showAlert('Numéro WhatsApp invalide', 'error');
                return;
            }

            // Désactiver le bouton
            const submitBtn = document.querySelector('#registerForm .btn-primary');
            submitBtn.disabled = true;
            submitBtn.textContent = 'Inscription en cours...';

            try {
                // 1. Créer l'utilisateur
                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email: email,
                    password: password,
                    options: {
                        data: {
                            full_name: name,
                            whatsapp: whatsapp,
                            country: country,
                            city: city
                        }
                    }
                });

                if (authError) {
                    console.error('Erreur auth:', authError);
                    
                    if (authError.message.includes('already registered')) {
                        showAlert('Cet email est déjà utilisé', 'error');
                    } else {
                        showAlert(authError.message, 'error');
                    }
                    return;
                }

                if (authData.user) {
                    showAlert('Inscription réussie ! Vérifiez votre email.', 'success');
                    
                    // Réinitialiser le formulaire
                    document.getElementById('regName').value = '';
                    document.getElementById('regWhatsapp').value = '';
                    document.getElementById('regEmail').value = '';
                    document.getElementById('regPassword').value = '';
                    document.getElementById('regCountry').value = '';
                    document.getElementById('regCity').value = '';
                    
                    // Basculer vers connexion
                    setTimeout(() => {
                        showForm('login');
                    }, 2000);
                }

            } catch (error) {
                console.error('Erreur:', error);
                showAlert('Erreur lors de l\'inscription', 'error');
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "S'inscrire sur Afrimarket";
            }
        }

        // Vérifier la connexion au démarrage
        async function checkConnection() {
            try {
                const { data, error } = await supabase.auth.getSession();
                if (error) {
                    console.error('Erreur de session:', error);
                    showAlert('Problème de connexion à Supabase', 'error');
                } else {
                    console.log('Supabase connecté avec succès');
                    if (data.session) {
                        console.log('Utilisateur déjà connecté');
                    }
                }
            } catch (error) {
                console.error('Erreur de connexion:', error);
            }
        }

        // Lancer la vérification au chargement
        window.onload = function() {
            checkConnection();
        };
    </script>
</body>
</html>
