<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Parrainage — AfriMarket</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
:root{--blue:#1B3FE4;--turq:#00C2B7;--green:#00C271;--red:#E83030;--orange:#FF6B1A;--gold:#F5B731;--dark:#080E2A;--gray:#8892A4;--border:#E4E9F8;--bg:#F2F5FF;}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--dark);}
.hdr{background:linear-gradient(135deg,var(--dark),var(--green));padding:1.2rem 1.5rem;display:flex;align-items:center;justify-content:space-between;}
.hdr-title{font-size:1.1rem;font-weight:800;color:white;}
.hdr-back{color:rgba(255,255,255,.7);font-size:.8rem;text-decoration:none;background:rgba(255,255,255,.1);padding:.35rem .8rem;border-radius:99px;}
.tabs{display:flex;background:white;border-bottom:1px solid var(--border);}
.tab{flex:1;padding:.8rem;text-align:center;font-size:.8rem;font-weight:700;color:var(--gray);cursor:pointer;border-bottom:3px solid transparent;}
.tab.active{color:var(--green);border-color:var(--green);}
.content{padding:1rem 1.2rem;}
.stats-row{display:grid;grid-template-columns:repeat(3,1fr);gap:.7rem;margin-bottom:1.2rem;}
.stat-box{background:white;border-radius:14px;padding:.9rem;text-align:center;box-shadow:0 2px 10px rgba(8,14,42,.05);}
.stat-n{font-size:1.4rem;font-weight:800;}
.stat-l{font-size:.65rem;color:var(--gray);margin-top:.2rem;}
.section-title{font-size:.9rem;font-weight:800;margin-bottom:.7rem;color:var(--dark);}
.pay-card{background:white;border-radius:14px;padding:1rem;margin-bottom:.7rem;box-shadow:0 2px 10px rgba(8,14,42,.05);}
.pay-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:.6rem;}
.pay-name{font-weight:700;font-size:.9rem;}
.pay-email{font-size:.7rem;color:var(--gray);}
.pay-ref{font-family:monospace;font-size:.78rem;background:var(--bg);padding:.3rem .6rem;border-radius:8px;color:var(--blue);font-weight:700;}
.pay-info{font-size:.75rem;color:var(--gray);margin-bottom:.7rem;line-height:1.6;}
.pay-btns{display:flex;gap:.5rem;}
.btn-valider{flex:1;padding:.55rem;border-radius:10px;background:var(--green);color:white;font-weight:700;font-size:.78rem;border:none;cursor:pointer;}
.btn-refuser{flex:1;padding:.55rem;border-radius:10px;background:rgba(232,48,48,.1);color:var(--red);font-weight:700;font-size:.78rem;border:1.5px solid rgba(232,48,48,.2);cursor:pointer;}
.status-badge{font-size:.65rem;font-weight:800;padding:.2rem .6rem;border-radius:99px;}
.s-pend{background:rgba(245,183,49,.15);color:#9a6e00;}
.s-actif{background:rgba(0,194,183,.12);color:var(--green);}
.s-refuse{background:rgba(232,48,48,.1);color:var(--red);}
.compte-card{background:white;border-radius:14px;padding:1rem;margin-bottom:.7rem;box-shadow:0 2px 10px rgba(8,14,42,.05);}
.compte-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:.4rem;}
.compte-name{font-weight:700;font-size:.88rem;}
.compte-code{font-family:monospace;font-size:.75rem;color:var(--blue);background:var(--bg);padding:.2rem .5rem;border-radius:6px;}
.compte-stats{font-size:.72rem;color:var(--gray);}
.tab-ct{display:none;}
.tab-ct.active{display:block;}
.empty{text-align:center;padding:2rem;color:var(--gray);font-size:.82rem;}
.f-row{display:flex;gap:.5rem;align-items:center;margin-bottom:.8rem;}
.f-inp{flex:1;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--border);font-size:.85rem;font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);outline:none;}
.f-inp:focus{border-color:var(--green);}
.btn-search{padding:.6rem 1rem;border-radius:10px;background:var(--green);color:white;font-weight:700;font-size:.82rem;border:none;cursor:pointer;}
.btn-activer-manuel{padding:.55rem .9rem;border-radius:10px;background:var(--blue);color:white;font-weight:700;font-size:.75rem;border:none;cursor:pointer;}
#toast{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%) translateY(10px);background:var(--dark);color:white;padding:.65rem 1.2rem;border-radius:12px;font-size:.8rem;font-weight:600;opacity:0;pointer-events:none;transition:all .3s;z-index:999;white-space:nowrap;}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
#toast.success{background:var(--green);}#toast.error{background:var(--red);}#toast.warning{background:var(--orange);}
.spin{width:24px;height:24px;border:3px solid var(--border);border-top-color:var(--green);border-radius:50%;animation:spin .7s linear infinite;margin:2rem auto;}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div class="hdr">
  <div>
    <div class="hdr-title">&#9881;&#65039; Admin Parrainage</div>
    <div style="color:rgba(255,255,255,.6);font-size:.7rem;">Gérer les activations et commissions</div>
  </div>
  <a class="hdr-back" href="dashboard.html">&#8592; Retour</a>
</div>

<!-- TABS -->
<div class="tabs">
  <div class="tab active" id="tabPay" onclick="switchTab('Pay')">&#128178; Paiements (<span id="nbPend">0</span>)</div>
  <div class="tab" id="tabComptes" onclick="switchTab('Comptes')">&#128101; Comptes</div>
  <div class="tab" id="tabStats" onclick="switchTab('Stats')">&#128202; Stats</div>
</div>

<div class="content">

  <!-- TAB PAIEMENTS -->
  <div class="tab-ct active" id="tabCtPay">
    <div style="display:flex;gap:.5rem;margin-bottom:1rem;">
      <button onclick="chargerPaiements('en_attente')" id="filterPend" style="padding:.35rem .8rem;border-radius:99px;background:var(--green);color:white;font-size:.72rem;font-weight:700;border:none;cursor:pointer;">En attente</button>
      <button onclick="chargerPaiements('valide')" id="filterVal" style="padding:.35rem .8rem;border-radius:99px;background:var(--bg);color:var(--gray);font-size:.72rem;font-weight:700;border:1.5px solid var(--border);cursor:pointer;">Validés</button>
      <button onclick="chargerPaiements('refuse')" id="filterRef" style="padding:.35rem .8rem;border-radius:99px;background:var(--bg);color:var(--gray);font-size:.72rem;font-weight:700;border:1.5px solid var(--border);cursor:pointer;">Refusés</button>
    </div>
    <div id="listPay"><div class="spin"></div></div>
  </div>

  <!-- TAB COMPTES -->
  <div class="tab-ct" id="tabCtComptes">
    <div class="f-row">
      <input class="f-inp" id="searchUser" placeholder="Email ou code parrain..."/>
      <button class="btn-search" onclick="rechercherCompte()">&#128269; Chercher</button>
    </div>
    <div id="listComptes"><div class="spin"></div></div>
  </div>

  <!-- TAB STATS -->
  <div class="tab-ct" id="tabCtStats">
    <div class="stats-row" id="statsBoxes">
      <div class="stat-box"><div class="stat-n" id="stTotal">—</div><div class="stat-l">Comptes total</div></div>
      <div class="stat-box"><div class="stat-n" id="stActifs">—</div><div class="stat-l">Comptes actifs</div></div>
      <div class="stat-box"><div class="stat-n" id="stAttente">—</div><div class="stat-l">En attente</div></div>
      <div class="stat-box"><div class="stat-n" id="stRevenu">—</div><div class="stat-l">FCFA collectés</div></div>
      <div class="stat-box"><div class="stat-n" id="stGains">—</div><div class="stat-l">Commissions dist.</div></div>
      <div class="stat-box"><div class="stat-n" id="stRetraits">—</div><div class="stat-l">Retraits demandés</div></div>
    </div>
    <button onclick="chargerStats()" style="width:100%;padding:.7rem;border-radius:12px;background:var(--green);color:white;font-weight:700;border:none;cursor:pointer;margin-top:.5rem;">&#128260; Actualiser</button>
  </div>

</div>

<div id="toast"></div>

<script>

'use strict';
var sb=supabase.createClient('https://elgbvitijyjriozvzqpf.supabase.co','eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVsZ2J2aXRpanlqcmlvenZ6cXBmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzODczNDcsImV4cCI6MjA4Njk2MzM0N30.7juarApMsBUf4b2n8ObuWYl2hMHahQC-qwjORjCTkIM');
var ADMIN_EMAIL='abdoula13cherif@gmail.com';
var U=null;

(async function(){
  var s=await sb.auth.getSession();
  if(!s.data.session){location.href='auth.html';return;}
  U=s.data.session.user;
  if(U.email!==ADMIN_EMAIL){alert('Acces refuse');location.href='dashboard.html';return;}
  chargerPaiements('en_attente');
  chargerStats();
})();

function fmt(n){return Number(n||0).toLocaleString('fr-FR');}
var _tt;
function toast(msg,type){
  var el=document.getElementById('toast');
  if(!el)return;
  el.textContent=msg;el.className='show';
  if(type==='success')el.style.background='#00C271';
  else if(type==='error')el.style.background='#E83030';
  else if(type==='warning')el.style.background='#FF6B1A';
  else el.style.background='#080E2A';
  clearTimeout(_tt);
  _tt=setTimeout(function(){el.className='';el.textContent='';el.style.background='';},4000);
}

function switchTab(t){
  ['Pay','Comptes','Stats'].forEach(function(x){
    var btn=document.getElementById('tab'+x);
    var ct=document.getElementById('tabCt'+x);
    if(btn)btn.classList.toggle('active',x===t);
    if(ct)ct.classList.toggle('active',x===t);
  });
  if(t==='Comptes')chargerComptes();
  if(t==='Stats')chargerStats();
}

async function chargerPaiements(statut){
  var el=document.getElementById('listPay');
  if(!el)return;
  el.innerHTML='<div class="spin"></div>';
  // Mettre à jour les filtres visuels
  var filterMap={en_attente:'filterPend',valide:'filterVal',refuse:'filterRef'};
  Object.keys(filterMap).forEach(function(s){
    var btn=document.getElementById(filterMap[s]);
    if(!btn)return;
    if(s===statut){btn.style.background='var(--green)';btn.style.color='white';btn.style.border='none';}
    else{btn.style.background='var(--bg)';btn.style.color='var(--gray)';btn.style.border='1.5px solid var(--border)';}
  });
  try{
    var r=await sb.from('parrainage_paiements').select('*').eq('statut',statut).order('created_at',{ascending:false});
    if(r.error&&r.error.code==='42P01'){el.innerHTML='<div class="empty">Execute parrainage_sql.sql dans Supabase</div>';return;}
    var pays=r.data||[];
    if(statut==='en_attente'){var nb=document.getElementById('nbPend');if(nb)nb.textContent=pays.length;}
    if(!pays.length){el.innerHTML='<div class="empty">Aucun paiement '+statut+'</div>';return;}
    // Pour chaque paiement, récupérer le profil utilisateur
    var html='';
    for(var i=0;i<pays.length;i++){
      var p=pays[i];
      var name='Inconnu'; var email=p.user_id.slice(0,12)+'...';
      try{
        var rp=await sb.from('profiles').select('full_name,email').eq('id',p.user_id).single();
        if(rp.data){name=rp.data.full_name||'Inconnu';email=rp.data.email||email;}
      }catch(e){}
      var d=new Date(p.created_at).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});
      var sClass={en_attente:'s-pend',valide:'s-actif',refuse:'s-refuse'}[p.statut]||'s-pend';
      var sText={en_attente:'En attente',valide:'Valide',refuse:'Refuse'}[p.statut]||p.statut;
      var pId=p.id; var pUserId=p.user_id;
      html+='<div class="pay-card" id="pay-'+i+'">'+
        '<div class="pay-top">'+
          '<div><div class="pay-name">'+esc(name)+'</div><div class="pay-email">'+esc(email)+'</div></div>'+
          '<span class="status-badge '+sClass+'">'+sText+'</span>'+
        '</div>'+
        '<div class="pay-ref">Ref: '+esc(p.ref_paiement||'—')+'</div>'+
        '<div class="pay-info" style="margin-top:.4rem;">&#128241; '+esc(p.methode||'—')+' &nbsp;&#183;&nbsp; &#128178; '+fmt(p.montant)+' FCFA &nbsp;&#183;&nbsp; &#128222; '+esc(p.numero_paiement||'—')+' &nbsp;&#183;&nbsp; &#128197; '+d+'</div>'+
        (p.statut==='en_attente'?'<div class="pay-btns" id="btns-'+i+'"></div>':
          '<div style="font-size:.72rem;color:var(--gray);">Traite le '+(p.validated_at?new Date(p.validated_at).toLocaleDateString('fr-FR'):'—')+'</div>')+
      '</div>';
    }
    el.innerHTML=html;
    // Attacher les events
    for(var j=0;j<pays.length;j++){
      var pay2=pays[j];
      if(pay2.statut==='en_attente'){
        var btnsEl=document.getElementById('btns-'+j);
        if(btnsEl){
          var btnV=document.createElement('button');
          btnV.className='btn-valider';
          btnV.textContent='Valider & Activer';
          btnV.onclick=(function(pid,uid){return function(){validerPaiement(pid,uid);};})(pay2.id,pay2.user_id);
          var btnR=document.createElement('button');
          btnR.className='btn-refuser';
          btnR.textContent='Refuser';
          btnR.onclick=(function(pid,uid){return function(){refuserPaiement(pid,uid);};})(pay2.id,pay2.user_id);
          btnsEl.appendChild(btnV);
          btnsEl.appendChild(btnR);
        }
      }
    }
  }catch(e){el.innerHTML='<div class="empty">Erreur: '+esc(e.message)+'</div>';}
}

async function validerPaiement(payId,userId){
  if(!confirm('Valider ce paiement et activer le compte ?'))return;
  try{
    toast('Activation en cours...','info');
    // 1. Valider le paiement
    var r1=await sb.from('parrainage_paiements').update({statut:'valide',validated_at:new Date().toISOString(),validated_by:U.id}).eq('id',payId);
    if(r1.error)throw r1.error;
    // 2. Activer le compte (ou le créer)
    var rc=await sb.from('parrainage_comptes').select('*').eq('user_id',userId).maybeSingle();
    var compte=null;
    if(rc.data){
      var ru=await sb.from('parrainage_comptes').update({statut:'actif',activated_at:new Date().toISOString()}).eq('user_id',userId).select().single();
      compte=ru.data||rc.data; compte.statut='actif';
    }else{
      var code='AM-'+userId.substring(0,8).toUpperCase();
      var ins=await sb.from('parrainage_comptes').insert({user_id:userId,code_parrain:code,statut:'actif',solde:0,total_gains:0,total_filleuls:0,activated_at:new Date().toISOString()}).select().single();
      if(ins.error)throw ins.error;
      compte=ins.data;
    }
    // 3. Distribuer les commissions
    if(compte)await distribuerCommissions(compte);
    toast('Compte active et commissions distribuees !','success');
    chargerPaiements('en_attente');
    chargerStats();
  }catch(e){toast('Erreur: '+e.message,'error');console.error(e);}
}

async function distribuerCommissions(compte){
  if(!compte.parrain_id)return;
  var niveaux=[{id:compte.parrain_id,n:1,m:1250}];
  try{
    var rN1=await sb.from('parrainage_comptes').select('parrain_id').eq('id',compte.parrain_id).single();
    if(!rN1.error&&rN1.data&&rN1.data.parrain_id){
      niveaux.push({id:rN1.data.parrain_id,n:2,m:625});
      var rN2=await sb.from('parrainage_comptes').select('parrain_id').eq('id',rN1.data.parrain_id).single();
      if(!rN2.error&&rN2.data&&rN2.data.parrain_id)
        niveaux.push({id:rN2.data.parrain_id,n:3,m:300});
    }
  }catch(e){console.warn(e.message);}
  for(var x=0;x<niveaux.length;x++){
    var niv=niveaux[x];
    try{
      await sb.from('parrainage_gains').insert({beneficiaire_id:niv.id,source_id:compte.id,niveau:niv.n,montant:niv.m,statut:'disponible'});
      var rs=await sb.from('parrainage_comptes').select('solde,total_gains,total_filleuls').eq('id',niv.id).single();
      if(!rs.error&&rs.data){
        await sb.from('parrainage_comptes').update({
          solde:(rs.data.solde||0)+niv.m,
          total_gains:(rs.data.total_gains||0)+niv.m,
          total_filleuls:(rs.data.total_filleuls||0)+(niv.n===1?1:0)
        }).eq('id',niv.id);
      }
    }catch(e){console.warn('N'+niv.n+':',e.message);}
  }
}

async function refuserPaiement(payId,userId){
  if(!confirm('Refuser ce paiement ?'))return;
  try{
    var r=await sb.from('parrainage_paiements').update({statut:'refuse',validated_at:new Date().toISOString(),validated_by:U.id}).eq('id',payId);
    if(r.error)throw r.error;
    toast('Paiement refuse','warning');
    chargerPaiements('en_attente');
  }catch(e){toast('Erreur: '+e.message,'error');}
}

async function chargerComptes(){
  var el=document.getElementById('listComptes');
  if(!el)return;
  el.innerHTML='<div class="spin"></div>';
  try{
    var r=await sb.from('parrainage_comptes').select('*').order('created_at',{ascending:false}).limit(50);
    if(r.error&&r.error.code==='42P01'){el.innerHTML='<div class="empty">Execute parrainage_sql.sql</div>';return;}
    var comptes=r.data||[];
    if(!comptes.length){el.innerHTML='<div class="empty">Aucun compte parrainage</div>';return;}
    // Récupérer les profils
    var userIds=comptes.map(function(c){return c.user_id;});
    var rProf=await sb.from('profiles').select('id,full_name,email').in('id',userIds);
    var profMap={};
    (rProf.data||[]).forEach(function(p){profMap[p.id]=p;});
    var html='';
    comptes.forEach(function(c,idx){
      var prof=profMap[c.user_id]||{};
      var name=prof.full_name||'Inconnu';
      var email=prof.email||c.user_id.slice(0,15)+'...';
      var sc={actif:'s-actif',inactif:'s-pend'}[c.statut]||'s-pend';
      html+='<div class="compte-card" id="cpte-'+idx+'">'+
        '<div class="compte-row">'+
          '<div><div class="compte-name">'+esc(name)+'</div><div style="font-size:.7rem;color:var(--gray)">'+esc(email)+'</div></div>'+
          '<span class="status-badge '+sc+'">'+c.statut+'</span>'+
        '</div>'+
        '<div class="compte-row">'+
          '<span class="compte-code">'+esc(c.code_parrain)+'</span>'+
          '<span class="compte-stats">F1: '+(c.total_filleuls||0)+' &nbsp;&#183;&nbsp; Gains: '+fmt(c.total_gains||0)+'F &nbsp;&#183;&nbsp; Solde: '+fmt(c.solde||0)+'F</span>'+
        '</div>'+
        '<div id="act-btns-'+idx+'"></div>'+
      '</div>';
    });
    el.innerHTML=html;
    // Attacher les boutons
    comptes.forEach(function(c,idx){
      var btnsEl=document.getElementById('act-btns-'+idx);
      if(!btnsEl)return;
      if(c.statut==='inactif'){
        var btnA=document.createElement('button');
        btnA.className='btn-activer-manuel';
        btnA.textContent='Activer manuellement';
        btnA.onclick=(function(uid,cid){return function(){activerManuel(uid,cid);};})(c.user_id,c.id);
        btnsEl.appendChild(btnA);
      }else if(c.statut==='actif'){
        var btnD=document.createElement('button');
        btnD.style.cssText='padding:.55rem .9rem;border-radius:10px;background:rgba(232,48,48,.1);color:#E83030;font-weight:700;font-size:.75rem;border:1.5px solid rgba(232,48,48,.2);cursor:pointer;';
        btnD.textContent='Desactiver';
        btnD.onclick=(function(uid,cid){return function(){desactiverCompte(uid,cid);};})(c.user_id,c.id);
        btnsEl.appendChild(btnD);
      }
    });
  }catch(e){el.innerHTML='<div class="empty">Erreur: '+esc(e.message)+'</div>';}
}

async function activerManuel(userId,compteId){
  if(!confirm('Activer ce compte manuellement ?'))return;
  try{
    var ru=await sb.from('parrainage_comptes').update({statut:'actif',activated_at:new Date().toISOString()}).eq('id',compteId).select().single();
    if(ru.error)throw ru.error;
    if(ru.data)await distribuerCommissions(ru.data);
    toast('Compte active !','success');
    chargerComptes();
  }catch(e){toast('Erreur: '+e.message,'error');}
}

async function desactiverCompte(userId,compteId){
  if(!confirm('Desactiver ce compte ? Les commissions distribuees seront annulees.'))return;
  try{
    await sb.from('parrainage_comptes').update({statut:'inactif',activated_at:null}).eq('id',compteId);
    await sb.from('parrainage_paiements').update({statut:'refuse_apres_activation'}).eq('user_id',userId).eq('statut','valide');
    // Annuler les gains
    var rg=await sb.from('parrainage_gains').select('beneficiaire_id,montant').eq('source_id',compteId);
    await sb.from('parrainage_gains').update({statut:'annule'}).eq('source_id',compteId);
    var gains=rg.data||[];
    for(var i=0;i<gains.length;i++){
      var g=gains[i];
      var rs=await sb.from('parrainage_comptes').select('solde,total_gains').eq('id',g.beneficiaire_id).single();
      if(!rs.error&&rs.data){
        await sb.from('parrainage_comptes').update({
          solde:Math.max(0,(rs.data.solde||0)-g.montant),
          total_gains:Math.max(0,(rs.data.total_gains||0)-g.montant)
        }).eq('id',g.beneficiaire_id);
      }
    }
    toast('Compte desactive et commissions annulees','success');
    chargerComptes();
    chargerStats();
  }catch(e){toast('Erreur: '+e.message,'error');}
}

async function rechercherCompte(){
  var q=document.getElementById('searchUser').value.trim().toLowerCase();
  if(!q)return chargerComptes();
  var el=document.getElementById('listComptes');
  el.innerHTML='<div class="spin"></div>';
  try{
    var r=await sb.from('parrainage_comptes').select('*').ilike('code_parrain','%'+q+'%').limit(20);
    if(!r.data||!r.data.length){el.innerHTML='<div class="empty">Aucun resultat</div>';return;}
    // Re-afficher avec ces données
    var html='';
    r.data.forEach(function(c,idx){
      var sc={actif:'s-actif',inactif:'s-pend'}[c.statut]||'s-pend';
      html+='<div class="compte-card">'+
        '<div class="compte-row"><div><div class="compte-name">'+esc(c.code_parrain)+'</div><div style="font-size:.7rem;color:var(--gray)">'+c.user_id.slice(0,20)+'</div></div>'+
        '<span class="status-badge '+sc+'">'+c.statut+'</span></div>'+
        '<div class="compte-row"><span class="compte-stats">Gains: '+fmt(c.total_gains||0)+'F &nbsp; Solde: '+fmt(c.solde||0)+'F</span></div>'+
        (c.statut==='inactif'?'<button id="sr-'+idx+'" class="btn-activer-manuel">Activer</button>':'')+
      '</div>';
    });
    el.innerHTML=html;
    r.data.forEach(function(c,idx){
      if(c.statut==='inactif'){
        var btn=document.getElementById('sr-'+idx);
        if(btn)btn.onclick=(function(uid,cid){return function(){activerManuel(uid,cid);};})(c.user_id,c.id);
      }
    });
  }catch(e){el.innerHTML='<div class="empty">Erreur: '+esc(e.message)+'</div>';}
}

async function chargerStats(){
  try{
    var r1=await sb.from('parrainage_comptes').select('statut');
    var r2=await sb.from('parrainage_paiements').select('statut,montant');
    var r3=await sb.from('parrainage_gains').select('montant');
    var r4=await sb.from('parrainage_retraits').select('montant');
    if(r1.error&&r1.error.code==='42P01'){document.getElementById('stTotal').textContent='SQL manquant';return;}
    var comptes=r1.data||[];
    var pays=r2.data||[];
    var gains=r3.data||[];
    var retraits=r4.data||[];
    var setEl=function(id,val){var el=document.getElementById(id);if(el)el.textContent=val;};
    setEl('stTotal',comptes.length);
    setEl('stActifs',comptes.filter(function(c){return c.statut==='actif';}).length);
    setEl('stAttente',pays.filter(function(p){return p.statut==='en_attente';}).length);
    setEl('stRevenu',fmt(pays.filter(function(p){return p.statut==='valide';}).reduce(function(s,p){return s+(p.montant||0);},0))+' F');
    setEl('stGains',fmt(gains.reduce(function(s,g){return s+(g.montant||0);},0))+' F');
    setEl('stRetraits',fmt(retraits.reduce(function(s,r){return s+(r.montant||0);},0))+' F');
    var nb=document.getElementById('nbPend');
    if(nb)nb.textContent=pays.filter(function(p){return p.statut==='en_attente';}).length;
  }catch(e){console.warn(e.message);}
}

function esc(s){var d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}

</script>
